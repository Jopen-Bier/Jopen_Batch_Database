<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>Jopen — Edit Product Sheet</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="jopen-shared.css">
<style>
  :root { --ink:#1c2b26; --paper:#f6f4ee; --line:#d8d2c4; --hop:#4c6b4f; --hop-dark:#33473a; --mono: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, Helvetica, sans-serif; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--paper); color:var(--ink); font-family: Arial, Helvetica, sans-serif; }
  main { padding:24px 32px 60px; max-width:720px; margin:0 auto; }
  .back-link { display:inline-block; margin-bottom:16px; padding:6px 14px; border:1px solid var(--line); border-radius:20px; text-decoration:none; color:var(--ink); font-family:var(--mono); font-size:12px; background:#fff; }
  h2 { margin:0 0 20px; }
  fieldset { border:1px solid var(--line); border-radius:6px; margin-bottom:18px; padding:16px 20px; }
  legend { font-family:var(--mono); font-size:12px; text-transform:uppercase; letter-spacing:0.06em; color:#6b6355; padding:0 6px; }
  label { display:block; font-size:13px; color:#6b6355; margin-top:12px; }
  label:first-child { margin-top:0; }
  input, textarea, select { width:100%; padding:8px 10px; margin-top:4px; border:1px solid var(--line); border-radius:4px; font-family:inherit; font-size:14px; }
  textarea { min-height:70px; }
  .row2 { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
  .row3 { display:grid; grid-template-columns:1fr 1fr 1fr; gap:16px; }
  .actions { display:flex; gap:10px; margin-top:10px; }
  button { background:var(--hop-dark); color:#fff; border:none; padding:10px 20px; border-radius:20px; font-family:var(--mono); font-size:13px; cursor:pointer; }
  button:hover { background:var(--hop); }
  button:disabled { opacity:0.5; cursor:default; }
  .hint { font-size:12px; color:#7a7266; margin-top:16px; }
  .error { color:#a33f2c; font-size:13px; margin-top:10px; }
</style>
</head>
<body>
<div id="jopen-nav"></div>
<script src="config.js"></script>
<script src="nav.js"></script>
<main>
  <a class="back-link" id="terug-link" href="receptoverzicht.html">&larr; Back</a>
  <div id="container">Loading…</div>
</main>
<script>
let recipeGroupId = null;
let productSheetId = null;

window.addEventListener('DOMContentLoaded', async () => {
  const gebruiker = await getHuidigeGebruiker();
  const magBewerken = !!gebruiker && await magBewerkenModule('product_sheets');
  if (!magBewerken) {
    document.getElementById('container').innerHTML = '<div class="error">You do not have permission to edit product sheets.</div>';
    return;
  }

  recipeGroupId = new URLSearchParams(window.location.search).get('recipe_group_id');
  if (!recipeGroupId) {
    document.getElementById('container').innerHTML = '<div class="error">No product sheet specified.</div>';
    return;
  }
  document.getElementById('terug-link').href = `productsheet.html?recipe_group_id=${recipeGroupId}`;

  const { data: p, error } = await supabaseClient.from('product_sheets').select('*').eq('recipe_group_id', recipeGroupId).maybeSingle();
  if (error) {
    document.getElementById('container').innerHTML = `<div class="error">${error.message}</div>`;
    return;
  }
  if (!p) {
    document.getElementById('container').innerHTML = '<div class="error">This product sheet does not exist yet — create it first from the product sheet page.</div>';
    return;
  }
  productSheetId = p.id;
  renderForm(p);
});

function renderForm(p) {
  document.getElementById('container').innerHTML = `
    <h2>Edit Product Sheet</h2>
    <p class="hint">Only the fields below are manually maintained here. Specs, ingredients, allergens, flavor description and colour description come live from the recipe, and are updated via the "Update &amp; download" button on the product sheet page itself.</p>

    <fieldset>
      <legend>Excise</legend>
      <label>Excise tax category
        <input id="f-excise" value="${escapeHtml(p.excise_tax_category || '')}">
      </label>
    </fieldset>

    <fieldset>
      <legend>Barrel aged beer</legend>
      <div class="row3">
        <label>Amount barrel aged (HL)
          <input id="f-vat-hl" type="number" step="0.1" value="${p.vat_gerijpt_hl ?? ''}">
        </label>
        <label>In which barrels aged
          <input id="f-vat-type" value="${escapeHtml(p.vat_type || '')}">
        </label>
        <label>Number of days on barrel
          <input id="f-vat-dagen" type="number" step="1" value="${p.vat_dagen ?? ''}">
        </label>
      </div>
    </fieldset>

    <fieldset>
      <legend>Nutritional values (per 100ml)</legend>
      <div class="row3">
        <label>Energy (kJ)<input id="f-kj" type="number" step="0.1" value="${p.energie_kj ?? ''}"></label>
        <label>Energy (kcal)<input id="f-kcal" type="number" step="0.1" value="${p.energie_kcal ?? ''}"></label>
        <label>Fat (g)<input id="f-vet" type="number" step="0.1" value="${p.vet_g ?? ''}"></label>
      </div>
      <div class="row3" style="margin-top:12px;">
        <label>Carbohydrates (g)<input id="f-koolhydraten" type="number" step="0.1" value="${p.koolhydraten_g ?? ''}"></label>
        <label>Protein (g)<input id="f-eiwit" type="number" step="0.1" value="${p.eiwit_g ?? ''}"></label>
        <label>Salt (g)<input id="f-zout" type="number" step="0.1" value="${p.zout_g ?? ''}"></label>
      </div>
    </fieldset>

    <fieldset>
      <legend>Comments</legend>
      <textarea id="f-opmerkingen">${escapeHtml(p.opmerkingen || '')}</textarea>
    </fieldset>

    <div class="actions">
      <button type="button" id="save-btn">Save</button>
    </div>
    <div class="error" id="save-error" style="display:none;"></div>
  `;

  document.getElementById('save-btn').addEventListener('click', opslaan);
}

async function opslaan() {
  const btn = document.getElementById('save-btn');
  const errEl = document.getElementById('save-error');
  errEl.style.display = 'none';
  btn.disabled = true; btn.textContent = 'Saving…';

  const getal = (id) => {
    const v = document.getElementById(id).value;
    return v === '' ? null : Number(v);
  };
  const tekst = (id) => document.getElementById(id).value.trim() || null;

  const payload = {
    excise_tax_category: tekst('f-excise'),
    vat_gerijpt_hl: getal('f-vat-hl'),
    vat_type: tekst('f-vat-type'),
    vat_dagen: getal('f-vat-dagen'),
    energie_kj: getal('f-kj'),
    energie_kcal: getal('f-kcal'),
    vet_g: getal('f-vet'),
    koolhydraten_g: getal('f-koolhydraten'),
    eiwit_g: getal('f-eiwit'),
    zout_g: getal('f-zout'),
    opmerkingen: tekst('f-opmerkingen'),
  };

  const { error } = await supabaseClient.from('product_sheets').update(payload).eq('id', productSheetId);
  if (error) {
    errEl.textContent = error.message;
    errEl.style.display = 'block';
    btn.disabled = false; btn.textContent = 'Save';
    return;
  }
  window.location.href = `productsheet.html?recipe_group_id=${recipeGroupId}`;
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str ?? '';
  return div.innerHTML;
}
</script>
</body>
</html>
