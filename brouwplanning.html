<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jopen — Brewing planning</title>
<link rel="stylesheet" href="jopen-shared.css">
<style>
  main.bp-main { max-width: 1150px; margin: 0 auto; padding: 24px; }

  .bp-toolbar { display: flex; align-items: center; gap: 14px; margin-bottom: 16px; flex-wrap: wrap; }
  .bp-toolbar select { padding: 6px 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 0.95em; }
  .bp-legenda { font-size: 0.82em; color: #6b6b6b; display: flex; gap: 14px; flex-wrap: wrap; margin-left: auto; }
  .bp-legenda span { display: inline-flex; align-items: center; gap: 5px; }
  .bp-legenda .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
  .bp-legenda .dot.prio { background: #b8860b; }
  .bp-legenda .dot.over { background: #a33f2c; }

  .bp-scroll {
    position: relative; max-height: 76vh; overflow-y: auto;
    border: 1px solid #ddd; border-radius: 8px; background: #fff;
  }
  .bp-koprij {
    position: sticky; top: 0; z-index: 3; background: #f7f7f5;
    border-bottom: 1px solid #ddd; padding: 8px 12px;
    display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 10px;
  }
  .bp-koprij div { font-size: 0.78em; font-weight: 600; color: #6b6b6b; }

  .bp-weekblok { padding: 12px; border-bottom: 1px solid #eee; border-left: 5px solid transparent; }
  .bp-weekblok:last-child { border-bottom: none; }
  .bp-weekblok.bp-weekblok-over {
    background: #fdecea; border-left-color: #a33f2c;
  }
  .bp-weekblok-over .bp-weeknr { color: #a33f2c; }
  .bp-over-badge {
    font-size: 0.72em; font-weight: 700; text-transform: uppercase; letter-spacing: 0.03em;
    color: #fff; background: #a33f2c; padding: 2px 8px; border-radius: 10px;
  }

  /* Volgorde in de weekbalk (van links naar rechts): week - dagen -
     WP +Brews - WP huidig/max - JK +Brews - JK huidig/max. */
  .bp-weekkop { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 8px; }
  .bp-weeknr { font-weight: bold; }
  .bp-weekdatum { font-size: 0.85em; color: #6b6b6b; }
  .bp-add-inline {
    font-size: 0.85em; padding: 6px 16px; background: #fff; border: 1px solid #ccc;
    border-radius: 14px; cursor: pointer; white-space: nowrap;
  }
  .bp-add-inline:hover { border-color: var(--jopen-red); color: var(--jopen-red); }
  .bp-cap { font-size: 0.85em; color: #6b6b6b; display: flex; align-items: center; gap: 5px; }
  .bp-cap.over { color: #a33f2c; font-weight: 600; }
  .bp-cap input {
    width: 60px; padding: 6px 8px; border: 1px solid #ccc; border-radius: 4px; font-size: 0.95em;
  }

  .bp-kolommen { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 10px; }

  .bp-col { background: #f7f7f5; border-radius: 8px; padding: 8px; }
  .bp-col.over { background: #fbeae6; border: 1px solid #e3a692; }
  .bp-col-teller { font-size: 0.75em; color: #999; margin-bottom: 6px; }

  .bp-item {
    border: 1px solid #e2e2de; border-radius: 6px;
    padding: 6px 8px; margin-bottom: 4px; font-size: 0.82em;
    display: flex; justify-content: space-between; align-items: flex-start; gap: 4px;
    cursor: pointer; word-break: break-word;
  }
  .bp-item:hover { border-color: var(--jopen-red); }
  .bp-item .bp-item-tekst { line-height: 1.3; }
  .bp-prio-marker { display: flex; flex-direction: column; align-items: center; flex-shrink: 0; line-height: 1; margin-left: 2px; }
  .bp-prio-marker .bp-prio-ster {
    color: #b8860b; font-size: 1.05em;
    text-shadow: -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000;
  }
  .bp-prio-marker .bp-prio-label {
    font-size: 0.58em; font-weight: 700; text-transform: uppercase; letter-spacing: 0.03em;
    color: #1f1f1f; margin-top: 1px;
  }
  .bp-comment-marker { display: flex; flex-direction: column; align-items: center; flex-shrink: 0; margin-left: 2px; }
  .bp-comment-marker .bp-comment-icon { display: block; filter: drop-shadow(0 0 1px #000) drop-shadow(0 0 1px #000); }
  .bp-comment-marker .bp-comment-label {
    font-size: 0.58em; font-weight: 700; text-transform: uppercase; letter-spacing: 0.03em;
    color: #1f1f1f; margin-top: 1px; line-height: 1;
  }

  /* --- Modal (add / edit) --- */
  .bp-modal-overlay {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.35);
    z-index: 200; align-items: flex-start; justify-content: center; padding-top: 6vh; overflow-y: auto;
  }
  .bp-modal-overlay.open { display: flex; }
  .bp-modal {
    background: #fff; border-radius: 10px; padding: 20px 22px; width: 620px; max-width: 94vw;
    box-shadow: 0 8px 30px rgba(0,0,0,0.25); margin-bottom: 6vh;
  }
  .bp-modal h3 { margin: 0 0 14px 0; font-size: 1.05em; color: var(--jopen-red); }
  .bp-modal label {
    display: block; font-size: 0.78em; text-transform: uppercase; letter-spacing: 0.03em;
    color: #6b6b6b; margin: 14px 0 4px 0;
  }
  .bp-modal input[type="text"], .bp-modal input[type="number"], .bp-modal select {
    padding: 7px 9px; border: 1px solid #ccc; border-radius: 6px; font-size: 0.95em;
  }

  .bp-weken-helper {
    display: flex; align-items: center; gap: 6px; font-size: 0.85em; color: #444; flex-wrap: wrap; margin-bottom: 8px;
  }
  .bp-weken-helper input { width: 50px !important; }
  .bp-weken-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(46px, 1fr)); gap: 5px;
    max-height: 150px; overflow-y: auto; border: 1px solid #eee; border-radius: 6px; padding: 8px;
  }
  .bp-week-chip {
    text-align: center; font-size: 0.78em; padding: 4px 0; border-radius: 4px; border: 1px solid #ddd;
    cursor: pointer; user-select: none;
  }
  .bp-week-chip.gekozen { background: var(--jopen-red); color: #fff; border-color: var(--jopen-red); }

  #bp-modal-bieren-rijen { display: flex; flex-direction: column; gap: 6px; }
  .bp-bier-rij { display: flex; align-items: center; gap: 6px; }
  .bp-bier-zoekwrap { position: relative; flex: 1 1 auto; min-width: 0; }
  .bp-bier-zoekwrap input { width: 100%; }
  .bp-bier-resultaten {
    position: absolute; z-index: 10; top: 100%; left: 0; right: 0; background: #fff;
    border: 1px solid #ccc; border-top: none; border-radius: 0 0 6px 6px;
    max-height: 160px; overflow-y: auto; display: none;
  }
  .bp-bier-resultaten div { padding: 6px 9px; cursor: pointer; font-size: 0.9em; }
  .bp-bier-resultaten div:hover { background: var(--jopen-red-tint); }
  .bp-bier-brouwsels { width: 64px !important; flex: none; }
  .bp-bier-hl { width: 68px; flex: none; font-size: 0.78em; color: #6b6b6b; }
  .bp-bier-hl-vrij { width: 68px; flex: none; }
  .bp-bier-verwijder {
    flex: none; background: #fff; border: 1px solid #ccc; border-radius: 6px; width: 28px; height: 28px;
    cursor: pointer; color: #a33f2c; font-size: 1em; line-height: 1;
  }
  .bp-bier-verwijder:hover { background: #fbeae6; }

  .bp-modal-prio-row { display: flex; align-items: center; gap: 8px; margin-top: 16px; font-size: 0.9em; }
  .bp-modal-knoppen { display: flex; gap: 8px; margin-top: 20px; align-items: center; }
  .bp-modal-knoppen button { padding: 8px 16px; border-radius: 6px; font-size: 0.9em; cursor: pointer; }
  .bp-btn-save { background: var(--jopen-red); color: #fff; border: none; }
  .bp-btn-save:hover { background: var(--jopen-red-dark); }
  .bp-btn-cancel { background: #fff; border: 1px solid #ccc; }
  .bp-btn-delete { background: #fff; border: 1px solid #a33f2c; color: #a33f2c; margin-left: auto; }
  .bp-btn-delete:hover { background: #fbeae6; }
  .bp-modal-melding { font-size: 0.85em; margin-top: 8px; }
  .bp-modal-melding.fout { color: #a33f2c; }
</style>
</head>
<body>

  <div id="jopen-nav"></div>

  <main class="bp-main">
    <h1 style="margin-bottom:2px;">Brewing planning</h1>
    <p class="jopen-subtitel" style="margin-top:0;">Long-term brew schedule per week — WP 60HL, WP 120HL, WP 320HL and JK.</p>

    <div class="bp-toolbar">
      <label for="bp-jaar" style="font-size:0.9em; color:#6b6b6b;">Year</label>
      <select id="bp-jaar"></select>
      <span style="font-size:0.9em; color:#6b6b6b;">Current week: <b id="bp-huidige-week" style="color:#1f1f1f;">—</b></span>
      <span style="font-size:0.9em; color:#6b6b6b;">Total volume planned: <b id="bp-totaal-volume" style="color:#1f1f1f;">—</b></span>
      <div class="bp-legenda">
        <span><i class="dot prio"></i> Prio</span>
        <span><i class="dot over"></i> Over capacity</span>
      </div>
    </div>

    <div class="bp-scroll" id="bp-scroll">
      <div class="bp-koprij">
        <div>WP 60HL</div>
        <div>WP 120HL</div>
        <div>WP 320HL</div>
        <div>JK</div>
      </div>
      <div id="bp-weken-container">
        <div style="padding:20px; color:#999;">Loading…</div>
      </div>
    </div>
  </main>

  <!-- ============================== MODAL ============================== -->
  <div class="bp-modal-overlay" id="bp-modal-overlay">
    <div class="bp-modal">
      <h3 id="bp-modal-titel">Add brews</h3>

      <!-- Add-mode: meerdere weken tegelijk kiezen -->
      <div id="bp-modal-weken-sectie">
        <label>Weeks</label>
        <div class="bp-weken-helper">
          <span>Every</span><input type="number" id="bp-weken-interval" min="1" value="1" />
          <span>week(s), starting wk</span><input type="number" id="bp-weken-start" min="1" max="53" />
          <span>&times;</span><input type="number" id="bp-weken-aantal" min="1" value="1" />
          <button type="button" id="bp-weken-toepassen" class="bp-add-inline">Apply</button>
          <button type="button" id="bp-weken-wissen" class="bp-add-inline">Clear</button>
        </div>
        <div class="bp-weken-grid" id="bp-weken-grid"></div>
      </div>

      <!-- Edit-mode: één specifieke week -->
      <div id="bp-modal-week-enkel-sectie" style="display:none;">
        <label for="bp-modal-week">Week</label>
        <input type="number" id="bp-modal-week" min="1" max="53" style="width:100px;" />
      </div>

      <label>Beers</label>
      <div id="bp-modal-bieren-rijen"></div>
      <button type="button" id="bp-modal-nog-een-bier" class="bp-add-inline" style="margin-top:8px;">+ add another beer</button>

      <div class="bp-modal-prio-row">
        <input type="checkbox" id="bp-modal-prio" style="width:auto;" />
        <label for="bp-modal-prio" style="margin:0; text-transform:none; letter-spacing:normal; color:#1f1f1f;">Prio</label>
      </div>

      <!-- Comment: alleen relevant bij het bewerken van een al gepland brouwsel,
           niet nodig tijdens het aanmaken zelf. -->
      <div id="bp-modal-comment-sectie" style="display:none;">
        <label for="bp-modal-comment">Comment</label>
        <textarea id="bp-modal-comment" rows="3" style="width:100%; padding:7px 9px; border:1px solid #ccc; border-radius:6px; font-size:0.95em; font-family:inherit; resize:vertical;"></textarea>
      </div>

      <div class="bp-modal-knoppen">
        <button type="button" class="bp-btn-delete" id="bp-modal-delete" style="display:none;">Delete</button>
        <button type="button" id="bp-modal-create-batch" style="display:none; background:none; border:1px solid var(--jopen-red); color:var(--jopen-red); border-radius:6px;">Create batch &rarr;</button>
        <button type="button" class="bp-btn-cancel" id="bp-modal-cancel">Cancel</button>
        <button type="button" class="bp-btn-save" id="bp-modal-save">Save</button>
      </div>
      <div class="bp-modal-melding" id="bp-modal-melding"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="nav.js"></script>
  <script>
    // ------------------------------------------------------------------
    // Status
    // ------------------------------------------------------------------
    let huidigJaar = new Date().getFullYear();
    let alleRecepten = [];               // { id, naam, short_name, brouwsel_hl, kleur }
    let capaciteitMap = {};              // `${group}_${week}` -> max_brouwsels
    let planningPerWeek = {};            // week -> { jk:[], wp_60hl:[], wp_120hl:[], wp_320hl:[] }
    let huidigeGebruikerId = null;
    let magBpBewerken = false;
    let magBpVerwijderen = false;
    let magBatchesBewerken = false;

    // Modal-context
    let modalContext = { mode: 'add', item: null, group: 'jk' };
    let gekozenWeken = new Set();

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str ?? '';
      return div.innerHTML;
    }

    // ------------------------------------------------------------------
    // ISO-weekhulpfuncties
    // ------------------------------------------------------------------
    function isoWeeksInYear(jaar) {
      const d = new Date(Date.UTC(jaar, 0, 1));
      const dow = d.getUTCDay() || 7;
      const isLeap = (jaar % 4 === 0 && jaar % 100 !== 0) || jaar % 400 === 0;
      return dow === 4 || (dow === 3 && isLeap) ? 53 : 52;
    }

    function mondayOfIsoWeek(jaar, week) {
      const jan4 = new Date(Date.UTC(jaar, 0, 4));
      const jan4Dag = (jan4.getUTCDay() + 6) % 7;
      const week1Maandag = new Date(jan4);
      week1Maandag.setUTCDate(jan4.getUTCDate() - jan4Dag);
      const maandag = new Date(week1Maandag);
      maandag.setUTCDate(week1Maandag.getUTCDate() + (week - 1) * 7);
      return maandag;
    }
    function formatDagMaand(d) { return `${d.getUTCDate()}-${d.getUTCMonth() + 1}`; }
    function weekDatumRange(jaar, week) {
      const maandag = mondayOfIsoWeek(jaar, week);
      const zondag = new Date(maandag);
      zondag.setUTCDate(maandag.getUTCDate() + 6);
      return `${formatDagMaand(maandag)} t/m ${formatDagMaand(zondag)}`;
    }
    function formatHl(hl) {
      const n = Number(hl) || 0;
      return Number.isInteger(n) ? String(n) : n.toFixed(1);
    }

    function huidigeIsoJaarEnWeek() {
      const d = new Date();
      const dagNr = (d.getDay() + 6) % 7;
      d.setDate(d.getDate() - dagNr + 3); // donderdag van deze week bepaalt het ISO-jaar
      const isoJaar = d.getFullYear();
      const jan4 = new Date(isoJaar, 0, 4);
      const jan4Dag = (jan4.getDay() + 6) % 7;
      jan4.setDate(jan4.getDate() - jan4Dag + 3);
      const week = 1 + Math.round((d - jan4) / (7 * 24 * 3600 * 1000));
      return { jaar: isoJaar, week };
    }

    // ------------------------------------------------------------------
    // HL -> planninggroep (blijft op de achtergrond, niet meer in de labels)
    // ------------------------------------------------------------------
    function bepaalWpGroep(hl) {
      if (hl < 80) return 'wp_60hl';
      if (hl < 140) return 'wp_120hl';
      return 'wp_320hl';
    }

    // ------------------------------------------------------------------
    // Kleur -> leesbare tekstkleur (voor de gevulde item-balk)
    // ------------------------------------------------------------------
    function contrastKleur(hex) {
      if (!hex) return null;
      const c = hex.replace('#', '');
      if (c.length !== 6) return null;
      const r = parseInt(c.substr(0, 2), 16), g = parseInt(c.substr(2, 2), 16), b = parseInt(c.substr(4, 2), 16);
      const lum = (0.299 * r + 0.587 * g + 0.114 * b) / 255;
      return lum > 0.6 ? '#1f1f1f' : '#ffffff';
    }

    // ------------------------------------------------------------------
    // Laden
    // ------------------------------------------------------------------
    async function laadRecepten() {
      const { data, error } = await supabaseClient
        .from('recipes')
        .select('id, naam, short_name, brouwsel_hl, status, kleur, locatie')
        .neq('status', 'gearchiveerd')
        .order('naam');
      if (error) { console.error('Kon recepten niet laden:', error); return; }
      alleRecepten = data || [];
    }

    async function laadCapaciteit(jaar) {
      const { data, error } = await supabaseClient
        .from('brew_capacity').select('capacity_group, week_number, max_brouwsels').eq('iso_year', jaar);
      if (error) { console.error('Kon capaciteit niet laden:', error); return; }
      capaciteitMap = {};
      (data || []).forEach(r => { capaciteitMap[`${r.capacity_group}_${r.week_number}`] = Number(r.max_brouwsels); });
    }
    function capaciteit(groep, week) {
      const key = `${groep}_${week}`;
      if (key in capaciteitMap) return capaciteitMap[key];
      return groep === 'jk' ? 18 : 23;
    }

    async function laadPlanning(jaar) {
      const { data, error } = await supabaseClient
        .from('brew_planning')
        .select('id, plan_group, week_number, recipe_id, aantal_brouwsels, hl, prio, sort_order, notities')
        .eq('iso_year', jaar).order('sort_order');
      if (error) { console.error('Kon brouwplanning niet laden:', error); return; }
      planningPerWeek = {};
      (data || []).forEach(r => {
        if (!planningPerWeek[r.week_number]) {
          planningPerWeek[r.week_number] = { jk: [], wp_60hl: [], wp_120hl: [], wp_320hl: [] };
        }
        planningPerWeek[r.week_number][r.plan_group].push(r);
      });
    }

    function receptById(recipeId) { return alleRecepten.find(x => String(x.id) === String(recipeId)); }
    function receptNaam(recipeId) {
      const r = receptById(recipeId);
      return r ? (r.short_name || r.naam) : '(unknown recipe)';
    }

    // ------------------------------------------------------------------
    // Renderen
    // ------------------------------------------------------------------
    async function laadEnRenderAlles() {
      await Promise.all([laadCapaciteit(huidigJaar), laadPlanning(huidigJaar)]);
      renderWeken();
      werkTotaalVolumeBij();
    }

    function werkTotaalVolumeBij() {
      const totaal = Object.values(planningPerWeek).reduce((som, p) => {
        return som + ['jk', 'wp_60hl', 'wp_120hl', 'wp_320hl']
          .reduce((s, g) => s + p[g].reduce((s2, i) => s2 + Number(i.hl || 0), 0), 0);
      }, 0);
      const el = document.getElementById('bp-totaal-volume');
      if (el) el.textContent = `${formatHl(totaal)} hl`;
    }

    function renderItem(item) {
      const recept = receptById(item.recipe_id);
      const naam = escapeHtml(receptNaam(item.recipe_id));
      const hl = item.hl != null ? Number(item.hl).toFixed(0) : '—';
      const kleur = recept ? recept.kleur : null;
      const stijl = kleur ? `background:${kleur}; border-color:${kleur}; color:${contrastKleur(kleur)};` : '';
      return `
        <div class="bp-item" data-id="${item.id}" style="${stijl}">
          <span class="bp-item-tekst">${naam} · ${item.aantal_brouwsels}br · ${hl}hl</span>
          ${item.prio ? '<span class="bp-prio-marker" title="Prio"><span class="bp-prio-ster">&#9733;</span><span class="bp-prio-label">prio</span></span>' : ''}
          ${item.notities ? `<span class="bp-comment-marker" title="${escapeHtml(item.notities)}"><svg class="bp-comment-icon" width="15" height="14" viewBox="0 0 20 18" xmlns="http://www.w3.org/2000/svg"><path d="M2 2h16v10H8.5L4 16v-4H2z" fill="#2a5db0"/></svg><span class="bp-comment-label">Comment</span></span>` : ''}
        </div>`;
    }

    function renderWeken() {
      const container = document.getElementById('bp-weken-container');
      const totaalWeken = isoWeeksInYear(huidigJaar);
      let html = '';

      for (let week = 1; week <= totaalWeken; week++) {
        const p = planningPerWeek[week] || { jk: [], wp_60hl: [], wp_120hl: [], wp_320hl: [] };

        const jkSom = p.jk.reduce((s, i) => s + Number(i.aantal_brouwsels), 0);
        const jkMax = capaciteit('jk', week);
        const jkOver = jkSom > jkMax;
        const jkHl = p.jk.reduce((s, i) => s + Number(i.hl || 0), 0);

        const wpSom = ['wp_60hl', 'wp_120hl', 'wp_320hl']
          .reduce((s, g) => s + p[g].reduce((s2, i) => s2 + Number(i.aantal_brouwsels), 0), 0);
        const wpMax = capaciteit('wp', week);
        const wpOver = wpSom > wpMax;
        const wpHl = ['wp_60hl', 'wp_120hl', 'wp_320hl']
          .reduce((s, g) => s + p[g].reduce((s2, i) => s2 + Number(i.hl || 0), 0), 0);
        const weekOver = jkOver || wpOver;

        html += `
          <div class="bp-weekblok ${weekOver ? 'bp-weekblok-over' : ''}" id="bp-weekblok-${week}">
            <div class="bp-weekkop">
              <span class="bp-weeknr">wk ${week}</span>
              <span class="bp-weekdatum">${weekDatumRange(huidigJaar, week)}</span>
              <span class="bp-weekdatum">Total volume: ${formatHl(jkHl + wpHl)} hl</span>
              ${weekOver ? '<span class="bp-over-badge">Over capacity</span>' : ''}
              ${magBpBewerken ? `<button type="button" class="bp-add-inline bp-add-wp" data-week="${week}">+ Brews WP</button>` : ''}
              <span class="bp-cap ${wpOver ? 'over' : ''}">WP ${wpSom}/<input type="number" min="0" class="bp-cap-input" data-group="wp" data-week="${week}" value="${wpMax}" ${magBpBewerken ? '' : 'disabled'} /> brws</span>
              ${magBpBewerken ? `<button type="button" class="bp-add-inline bp-add-jk" data-week="${week}">+ Brews JK</button>` : ''}
              <span class="bp-cap ${jkOver ? 'over' : ''}">JK ${jkSom}/<input type="number" min="0" class="bp-cap-input" data-group="jk" data-week="${week}" value="${jkMax}" ${magBpBewerken ? '' : 'disabled'} /> brws</span>
            </div>
            <div class="bp-kolommen">
              <div class="bp-col ${wpOver ? 'over' : ''}">${p.wp_60hl.map(renderItem).join('')}</div>
              <div class="bp-col ${wpOver ? 'over' : ''}">${p.wp_120hl.map(renderItem).join('')}</div>
              <div class="bp-col ${wpOver ? 'over' : ''}">${p.wp_320hl.map(renderItem).join('')}</div>
              <div class="bp-col ${jkOver ? 'over' : ''}">${p.jk.map(renderItem).join('')}</div>
            </div>
          </div>`;
      }
      container.innerHTML = html;
      koppelWeekEventListeners();
    }

    function koppelWeekEventListeners() {
      document.querySelectorAll('.bp-cap-input').forEach(inp => {
        inp.addEventListener('change', async (e) => {
          const groep = e.target.dataset.group;
          const week = Number(e.target.dataset.week);
          const waarde = Number(e.target.value) || 0;
          const { error } = await supabaseClient.from('brew_capacity').upsert({
            capacity_group: groep, iso_year: huidigJaar, week_number: week,
            max_brouwsels: waarde, updated_by: huidigeGebruikerId,
          }, { onConflict: 'capacity_group,iso_year,week_number' });
          if (error) { console.error(error); alert('Could not save capacity: ' + error.message); return; }
          await laadEnRenderAlles();
        });
      });
      document.querySelectorAll('.bp-add-jk').forEach(btn => {
        btn.addEventListener('click', () => openModal('add', null, [Number(btn.dataset.week)], 'jk'));
      });
      document.querySelectorAll('.bp-add-wp').forEach(btn => {
        btn.addEventListener('click', () => openModal('add', null, [Number(btn.dataset.week)], 'wp'));
      });
      document.querySelectorAll('.bp-item').forEach(el => {
        el.addEventListener('click', () => {
          const id = el.dataset.id;
          const item = Object.values(planningPerWeek).flatMap(w => [...w.jk, ...w.wp_60hl, ...w.wp_120hl, ...w.wp_320hl])
            .find(i => String(i.id) === String(id));
          if (item) openModal('edit', item, [item.week_number], null);
        });
      });
    }

    // ------------------------------------------------------------------
    // Modal — bierregels (herhaalbaar)
    // ------------------------------------------------------------------
    function bierRijHtml() {
      return `
        <div class="bp-bier-rij" data-recipe-id="">
          <div class="bp-bier-zoekwrap">
            <input type="text" class="bp-bier-zoek" autocomplete="off" placeholder="Search recipe (short name)…" />
            <div class="bp-bier-resultaten"></div>
          </div>
          <input type="number" class="bp-bier-brouwsels" min="1" step="1" value="1" />
          <span class="bp-bier-hl">— hl</span>
          <input type="number" class="bp-bier-hl-vrij" min="0" step="1" placeholder="hl" style="display:none;" title="Recipe has no default volume yet — enter it here" />
          <button type="button" class="bp-bier-verwijder" title="Remove">&times;</button>
        </div>`;
    }

    // Recept nog niet af (brouwsel_hl is 0/leeg in het recept, bv. een
    // placeholder-recept zoals "NPI") -> volume wordt vrij ingevoerd i.p.v.
    // berekend, en de plan-groep (JK blijft JK; WP wordt op basis van dat
    // ingevoerde volume bepaald) volgt gewoon dezelfde logica als anders.
    function receptHeeftGeenVolume(recept) {
      return !recept || !recept.brouwsel_hl;
    }

    function werkBierRijHlBij(rij) {
      const recept = receptById(rij.dataset.recipeId);
      const brouwsels = Number(rij.querySelector('.bp-bier-brouwsels').value) || 0;
      const hlEl = rij.querySelector('.bp-bier-hl');
      const hlVrijEl = rij.querySelector('.bp-bier-hl-vrij');
      if (recept && receptHeeftGeenVolume(recept)) {
        hlEl.style.display = 'none';
        hlVrijEl.style.display = 'inline-block';
      } else if (recept) {
        hlEl.style.display = '';
        hlVrijEl.style.display = 'none';
        hlEl.textContent = `${(brouwsels * Number(recept.brouwsel_hl)).toFixed(0)} hl`;
      } else {
        hlEl.style.display = '';
        hlVrijEl.style.display = 'none';
        hlEl.textContent = '— hl';
      }
    }

    // Bepaalt de uiteindelijke hl voor een bierregel: berekend uit het recept,
    // of (bij een recept zonder volume) de vrij ingevoerde waarde.
    function bepaalHlVoorRij(rij, recept, brouwsels) {
      if (receptHeeftGeenVolume(recept)) {
        return Number(rij.querySelector('.bp-bier-hl-vrij').value) || 0;
      }
      return brouwsels * Number(recept.brouwsel_hl);
    }

    const bierenContainer = document.getElementById('bp-modal-bieren-rijen');

    bierenContainer.addEventListener('input', (e) => {
      const rij = e.target.closest('.bp-bier-rij');
      if (!rij) return;

      if (e.target.classList.contains('bp-bier-zoek')) {
        rij.dataset.recipeId = '';
        werkBierRijHlBij(rij);
        const term = e.target.value.trim().toLowerCase();
        const resultaten = rij.querySelector('.bp-bier-resultaten');
        if (term === '') { resultaten.style.display = 'none'; return; }
        const locatieGroep = huidigeModalLocatieGroep();
        const matches = alleRecepten.filter(r =>
          r.status === 'actief' &&
          receptPastBijLocatieGroep(r, locatieGroep) &&
          (r.naam.toLowerCase().includes(term) || (r.short_name || '').toLowerCase().includes(term))
        ).slice(0, 20);
        resultaten.innerHTML = matches.length
          ? matches.map(r => `<div data-id="${r.id}">${escapeHtml(r.short_name || r.naam)} <span style="color:#999;">(${escapeHtml(r.naam)})</span></div>`).join('')
          : '<div style="color:#999;">No matching recipes.</div>';
        resultaten.style.display = 'block';
      } else if (e.target.classList.contains('bp-bier-brouwsels')) {
        werkBierRijHlBij(rij);
      }
    });

    bierenContainer.addEventListener('click', (e) => {
      const resultaatRegel = e.target.closest('.bp-bier-resultaten [data-id]');
      if (resultaatRegel) {
        const rij = resultaatRegel.closest('.bp-bier-rij');
        rij.dataset.recipeId = resultaatRegel.dataset.id;
        rij.querySelector('.bp-bier-zoek').value = escapeHtml(receptNaam(resultaatRegel.dataset.id));
        rij.querySelector('.bp-bier-resultaten').style.display = 'none';
        werkBierRijHlBij(rij);
        return;
      }
      const verwijderBtn = e.target.closest('.bp-bier-verwijder');
      if (verwijderBtn) {
        const alleRijen = bierenContainer.querySelectorAll('.bp-bier-rij');
        if (alleRijen.length > 1) {
          verwijderBtn.closest('.bp-bier-rij').remove();
        } else {
          const rij = verwijderBtn.closest('.bp-bier-rij');
          rij.dataset.recipeId = '';
          rij.querySelector('.bp-bier-zoek').value = '';
          rij.querySelector('.bp-bier-brouwsels').value = 1;
          werkBierRijHlBij(rij);
        }
      }
    });

    document.addEventListener('click', (e) => {
      document.querySelectorAll('.bp-bier-resultaten').forEach(el => {
        if (!el.parentElement.contains(e.target)) el.style.display = 'none';
      });
    });

    document.getElementById('bp-modal-nog-een-bier').addEventListener('click', () => {
      bierenContainer.insertAdjacentHTML('beforeend', bierRijHtml());
    });

    // ------------------------------------------------------------------
    // Modal — weekkeuze (add-mode: meerdere weken)
    // ------------------------------------------------------------------
    function renderWekenGrid() {
      const grid = document.getElementById('bp-weken-grid');
      const totaal = isoWeeksInYear(huidigJaar);
      let html = '';
      for (let w = 1; w <= totaal; w++) {
        html += `<div class="bp-week-chip ${gekozenWeken.has(w) ? 'gekozen' : ''}" data-week="${w}">${w}</div>`;
      }
      grid.innerHTML = html;
    }
    document.getElementById('bp-weken-grid').addEventListener('click', (e) => {
      const chip = e.target.closest('.bp-week-chip');
      if (!chip) return;
      const w = Number(chip.dataset.week);
      if (gekozenWeken.has(w)) gekozenWeken.delete(w); else gekozenWeken.add(w);
      chip.classList.toggle('gekozen');
    });
    document.getElementById('bp-weken-toepassen').addEventListener('click', () => {
      const interval = Math.max(1, Number(document.getElementById('bp-weken-interval').value) || 1);
      const start = Number(document.getElementById('bp-weken-start').value);
      const aantal = Math.max(1, Number(document.getElementById('bp-weken-aantal').value) || 1);
      if (!start) return;
      const totaalWeken = isoWeeksInYear(huidigJaar);
      for (let i = 0; i < aantal; i++) {
        const w = start + i * interval;
        if (w >= 1 && w <= totaalWeken) gekozenWeken.add(w);
      }
      renderWekenGrid();
    });
    document.getElementById('bp-weken-wissen').addEventListener('click', () => {
      gekozenWeken.clear();
      renderWekenGrid();
    });

    // ------------------------------------------------------------------
    // Modal openen / sluiten
    // ------------------------------------------------------------------
    // Welke locatie-groep ('jk' of 'wp') hoort bij de modal die nu open is
    // (of geopend wordt) -- bepaalt welke recepten in de zoekresultaten mogen
    // verschijnen. Bij bewerken volgt dit uit het bestaande plan_group van het
    // item, bij toevoegen uit de knop waarmee de modal geopend is.
    function huidigeModalLocatieGroep() {
      if (!modalContext) return null;
      if (modalContext.mode === 'edit' && modalContext.item) {
        return modalContext.item.plan_group === 'jk' ? 'jk' : 'wp';
      }
      return modalContext.group === 'jk' ? 'jk' : 'wp';
    }

    // "De Werf"-recepten hebben nog geen locatie ingevuld (bekend, nog niet
    // opgelost datagat) -- die blijven bewust in beide filters zichtbaar i.p.v.
    // helemaal onvindbaar te worden totdat dat rechtgezet is.
    // BELANGRIJK: het locatie-invulscript uit Fase Geel staat nog steeds als
    // "niet bevestigd gedraaid" (zie sessie-samenvattingen) -- recipes.locatie
    // is dus voor een groot deel van de recepten nog leeg, ook al staat het
    // WP/JK-onderscheid al wél in de naam/short_name. Daarom hier dezelfde
    // WP/JK-uit-naam-fallback als generate-batchrapport.js/batchrapport-vullen.js
    // (vestigingsBron/isWP), zodat het filter ook werkt zolang dat script niet
    // gedraaid is.
    function receptLocatieGroep(recept) {
      if (recept.locatie === 'Jopen Kerk') return 'jk';
      if (recept.locatie === 'Waarderpolder') return 'wp';
      const bron = (recept.short_name || recept.naam || '').trim().toUpperCase();
      if (bron.startsWith('JK')) return 'jk';
      if (bron.startsWith('WP')) return 'wp';
      return null; // onbekend -> in beide filters tonen, niet onvindbaar maken
    }

    function receptPastBijLocatieGroep(recept, locatieGroep) {
      if (!locatieGroep) return true;
      const groep = receptLocatieGroep(recept);
      return groep === null || groep === locatieGroep;
    }

    function openModal(mode, item, weken, group) {
      modalContext = { mode, item, group };
      document.getElementById('bp-modal-titel').textContent = mode === 'edit' ? 'Edit brew' : 'Add brews';
      document.getElementById('bp-modal-melding').textContent = '';
      document.getElementById('bp-modal-delete').style.display = (mode === 'edit' && magBpVerwijderen) ? 'inline-block' : 'none';
      document.getElementById('bp-modal-create-batch').style.display = (mode === 'edit' && magBatchesBewerken) ? 'inline-block' : 'none';
      document.getElementById('bp-modal-save').style.display = magBpBewerken ? 'inline-block' : 'none';
      document.getElementById('bp-modal-prio').checked = item ? !!item.prio : false;

      if (mode === 'edit') {
        document.getElementById('bp-modal-weken-sectie').style.display = 'none';
        document.getElementById('bp-modal-week-enkel-sectie').style.display = 'block';
        document.getElementById('bp-modal-week').value = weken[0];
        document.getElementById('bp-modal-comment-sectie').style.display = 'block';
        document.getElementById('bp-modal-comment').value = item.notities || '';

        bierenContainer.innerHTML = bierRijHtml();
        const rij = bierenContainer.querySelector('.bp-bier-rij');
        rij.dataset.recipeId = item.recipe_id;
        rij.querySelector('.bp-bier-zoek').value = escapeHtml(receptNaam(item.recipe_id));
        rij.querySelector('.bp-bier-brouwsels').value = item.aantal_brouwsels;
        werkBierRijHlBij(rij);
        rij.querySelector('.bp-bier-hl-vrij').value = item.hl ?? '';
        document.getElementById('bp-modal-nog-een-bier').style.display = 'none';
      } else {
        document.getElementById('bp-modal-weken-sectie').style.display = 'block';
        document.getElementById('bp-modal-week-enkel-sectie').style.display = 'none';
        document.getElementById('bp-modal-nog-een-bier').style.display = 'inline-block';
        document.getElementById('bp-modal-comment-sectie').style.display = 'none';
        document.getElementById('bp-modal-comment').value = '';

        gekozenWeken = new Set(weken);
        document.getElementById('bp-weken-start').value = weken[0] || '';
        renderWekenGrid();

        bierenContainer.innerHTML = bierRijHtml();
      }

      document.getElementById('bp-modal-overlay').classList.add('open');
    }

    function sluitModal() { document.getElementById('bp-modal-overlay').classList.remove('open'); }
    document.getElementById('bp-modal-cancel').addEventListener('click', sluitModal);

    document.getElementById('bp-modal-create-batch').addEventListener('click', () => {
      if (!modalContext || modalContext.mode !== 'edit' || !modalContext.item) return;
      const rij = bierenContainer.querySelector('.bp-bier-rij');
      const recipeId = rij?.dataset.recipeId || modalContext.item.recipe_id;
      const brouwsels = Number(rij?.querySelector('.bp-bier-brouwsels')?.value) || modalContext.item.aantal_brouwsels || '';
      const params = new URLSearchParams();
      if (recipeId) params.set('recipe_id', recipeId);
      if (brouwsels) params.set('brouwsels', brouwsels);
      window.location.href = 'batchcreation.html' + (params.toString() ? '?' + params.toString() : '');
    });

    // Alleen sluiten als de muisklik ZOWEL begint als eindigt op de overlay
    // zelf. Met alleen een 'click'-listener sluit de modal ook als je bv. in
    // het zoekveld begint te slepen (tekst selecteren) en toevallig buiten
    // de modal loslaat -- de click-target is dan de overlay, ook al was de
    // bedoeling gewoon binnen de modal te klikken.
    let overlayMousedownWasOpOverlay = false;
    const overlayEl = document.getElementById('bp-modal-overlay');
    overlayEl.addEventListener('mousedown', (e) => {
      overlayMousedownWasOpOverlay = (e.target.id === 'bp-modal-overlay');
    });
    overlayEl.addEventListener('click', (e) => {
      if (e.target.id === 'bp-modal-overlay' && overlayMousedownWasOpOverlay) sluitModal();
    });

    // ------------------------------------------------------------------
    // Opslaan
    // ------------------------------------------------------------------
    document.getElementById('bp-modal-save').addEventListener('click', async () => {
      const melding = document.getElementById('bp-modal-melding');
      const prio = document.getElementById('bp-modal-prio').checked;

      if (modalContext.mode === 'edit') {
        const rij = bierenContainer.querySelector('.bp-bier-rij');
        const recept = receptById(rij.dataset.recipeId);
        const brouwsels = Number(rij.querySelector('.bp-bier-brouwsels').value);
        const week = Number(document.getElementById('bp-modal-week').value);

        if (!recept) { melding.textContent = 'Select a recipe.'; melding.className = 'bp-modal-melding fout'; return; }
        if (!brouwsels || !Number.isInteger(brouwsels) || brouwsels < 1) {
          melding.textContent = 'Number of brews must be a whole number (1 or more).';
          melding.className = 'bp-modal-melding fout'; return;
        }
        if (!week || week < 1 || week > 53) { melding.textContent = 'Enter a valid week number.'; melding.className = 'bp-modal-melding fout'; return; }

        const hl = bepaalHlVoorRij(rij, recept, brouwsels);
        if (receptHeeftGeenVolume(recept) && hl <= 0) {
          melding.textContent = 'This recipe has no default volume yet — enter the volume (hl) for this brew.';
          melding.className = 'bp-modal-melding fout'; return;
        }
        const planGroup = modalContext.item.plan_group === 'jk' ? 'jk' : bepaalWpGroep(hl);
        const comment = document.getElementById('bp-modal-comment').value.trim() || null;

        melding.textContent = 'Saving…'; melding.className = 'bp-modal-melding';
        const { error } = await supabaseClient.from('brew_planning').update({
          recipe_id: recept.id, aantal_brouwsels: brouwsels, hl, prio,
          week_number: week, plan_group: planGroup, notities: comment,
          bijgewerkt_op: new Date().toISOString(),
        }).eq('id', modalContext.item.id);
        if (error) { melding.textContent = 'Could not save: ' + error.message; melding.className = 'bp-modal-melding fout'; return; }

        sluitModal();
        await laadEnRenderAlles();
        return;
      }

      const weken = Array.from(gekozenWeken).sort((a, b) => a - b);
      if (weken.length === 0) { melding.textContent = 'Select at least one week.'; melding.className = 'bp-modal-melding fout'; return; }

      const bierRijen = Array.from(bierenContainer.querySelectorAll('.bp-bier-rij'));
      const geldigeBieren = [];
      for (const rij of bierRijen) {
        const recept = receptById(rij.dataset.recipeId);
        if (!recept) continue;
        const brouwsels = Number(rij.querySelector('.bp-bier-brouwsels').value);
        if (!brouwsels || !Number.isInteger(brouwsels) || brouwsels < 1) {
          melding.textContent = `Number of brews for "${receptNaam(recept.id)}" must be a whole number (1 or more).`;
          melding.className = 'bp-modal-melding fout';
          return;
        }
        const hl = bepaalHlVoorRij(rij, recept, brouwsels);
        if (receptHeeftGeenVolume(recept) && hl <= 0) {
          melding.textContent = `"${receptNaam(recept.id)}" has no default volume yet — enter the volume (hl) for this brew.`;
          melding.className = 'bp-modal-melding fout';
          return;
        }
        geldigeBieren.push({ recept, brouwsels, hl });
      }
      if (geldigeBieren.length === 0) { melding.textContent = 'Select at least one recipe.'; melding.className = 'bp-modal-melding fout'; return; }

      const rijenOmInTeVoegen = [];
      weken.forEach(week => {
        geldigeBieren.forEach(({ recept, brouwsels, hl }) => {
          const planGroup = modalContext.group === 'jk' ? 'jk' : bepaalWpGroep(hl);
          rijenOmInTeVoegen.push({
            plan_group: planGroup, iso_year: huidigJaar, week_number: week,
            recipe_id: recept.id, aantal_brouwsels: brouwsels, hl, prio,
            aangemaakt_door: huidigeGebruikerId,
          });
        });
      });

      melding.textContent = 'Saving…'; melding.className = 'bp-modal-melding';
      const { error } = await supabaseClient.from('brew_planning').insert(rijenOmInTeVoegen);
      if (error) { melding.textContent = 'Could not save: ' + error.message; melding.className = 'bp-modal-melding fout'; return; }

      sluitModal();
      await laadEnRenderAlles();
    });

    document.getElementById('bp-modal-delete').addEventListener('click', async () => {
      if (!modalContext.item) return;
      if (!confirm('Delete this planned brew? This cannot be undone.')) return;
      const { error } = await supabaseClient.from('brew_planning').delete().eq('id', modalContext.item.id);
      if (error) { alert('Could not delete: ' + error.message); return; }
      sluitModal();
      await laadEnRenderAlles();
    });

    // ------------------------------------------------------------------
    // Init
    // ------------------------------------------------------------------
    function vulJaarSelector() {
      const select = document.getElementById('bp-jaar');
      const dit = new Date().getFullYear();
      for (let j = dit - 1; j <= dit + 2; j++) {
        const opt = document.createElement('option');
        opt.value = j; opt.textContent = j;
        if (j === huidigJaar) opt.selected = true;
        select.appendChild(opt);
      }
      select.addEventListener('change', async () => {
        huidigJaar = Number(select.value);
        await laadEnRenderAlles();
      });
    }

    (async function init() {
      const ok = await vereisIngelogd();
      if (!ok) return;
      const gebruiker = await getHuidigeGebruiker();
      huidigeGebruikerId = gebruiker ? gebruiker.id : null;
      magBpBewerken = !!gebruiker && await magBewerkenModule('brewing_planning');
      magBpVerwijderen = !!gebruiker && await magVerwijderenModule('brewing_planning');
      magBatchesBewerken = !!gebruiker && await magBewerkenModule('batches');

      const { jaar: huidigIsoJaar, week: huidigeWeek } = huidigeIsoJaarEnWeek();
      document.getElementById('bp-huidige-week').textContent = `wk ${huidigeWeek} (${huidigIsoJaar})`;

      // Standaard openen op het huidige jaar (was al de default), en na de
      // eerste render eenmalig doorscrollen naar het blok van de huidige
      // week -- niet opnieuw bij latere her-renders (bv. na een wijziging),
      // anders springt de pagina steeds terug.
      vulJaarSelector();
      await laadRecepten();
      await laadEnRenderAlles();

      if (huidigJaar === huidigIsoJaar) {
        const doel = document.getElementById(`bp-weekblok-${huidigeWeek}`);
        const scrollContainer = document.getElementById('bp-scroll');
        if (doel && scrollContainer) {
          scrollContainer.scrollTop = doel.offsetTop - scrollContainer.offsetTop;
        }
      }
    })();
  </script>
