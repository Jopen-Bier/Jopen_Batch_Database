<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jopen Brouwerij — Set password</title>
  <link rel="stylesheet" href="jopen-shared.css" />
</head>
<body>

  <div id="jopen-nav"></div>

  <main class="jopen-pagina">
    <div id="laden" class="jopen-subtitel">Checking invitation…</div>

    <form class="jopen-form" id="wachtwoord-form" style="display:none;">
      <h1 style="font-size:1.3em; margin-top:0;">Set your password</h1>
      <p class="jopen-subtitel" style="margin-bottom:0;">Choose a password below to continue.</p>

      <label for="wachtwoord">New password</label>
      <input type="password" id="wachtwoord" required minlength="8" autocomplete="new-password" />

      <label for="wachtwoord-herhaal">Confirm password</label>
      <input type="password" id="wachtwoord-herhaal" required minlength="8" autocomplete="new-password" />

      <button type="submit">Set password</button>
      <p id="melding" class="jopen-form-melding"></p>
    </form>

    <div id="geen-uitnodiging" class="jopen-form-melding fout" style="display:none; max-width:360px; margin:60px auto; text-align:center;">
      No valid or expired link. Ask an admin for a new invite, or request a new
      password reset link from the login page.
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="nav.js"></script>
  <script>
    // Twee routes naar een sessie hier:
    //
    // 1. token_hash/type als query-param (?token_hash=...&type=invite) --
    //    dit is onze EIGEN link uit generate-invite-link, bewust NIET de kale
    //    Supabase action_link. Reden: een kale GET op Supabase's eigen
    //    /auth/v1/verify-endpoint verbruikt de eenmalige token al, ook als
    //    die GET van een bedrijfsmail-scanner komt (Microsoft Defender Safe
    //    Links e.d. "prefetchen" alle links uit binnenkomende mail) in plaats
    //    van de echte ontvanger -- vandaar dat de link voor de ontvanger
    //    steevast al "verlopen" leek. Met deze route wordt de token pas
    //    verbruikt als DEZE pagina's JS daadwerkelijk draait en verifyOtp()
    //    aanroept; een scanner die alleen de HTML ophaalt voert geen JS uit
    //    en laat de token dus intact. Zie:
    //    https://supabase.com/docs/guides/auth/auth-email-templates#email-prefetching
    //
    // 2. access_token/refresh_token in de URL-hash (#access_token=...) --
    //    de oude route, nog steeds nodig als fallback voor de "forgot
    //    password"-mail. Die gebruikt Supabase's eigen (op de gratis laag
    //    niet aanpasbare) sjabloon met {{ .ConfirmationURL }}, dus daar kunnen
    //    we zelf geen token_hash-link van maken. supabase-js pikt die
    //    hash-tokens automatisch op bij het aanmaken van de client
    //    (detectSessionInUrl, standaard aan).
    async function initAcceptInvite() {
      const params = new URLSearchParams(window.location.search);
      const tokenHash = params.get('token_hash');
      const type = params.get('type');

      if (tokenHash && type) {
        const { error } = await supabaseClient.auth.verifyOtp({ token_hash: tokenHash, type });
        // Query-string opruimen zodat een pagina-refresh de (dan al
        // verbruikte) token niet nog eens probeert te gebruiken.
        window.history.replaceState({}, document.title, window.location.pathname);

        document.getElementById('laden').style.display = 'none';
        if (error) {
          document.getElementById('geen-uitnodiging').style.display = 'block';
          return;
        }
        document.getElementById('wachtwoord-form').style.display = 'block';
        return;
      }

      // Fallback: hash-fragment-tokens (forgot password-mail).
      const { data: { session } } = await supabaseClient.auth.getSession();

      document.getElementById('laden').style.display = 'none';

      if (!session) {
        document.getElementById('geen-uitnodiging').style.display = 'block';
        return;
      }

      document.getElementById('wachtwoord-form').style.display = 'block';
    }

    document.getElementById('wachtwoord-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const wachtwoord = document.getElementById('wachtwoord').value;
      const herhaal = document.getElementById('wachtwoord-herhaal').value;
      const melding = document.getElementById('melding');

      if (wachtwoord !== herhaal) {
        melding.textContent = 'The passwords do not match.';
        melding.className = 'jopen-form-melding fout';
        return;
      }

      melding.textContent = 'Saving…';
      melding.className = 'jopen-form-melding';

      const { error } = await supabaseClient.auth.updateUser({ password: wachtwoord });

      if (error) {
        melding.textContent = 'Could not set password: ' + error.message;
        melding.className = 'jopen-form-melding fout';
        return;
      }

      melding.textContent = 'Password set! Redirecting…';
      melding.className = 'jopen-form-melding ok';
      setTimeout(() => { window.location.href = 'index.html'; }, 1200);
    });

    document.addEventListener('DOMContentLoaded', initAcceptInvite);
  </script>
</body>
</html>
