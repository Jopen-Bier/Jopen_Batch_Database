<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jopen — Consumption forecast</title>
<link rel="stylesheet" href="jopen-shared.css">
<style>
  main.vp-main { max-width: 1000px; margin: 0 auto; padding: 24px; }

  .vp-toolbar {
    display: flex; align-items: center; gap: 14px; margin-bottom: 18px; flex-wrap: wrap;
    background: #fff; border: 1px solid #ddd; border-radius: 8px; padding: 14px 16px;
  }
  .vp-toolbar label { font-size: 0.85em; color: #6b6b6b; display: block; margin-bottom: 3px; }
  .vp-toolbar select, .vp-toolbar input {
    padding: 6px 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 0.95em; width: 90px;
  }
  .vp-toolbar .vp-veld { display: flex; flex-direction: column; }
  .vp-samenvatting { font-size: 0.85em; color: #6b6b6b; margin-left: auto; }

  .vp-filter-tabs { display: flex; gap: 6px; margin-bottom: 14px; flex-wrap: wrap; }
  .vp-filter-tabs button {
    padding: 6px 14px; border-radius: 16px; border: 1px solid #ccc; background: #fff;
    font-size: 0.85em; cursor: pointer;
  }
  .vp-filter-tabs button.actief { background: var(--jopen-red); color: #fff; border-color: var(--jopen-red); }

  .vp-groep { margin-bottom: 18px; background: #fff; border: 1px solid #ddd; border-radius: 8px; overflow: hidden; }
  .vp-groep-titel {
    background: #f7f7f5; padding: 9px 14px; font-weight: 600; font-size: 0.9em;
    border-bottom: 1px solid #eee;
  }
  table.vp-tabel { width: 100%; border-collapse: collapse; font-size: 0.9em; }
  table.vp-tabel th, table.vp-tabel td { text-align: left; padding: 8px 14px; border-bottom: 1px solid #eee; }
  table.vp-tabel th { color: #6b6b6b; font-weight: 600; font-size: 0.85em; }
  table.vp-tabel tr.vp-rij-ingredient { cursor: pointer; }
  table.vp-tabel tr.vp-rij-ingredient:hover { background: var(--jopen-red-tint); }
  .vp-detail-rij { display: none; background: #fafafa; }
  .vp-detail-rij td { padding: 6px 14px 10px 30px; font-size: 0.88em; color: #555; }
  .vp-detail-rij ul { margin: 4px 0 0 0; padding-left: 18px; }
  .vp-mixed-badge {
    display: inline-block; font-size: 0.78em; font-weight: 600; color: #8a5a1e;
    background: #f3e3c9; border-radius: 10px; padding: 2px 8px; margin-left: 6px; cursor: help;
  }
  .vp-leeg { padding: 24px; text-align: center; color: #999; }
  .vp-skeleton { color: #bbb; padding: 20px; }

  .vp-export-btn {
    padding: 8px 16px; border-radius: 6px; border: 1px solid var(--jopen-red); background: none;
    color: var(--jopen-red); font-size: 0.9em; font-weight: 600; cursor: pointer; white-space: nowrap;
  }
  .vp-export-btn:hover { background: var(--jopen-red-tint); }
  .vp-export-btn:disabled { border-color: #ccc; color: #999; cursor: not-allowed; background: none; }

  .vp-modal-overlay {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.4);
    align-items: center; justify-content: center; z-index: 1000;
  }
  .vp-modal-overlay.open { display: flex; }
  .vp-modal {
    background: #fff; border-radius: 10px; padding: 24px 28px; width: 380px; max-width: 90vw;
    box-shadow: 0 10px 30px rgba(0,0,0,0.2);
  }
  .vp-modal h3 { margin: 0 0 6px 0; font-size: 1.05em; color: var(--jopen-red); }
  .vp-modal p { margin: 0 0 14px 0; font-size: 0.85em; color: #6b6b6b; }
  .vp-modal-categorie-rij {
    display: flex; align-items: center; gap: 8px; padding: 7px 0; border-bottom: 1px solid #eee; font-size: 0.95em;
  }
  .vp-modal-categorie-rij:last-of-type { border-bottom: none; }
  .vp-modal-categorie-rij input { width: auto; }
  .vp-modal-knoppen { display: flex; gap: 8px; margin-top: 18px; justify-content: flex-end; }
  .vp-modal-knoppen button { padding: 8px 16px; border-radius: 6px; font-size: 0.9em; cursor: pointer; }
  .vp-modal-knoppen .vp-btn-cancel { background: #fff; border: 1px solid #ccc; }
  .vp-modal-knoppen .vp-btn-export { background: var(--jopen-red); color: #fff; border: 1px solid var(--jopen-red); }
  .vp-modal-melding { font-size: 0.85em; margin-top: 10px; color: #a33f2c; }
</style>
</head>
<body>

  <div id="jopen-nav"></div>

  <main class="vp-main">
    <h1 style="margin-bottom:2px;">Consumption forecast</h1>
    <p class="jopen-subtitel" style="margin-top:0;">Raw material requirements based on the brew planning, for a chosen week range.</p>

    <div class="vp-toolbar">
      <div class="vp-veld">
        <label for="vp-jaar">Year</label>
        <select id="vp-jaar"></select>
      </div>
      <div class="vp-veld">
        <label for="vp-van">From week</label>
        <input type="number" id="vp-van" min="1" max="53" value="1" />
      </div>
      <div class="vp-veld">
        <label for="vp-tot">To week</label>
        <input type="number" id="vp-tot" min="1" max="53" value="12" />
      </div>
      <div class="vp-veld">
        <label for="vp-ingredient-filter">Ingredient</label>
        <input type="text" id="vp-ingredient-filter" placeholder="All ingredients" style="min-width:180px;" />
      </div>
      <div class="vp-samenvatting" id="vp-samenvatting">—</div>
      <button type="button" id="vp-export-btn" class="vp-export-btn" disabled>Export to Excel</button>
    </div>

    <div class="vp-filter-tabs" id="vp-filter-tabs">
      <button type="button" class="actief" data-rol="alle">All</button>
      <button type="button" data-rol="hoofdmout">Malt &amp; grains</button>
      <button type="button" data-rol="hops">Hops</button>
      <button type="button" data-rol="toegift_brouwerij">Brewing additions</button>
      <button type="button" data-rol="gist">Yeast</button>
      <button type="button" data-rol="toegift_kelder">Cellar additions</button>
    </div>

    <div id="vp-resultaat">
      <div class="vp-skeleton">Select a week range to calculate.</div>
    </div>
  </main>

  <div class="vp-modal-overlay" id="vp-export-modal-overlay">
    <div class="vp-modal">
      <h3>Export to Excel</h3>
      <p>Choose which raw material categories to include in the export.</p>
      <div id="vp-export-categorieen"></div>
      <div class="vp-modal-melding" id="vp-export-melding"></div>
      <div class="vp-modal-knoppen">
        <button type="button" class="vp-btn-cancel" id="vp-export-cancel">Cancel</button>
        <button type="button" class="vp-btn-export" id="vp-export-confirm">Export</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"></script>
  <script src="config.js"></script>
  <script src="nav.js"></script>
  <script src="voorraad-forecast.js"></script>
  <script>
    const ROL_LABEL = {
      hoofdmout: 'Malt & grains',
      hops: 'Hops',
      toegift_brouwerij: 'Brewing additions',
      gist: 'Yeast',
      toegift_kelder: 'Cellar additions',
    };
    const ROL_VOLGORDE = ['hoofdmout', 'hops', 'toegift_brouwerij', 'gist', 'toegift_kelder'];

    // Eenheid -> kg, alleen voor de expliciete "Total (kg)"-kolom bij hop.
    // Bewust voorzichtig: bij een onherkende eenheid gokken we niet, maar
    // tonen we "—" zodat het opvalt en handmatig nagekeken kan worden.
    function naarKg(eenheid, hoeveelheid) {
      const e = (eenheid || '').trim().toLowerCase();
      if (['kg', 'kilogram', 'kilo'].includes(e)) return hoeveelheid;
      if (['g', 'gr', 'gram', 'grams'].includes(e)) return hoeveelheid / 1000;
      return null;
    }

    let huidigJaar = new Date().getFullYear();
    let actieveRolFilter = 'alle';
    let laatsteResultaat = null; // { perRol: { rol: [{ingredientId, naam, eenheid, totaal, perRecept:[{naam,brouwsels,hoeveelheid}]}] }, aantalBrouwsels, aantalRecepten }

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str ?? '';
      return div.innerHTML;
    }

    function isoWeeksInYear(jaar) {
      const d = new Date(Date.UTC(jaar, 0, 1));
      const dow = d.getUTCDay() || 7;
      const isLeap = (jaar % 4 === 0 && jaar % 100 !== 0) || jaar % 400 === 0;
      return dow === 4 || (dow === 3 && isLeap) ? 53 : 52;
    }

    function vulJaarSelector() {
      const select = document.getElementById('vp-jaar');
      const dit = new Date().getFullYear();
      for (let j = dit - 1; j <= dit + 2; j++) {
        const opt = document.createElement('option');
        opt.value = j; opt.textContent = j;
        if (j === huidigJaar) opt.selected = true;
        select.appendChild(opt);
      }
    }

    // ------------------------------------------------------------------
    // Berekening -- kern zit sinds de Stock overview-sessie in voorraad-forecast.js
    // (gedeeld met die pagina), zie berekenPrognose() verderop.
    // ------------------------------------------------------------------

    async function berekenPrognose() {
      const jaar = Number(document.getElementById('vp-jaar').value);
      const van = Number(document.getElementById('vp-van').value);
      const tot = Number(document.getElementById('vp-tot').value);
      const resultaatEl = document.getElementById('vp-resultaat');

      if (!van || !tot || van < 1 || tot > 53 || van > tot) {
        resultaatEl.innerHTML = '<div class="vp-leeg">Enter a valid week range (from ≤ to).</div>';
        laatsteResultaat = null;
        document.getElementById('vp-export-btn').disabled = true;
        return;
      }

      resultaatEl.innerHTML = '<div class="vp-skeleton">Calculating…</div>';
      huidigJaar = jaar;

      // Kernberekening zit in voorraad-forecast.js -- gedeeld met Stock overview zodat
      // beide pagina's altijd hetzelfde getal voor dezelfde week laten zien.
      const resultaat = await vfBerekenVerbruik(supabaseClient, [{ jaar, vanWeek: van, totWeek: tot }]);

      if (resultaat.error) {
        resultaatEl.innerHTML = `<div class="vp-leeg">Could not load brew planning: ${escapeHtml(resultaat.error.message)}</div>`;
        laatsteResultaat = null;
        document.getElementById('vp-export-btn').disabled = true;
        return;
      }
      if (resultaat.aantalBrouwsels === 0) {
        document.getElementById('vp-samenvatting').textContent = 'No brews planned in this range.';
        resultaatEl.innerHTML = '<div class="vp-leeg">No brews planned in the selected week range.</div>';
        laatsteResultaat = null;
        document.getElementById('vp-export-btn').disabled = true;
        return;
      }

      laatsteResultaat = {
        perRol: resultaat.perRol,
        aantalBrouwsels: resultaat.aantalBrouwsels,
        aantalRecepten: resultaat.aantalRecepten,
      };

      document.getElementById('vp-samenvatting').textContent =
        `${laatsteResultaat.aantalRecepten} recipe(s) · ${laatsteResultaat.aantalBrouwsels} brew(s) planned in wk ${van}–${tot}`;

      renderResultaat();
    }

    // ------------------------------------------------------------------
    // Renderen
    // ------------------------------------------------------------------
    function renderResultaat() {
      const resultaatEl = document.getElementById('vp-resultaat');
      if (!laatsteResultaat) return;
      document.getElementById('vp-export-btn').disabled = Object.keys(laatsteResultaat.perRol).length === 0;

      const rollenTeTonen = actieveRolFilter === 'alle' ? ROL_VOLGORDE : [actieveRolFilter];
      const ingredientZoekterm = document.getElementById('vp-ingredient-filter').value.trim().toLowerCase();
      let html = '';
      let ietsGetoond = false;

      rollenTeTonen.forEach(rol => {
        const ingredientenVanRol = laatsteResultaat.perRol[rol];
        if (!ingredientenVanRol || Object.keys(ingredientenVanRol).length === 0) return;

        let rijen = Object.values(ingredientenVanRol).sort((a, b) => b.totaal - a.totaal);
        if (ingredientZoekterm) rijen = rijen.filter(r => r.naam.toLowerCase().includes(ingredientZoekterm));
        if (rijen.length === 0) return;
        ietsGetoond = true;
        const isHopsGroep = rol === 'hops';

        html += `
          <div class="vp-groep">
            <div class="vp-groep-titel">${ROL_LABEL[rol] || rol}</div>
            <table class="vp-tabel">
              <thead><tr><th>Ingredient</th><th>Total needed</th>${isHopsGroep ? '<th>Total (kg)</th>' : ''}</tr></thead>
              <tbody>
                ${rijen.map((r, i) => {
                  const kg = isHopsGroep ? naarKg(r.eenheid, r.totaal) : null;
                  const mixedBadge = r.mixedUnits
                    ? ` <span class="vp-mixed-badge" title="This ingredient has quantities recorded under more than one unit (check the ingredient card and recipe lines) — these are shown as separate rows and NOT added together, since that could combine incompatible units.">⚠ mixed units</span>`
                    : '';
                  const missingHlBadge = r.missingBrouwselHl
                    ? ` <span class="vp-mixed-badge" title="One or more recipe lines for this ingredient use a rate (X/hl or X/l) but the recipe's Brouwsel (hl) is not filled in, so that amount could not be converted and is NOT included in the total below.">⚠ missing Brouwsel (hl)</span>`
                    : '';
                  return `
                  <tr class="vp-rij-ingredient" data-detail="detail-${rol}-${i}">
                    <td>${escapeHtml(r.naam)}${mixedBadge}${missingHlBadge}</td>
                    <td>${formatGetal(r.totaal)}${r.eenheid ? ' ' + escapeHtml(r.eenheid) : ''}</td>
                    ${isHopsGroep ? `<td>${kg !== null ? formatGetal(kg) + ' kg' : `<span title="Unit '${escapeHtml(r.eenheid || '')}' not recognized — check manually">—</span>`}</td>` : ''}
                  </tr>
                  <tr class="vp-detail-rij" id="detail-${rol}-${i}">
                    <td colspan="${isHopsGroep ? 3 : 2}">
                      Per recipe:
                      <ul>
                        ${Object.entries(r.perRecept).map(([naam, hoev]) =>
                          `<li>${escapeHtml(naam)}: ${formatGetal(hoev)}${r.eenheid ? ' ' + escapeHtml(r.eenheid) : ''}</li>`
                        ).join('')}
                      </ul>
                    </td>
                  </tr>`;
                }).join('')}
              </tbody>
            </table>
          </div>`;
      });

      if (!ietsGetoond) {
        resultaatEl.innerHTML = '<div class="vp-leeg">Nothing in this category for the selected weeks.</div>';
        return;
      }

      resultaatEl.innerHTML = html;
      resultaatEl.querySelectorAll('.vp-rij-ingredient').forEach(tr => {
        tr.addEventListener('click', () => {
          const detail = document.getElementById(tr.dataset.detail);
          if (detail) detail.style.display = detail.style.display === 'table-row' ? 'none' : 'table-row';
        });
      });
    }

    function formatGetal(n) {
      // Nette weergave: geen overbodige decimalen, max 2.
      return Math.round(n * 100) / 100;
    }

    // ------------------------------------------------------------------
    // Export to Excel
    // ------------------------------------------------------------------
    function vulExportModal() {
      const container = document.getElementById('vp-export-categorieen');
      container.innerHTML = ROL_VOLGORDE.map(rol => `
        <label class="vp-modal-categorie-rij">
          <input type="checkbox" class="vp-export-categorie" value="${rol}" checked />
          ${ROL_LABEL[rol] || rol}
        </label>`).join('');
    }

    function openExportModal() {
      if (!laatsteResultaat || Object.keys(laatsteResultaat.perRol).length === 0) return;
      document.getElementById('vp-export-melding').textContent = '';
      vulExportModal();
      document.getElementById('vp-export-modal-overlay').classList.add('open');
    }
    function sluitExportModal() {
      document.getElementById('vp-export-modal-overlay').classList.remove('open');
    }

    async function exporteerNaarExcel(gekozenRollen) {
      const jaar = document.getElementById('vp-jaar').value;
      const van = document.getElementById('vp-van').value;
      const tot = document.getElementById('vp-tot').value;

      const workbook = new ExcelJS.Workbook();
      const sheet = workbook.addWorksheet('Consumption Forecast');
      sheet.getColumn(1).width = 38;
      sheet.getColumn(2).width = 20;
      sheet.getColumn(3).width = 14;

      const kopCel = sheet.getCell('A1');
      kopCel.value = `Selected weeks: wk ${van} - ${tot} (${jaar})`;
      kopCel.font = { bold: true, size: 13 };

      let rijIndex = 3;
      let tabellenGeschreven = 0;

      ROL_VOLGORDE.forEach(rol => {
        if (!gekozenRollen.includes(rol)) return;
        const ingredientenVanRol = laatsteResultaat.perRol[rol];
        if (!ingredientenVanRol || Object.keys(ingredientenVanRol).length === 0) return;

        const rijen = Object.values(ingredientenVanRol).sort((a, b) => b.totaal - a.totaal);

        const titelCel = sheet.getCell(`A${rijIndex}`);
        titelCel.value = ROL_LABEL[rol] || rol;
        titelCel.font = { bold: true, size: 12 };
        rijIndex += 1;

        const tabelStartRij = rijIndex;
        sheet.addTable({
          name: `Tabel_${rol}`,
          ref: `A${tabelStartRij}`,
          headerRow: true,
          style: { theme: 'TableStyleLight15', showRowStripes: true },
          columns: [
            { name: 'Ingredient' },
            { name: 'Total needed' },
            { name: 'Checked' },
          ],
          rows: rijen.map(r => [
            r.naam,
            `${formatGetal(r.totaal)}${r.eenheid ? ' ' + r.eenheid : ''}`,
            null,
          ]),
        });

        tabellenGeschreven += 1;
        rijIndex = tabelStartRij + 1 + rijen.length + 2; // header + datarijen + 2 lege rijen ervoor de volgende categorie
      });

      if (tabellenGeschreven === 0) return false;

      const buffer = await workbook.xlsx.writeBuffer();
      const blob = new Blob([buffer], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
      const bestandsnaam = `Consumption Forecast Week ${van} - ${tot}.xlsx`;
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = bestandsnaam;
      document.body.appendChild(link);
      link.click();
      link.remove();
      URL.revokeObjectURL(link.href);
      return true;
    }

    document.getElementById('vp-export-btn').addEventListener('click', openExportModal);
    document.getElementById('vp-export-cancel').addEventListener('click', sluitExportModal);
    document.getElementById('vp-export-modal-overlay').addEventListener('click', (e) => {
      if (e.target.id === 'vp-export-modal-overlay') sluitExportModal();
    });
    document.getElementById('vp-export-confirm').addEventListener('click', async () => {
      const gekozenRollen = [...document.querySelectorAll('.vp-export-categorie:checked')].map(cb => cb.value);
      const melding = document.getElementById('vp-export-melding');
      if (gekozenRollen.length === 0) {
        melding.textContent = 'Choose at least one category.';
        return;
      }
      melding.textContent = '';
      const knop = document.getElementById('vp-export-confirm');
      knop.disabled = true;
      knop.textContent = 'Exporting…';
      try {
        const gelukt = await exporteerNaarExcel(gekozenRollen);
        if (!gelukt) {
          melding.textContent = 'Nothing to export for the chosen categories.';
        } else {
          sluitExportModal();
        }
      } catch (err) {
        melding.textContent = 'Export failed: ' + err.message;
      } finally {
        knop.disabled = false;
        knop.textContent = 'Export';
      }
    });

    // ------------------------------------------------------------------
    // Init
    // ------------------------------------------------------------------
    document.getElementById('vp-filter-tabs').addEventListener('click', (e) => {
      const btn = e.target.closest('button[data-rol]');
      if (!btn) return;
      document.querySelectorAll('#vp-filter-tabs button').forEach(b => b.classList.remove('actief'));
      btn.classList.add('actief');
      actieveRolFilter = btn.dataset.rol;
      renderResultaat();
    });

    ['vp-jaar', 'vp-van', 'vp-tot'].forEach(id => {
      document.getElementById(id).addEventListener('change', berekenPrognose);
    });
    document.getElementById('vp-ingredient-filter').addEventListener('input', renderResultaat);

    (async function init() {
      const ok = await vereisIngelogd();
      if (!ok) return;
      vulJaarSelector();

      // Standaard: huidige week t/m 8 weken vooruit, binnen het huidige jaar.
      const nuJaar = new Date().getFullYear();
      const nuWeek = (() => {
        const d = new Date();
        const jan4 = new Date(d.getFullYear(), 0, 4);
        const dagNr = (d.getDay() + 6) % 7;
        d.setDate(d.getDate() - dagNr + 3);
        const jan4Dag = (jan4.getDay() + 6) % 7;
        jan4.setDate(jan4.getDate() - jan4Dag + 3);
        return 1 + Math.round((d - jan4) / (7 * 24 * 3600 * 1000));
      })();
      document.getElementById('vp-jaar').value = nuJaar;
      document.getElementById('vp-van').value = Math.max(1, nuWeek);
      document.getElementById('vp-tot').value = Math.min(isoWeeksInYear(nuJaar), nuWeek + 8);

      // Vanuit Stock overview kan hierheen gelinkt worden met een vooraf ingevulde
      // grondstof + weekbereik: ?ingredient=<id>&jaar=YYYY&van=WW&tot=WW. Cross-jaar
      // bereiken (loopt-leeg-week in het volgende jaar) worden bewust geclipt naar het
      // einde van "jaar" -- een bereik-selector die twee jaren overspant bestaat hier
      // nog niet, dat zou een aparte uitbreiding zijn.
      const params = new URLSearchParams(window.location.search);
      const jaarParam = params.get('jaar');
      const vanParam = params.get('van');
      const totParam = params.get('tot');
      const ingredientParam = params.get('ingredient');
      if (jaarParam) document.getElementById('vp-jaar').value = jaarParam;
      if (vanParam) document.getElementById('vp-van').value = vanParam;
      if (totParam) document.getElementById('vp-tot').value = Math.min(Number(totParam), isoWeeksInYear(Number(jaarParam || nuJaar)));
      if (ingredientParam) {
        const { data } = await supabaseClient.from('ingredients').select('naam').eq('id', ingredientParam).eq('versie_status', 'huidig').single();
        if (data) document.getElementById('vp-ingredient-filter').value = data.naam;
      }

      await berekenPrognose();
    })();
  </script>
</body>
</html>
