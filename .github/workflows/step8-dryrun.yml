name: Step 8 dry run (temporary)

# Temporary: dumps production (read-only), restores it in a throw-away
# Postgres in this runner and runs the step 8 migration there. Only counts
# and column names are printed; the dump never leaves the runner.
# Removed again before step 8 is merged.

on:
  push:
    branches: [step8-recipe-english]
    paths: ['supabase/migrations/20261016190000_recipe_english_names.sql', '.github/dryrun/**', '.github/workflows/step8-dryrun.yml']

env:
  PG_BIN: /usr/lib/postgresql/17/bin
  TEST_DB: postgresql://postgres:test@localhost:5432/postgres

jobs:
  dryrun:
    runs-on: ubuntu-latest
    services:
      testdb:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - name: Install postgresql-client 17
        run: |
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17
      - name: Dump production (read-only) and restore
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          mkdir -p /tmp/d
          EIGEN=$("$PG_BIN/psql" "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -tA -f .github/backup/eigen_schemas.sql)
          ARGS=(); IFS=',' read -ra S <<< "$EIGEN"; for s in "${S[@]}"; do ARGS+=(--schema="$s"); done
          "$PG_BIN/pg_dump" "$SUPABASE_DB_URL" "${ARGS[@]}" -Fc -f /tmp/d/public.dump
          "$PG_BIN/pg_dump" "$SUPABASE_DB_URL" --table=auth.users --table=auth.identities -Fc -f /tmp/d/auth.dump
          bash .github/backup/herstel.sh /tmp/d/public.dump /tmp/d/auth.dump "$TEST_DB"
          rm -rf /tmp/d
      - name: Before
        run: |
          "$PG_BIN/psql" "$TEST_DB" -v ON_ERROR_STOP=1 -f .github/dryrun/before.sql
      - name: Apply step 8 (one transaction)
        run: |
          "$PG_BIN/psql" "$TEST_DB" -v ON_ERROR_STOP=1 -1 -q -f supabase/migrations/20261016190000_recipe_english_names.sql
      - name: After
        run: |
          "$PG_BIN/psql" "$TEST_DB" -v ON_ERROR_STOP=1 -f .github/dryrun/checks.sql
      - name: Column list (for the static query check)
        run: |
          "$PG_BIN/psql" "$TEST_DB" -tA -c "select table_name||'.'||column_name from information_schema.columns where table_schema='public' order by 1" > columns.txt
          wc -l columns.txt
          python3 tools/check_query_columns.py columns.txt recipes,recipe_brewing_specs,recipe_comments,recipe_fermentation,recipe_ingredients,recipe_costs,recipe_process_steps,recipe_revisions,recipe_specs,recipe_packaging,recipe_water,product_sheets,product_sheet_revisions,product_sheet_status,hop_utilization_curve,water_settings,water_settings_history,ingredients,users *.html *.js batchrapport-generator/*.js || true
