name: Step 10 dry run (temporary)

# Temporary: dumps production (read-only), restores it in a throw-away
# Postgres and runs the advisor-fixes migration there. Only checks are
# published as annotations. Removed again before merging.

on:
  push:
    branches: [step10-wrapup]
    paths: ['supabase/migrations/20261018120000_advisor_fixes.sql', '.github/dryrun/**', '.github/workflows/step10-dryrun.yml']

env:
  PG_BIN: /usr/lib/postgresql/17/bin
  TEST_DB: postgresql://postgres:test@localhost:5432/postgres

jobs:
  dryrun:
    runs-on: ubuntu-latest
    services:
      testdb:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - name: Install postgresql-client 17
        run: |
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17
      - name: Dump production (read-only) and restore
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          mkdir -p /tmp/d
          EIGEN=$("$PG_BIN/psql" "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -tA -f .github/backup/eigen_schemas.sql)
          ARGS=(); IFS=',' read -ra S <<< "$EIGEN"; for s in "${S[@]}"; do ARGS+=(--schema="$s"); done
          "$PG_BIN/pg_dump" "$SUPABASE_DB_URL" "${ARGS[@]}" -Fc -f /tmp/d/public.dump
          "$PG_BIN/pg_dump" "$SUPABASE_DB_URL" --table=auth.users --table=auth.identities -Fc -f /tmp/d/auth.dump
          bash .github/backup/herstel.sh /tmp/d/public.dump /tmp/d/auth.dump "$TEST_DB"
          rm -rf /tmp/d
      - name: Apply migration
        run: |
          "$PG_BIN/psql" "$TEST_DB" -v ON_ERROR_STOP=1 -q -f supabase/migrations/20261018120000_advisor_fixes.sql > apply.txt 2>&1 || { bash .github/dryrun/notice.sh ApplyFailed apply.txt; exit 1; }
          echo ok >> apply.txt; bash .github/dryrun/notice.sh Apply apply.txt
      - name: Checks
        run: |
          "$PG_BIN/psql" "$TEST_DB" -v ON_ERROR_STOP=1 -tA -F ' | ' -f .github/dryrun/checks.sql > out.txt 2>&1 || true
          bash .github/dryrun/notice.sh Checks out.txt
