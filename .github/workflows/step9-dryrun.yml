name: Step 9 dry run (temporary)

# Temporary: dumps production (read-only), restores it in a throw-away
# Postgres in this runner and runs the step 9 migration there. Only counts
# and column names are printed; the dump never leaves the runner.
# Removed again before step 9 is merged.

on:
  push:
    branches: [step9-production-english]
    paths: ['supabase/migrations/20261017090000_production_english_names.sql', '.github/dryrun/**', '.github/workflows/step9-dryrun.yml']

env:
  PG_BIN: /usr/lib/postgresql/17/bin
  TEST_DB: postgresql://postgres:test@localhost:5432/postgres

jobs:
  dryrun:
    runs-on: ubuntu-latest
    services:
      testdb:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - name: Install postgresql-client 17
        run: |
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17
      - name: Dump production (read-only) and restore
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          mkdir -p /tmp/d
          EIGEN=$("$PG_BIN/psql" "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -tA -f .github/backup/eigen_schemas.sql)
          ARGS=(); IFS=',' read -ra S <<< "$EIGEN"; for s in "${S[@]}"; do ARGS+=(--schema="$s"); done
          "$PG_BIN/pg_dump" "$SUPABASE_DB_URL" "${ARGS[@]}" -Fc -f /tmp/d/public.dump
          "$PG_BIN/pg_dump" "$SUPABASE_DB_URL" --table=auth.users --table=auth.identities -Fc -f /tmp/d/auth.dump
          bash .github/backup/herstel.sh /tmp/d/public.dump /tmp/d/auth.dump "$TEST_DB"
          rm -rf /tmp/d
      - name: Before
        run: |
          "$PG_BIN/psql" "$TEST_DB" -v ON_ERROR_STOP=1 -f .github/dryrun/before.sql | tee out.txt
          bash .github/dryrun/notice.sh Before out.txt
      - name: Apply step 9 (one transaction)
        run: |
          "$PG_BIN/psql" "$TEST_DB" -v ON_ERROR_STOP=1 -1 -q -f supabase/migrations/20261017090000_production_english_names.sql
      - name: After
        run: |
          "$PG_BIN/psql" "$TEST_DB" -v ON_ERROR_STOP=1 -f .github/dryrun/checks.sql | tee out.txt
          bash .github/dryrun/notice.sh After out.txt
      - name: Column list (for the static query check)
        run: |
          "$PG_BIN/psql" "$TEST_DB" -tA -c "select table_name||'.'||column_name from information_schema.columns where table_schema='public' order by 1" > columns.txt
          python3 -c "import json;d={};[d.setdefault(t,[]).append(c) for t,c in (l.strip().split('.',1) for l in open('columns.txt') if l.strip())];print(json.dumps(d,separators=(',',':')))" > columns.json
          bash .github/dryrun/notice.sh Columns columns.json
          python3 tools/check_query_columns.py columns.txt batches,brew_capacity,brew_planning,brew_planning_history,brew_planning_splits,brew_planning_history_detailed,brew_planning_changes,users,recipes *.html *.js batchrapport-generator/*.js > check.txt 2>&1 || true
          bash .github/dryrun/notice.sh ColumnCheck check.txt
