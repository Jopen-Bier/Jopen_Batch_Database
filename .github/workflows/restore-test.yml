name: Restore test

# Controleert wekelijks dat de backup ook echt TERUG TE ZETTEN is, niet alleen
# dat hij gemaakt wordt.
#
# Haalt een backup op uit de private backup-repo (zoals je dat in een echte
# noodsituatie ook zou doen), zet hem terug in een wegwerp-Postgres 17 in
# deze runner, en vergelijkt het aantal rijen per tabel met het manifest dat
# bij die backup is gemaakt. Er is dus GEEN apart Supabase-testproject nodig,
# en productie wordt nooit aangeraakt.
#
# Standaard: de nieuwste backup. Handmatig kan een datum gekozen worden.
# Let op: alleen backups vanaf de invoering van de auth-dump + manifest
# (oktober 2026) zijn met deze test te controleren.
#
# Hergebruikt de secrets BACKUP_REPO_PAT en BACKUP_REPO.
#
# Since security phase 6 also: an app smoke test on the restored copy
# (smoke_test.sql), a check that the Storage mirror is complete and readable
# (verify_storage_backup.py; uses STORAGE_BACKUP_REPO and, read-only,
# SUPABASE_DB_URL for the live file list), and backups older than 30 days
# are taken from the backup repo's git history when a date is given.

on:
  schedule:
    - cron: '30 4 * * 1'   # elke maandag 04:30 UTC, na de nachtelijke backup
  workflow_dispatch:
    inputs:
      datum:
        description: 'Datum van de backup, bv. 2026-10-05 (leeg = nieuwste)'
        required: false
        default: ''

env:
  PG_BIN: /usr/lib/postgresql/17/bin

jobs:
  restore-test:
    runs-on: ubuntu-latest
    environment: production   # secrets live in this environment; only main may use it (security phase 3)
    services:
      testdb:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/backup

      - name: Install postgresql-client 17
        run: |
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17

      - name: Haal backup op uit backup-repo
        env:
          BACKUP_REPO_PAT: ${{ secrets.BACKUP_REPO_PAT }}
          BACKUP_REPO: ${{ secrets.BACKUP_REPO }}
          GEVRAAGD: ${{ github.event.inputs.datum }}
        run: |
          git clone --depth 1 "https://x-access-token:${BACKUP_REPO_PAT}@github.com/${BACKUP_REPO}.git" backup-repo
          if [ -n "$GEVRAAGD" ]; then
            DATUM="$GEVRAAGD"
          else
            DATUM=$(ls -1 backup-repo/manifests/jopen_backup_*.json 2>/dev/null | sort | tail -n 1 | sed -E 's/.*jopen_backup_(.*)\.json/\1/')
          fi
          [ -n "$DATUM" ] || { echo "::error::Geen backup met manifest gevonden in manifests/."; exit 1; }
          for f in "dumps/jopen_backup_${DATUM}.dump" "dumps/jopen_auth_${DATUM}.dump" "manifests/jopen_backup_${DATUM}.json"; do
            if [ ! -f "backup-repo/$f" ]; then
              # Older than 30 days: removed from the folder, still in the git
              # history. Fetch the history once and take the file from the
              # commit just before it was removed (security phase 6).
              [ -f backup-repo/.git/shallow ] && git -C backup-repo fetch -q --unshallow
              DEL=$(git -C backup-repo log -1 --format=%H --diff-filter=D -- "$f")
              [ -n "$DEL" ] && git -C backup-repo show "${DEL}^:$f" > "backup-repo/$f" || rm -f "backup-repo/$f"
            fi
            test -f "backup-repo/$f" || { echo "::error::Ontbreekt: $f (backups van vóór oktober 2026 hebben geen auth-dump/manifest)"; exit 1; }
          done
          echo "DATUM=${DATUM}" >> "$GITHUB_ENV"
          echo "Te testen backup: ${DATUM}"

      - name: Terugzetten
        env:
          TEST_DB: postgresql://postgres:test@localhost:5432/postgres
        run: |
          bash .github/backup/herstel.sh \
            "backup-repo/dumps/jopen_backup_${DATUM}.dump" \
            "backup-repo/dumps/jopen_auth_${DATUM}.dump" \
            "$TEST_DB"

      - name: Vergelijk met manifest
        env:
          TEST_DB: postgresql://postgres:test@localhost:5432/postgres
        run: |
          # Tel de schema's die in de teruggezette kopie zitten. Ontbreekt er
          # één t.o.v. het manifest, dan ontbreken die tabellen en faalt de test.
          EIGEN=$("$PG_BIN/psql" "$TEST_DB" -v ON_ERROR_STOP=1 -tA -f .github/backup/eigen_schemas.sql)
          "$PG_BIN/psql" "$TEST_DB" -v ON_ERROR_STOP=1 -v eigen="$EIGEN" -tA -f .github/backup/tel_rijen.sql > hersteld.json
          python3 .github/backup/vergelijk_tellingen.py test \
            --manifest "backup-repo/manifests/jopen_backup_${DATUM}.json" --hersteld hersteld.json

      - name: App smoke test on the restored copy
        env:
          TEST_DB: postgresql://postgres:test@localhost:5432/postgres
        run: |
          # Rights helpers, RLS on every table, two-factor rule, all views (security phase 6)
          "$PG_BIN/psql" "$TEST_DB" -v ON_ERROR_STOP=1 -q -f .github/backup/smoke_test.sql

      - name: Storage backup restorable
        env:
          BACKUP_REPO_PAT: ${{ secrets.BACKUP_REPO_PAT }}
          STORAGE_BACKUP_REPO: ${{ secrets.STORAGE_BACKUP_REPO }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          # Every file in the mirror present, right size and a real PDF/image/
          # Office file; every Storage object older than 36 h in the mirror.
          git clone -q --depth 1 "https://x-access-token:${BACKUP_REPO_PAT}@github.com/${STORAGE_BACKUP_REPO}.git" storage-repo
          "$PG_BIN/psql" "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -tA -f .github/backup/storage_lijst.sql > live.json
          python3 .github/backup/verify_storage_backup.py --mirror storage-repo --live live.json
