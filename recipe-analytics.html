<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jopen — Recipe analytics</title>
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="stylesheet" href="jopen-shared.css" />
  <style>
    /* ------------------------------------------------------------------
       Recipe analytics: sidebar with analyses (as on Settings), the chosen
       analysis on the right. New analysis? Add it to RA_ANALYSES in the
       script: its loader, pooled figures, data checks and four views.
       ------------------------------------------------------------------ */
    :root { --ra-cellar: #4c6b4f; --ra-filling: #b4772c; --ra-muted: #6b6355; --ra-line: #ddd; --ra-warn: #a33f2c; --ra-left-out: #e7e2d8; }
    main.ra-main { max-width: 1240px; margin: 0 auto; padding: 24px; }
    .ra-layout { display: flex; gap: 24px; align-items: flex-start; }
    .ra-sidebar {
      width: 210px; flex-shrink: 0; background: #fff; border: 1px solid var(--ra-line); border-radius: 8px;
      padding: 8px; position: sticky; top: calc(var(--jopen-nav-h, 0px) + 20px);
    }
    .ra-sidebar h3 { font-size: 0.72em; text-transform: uppercase; letter-spacing: .06em; color: var(--ra-muted); margin: 10px 12px 4px; }
    .ra-sidebar button {
      display: block; width: 100%; text-align: left; padding: 9px 12px; margin-bottom: 2px;
      background: transparent; border: none; border-radius: 6px; cursor: pointer; font-size: 0.92em; color: #1f1f1f;
    }
    .ra-sidebar button:hover { background: var(--jopen-red-tint); }
    .ra-sidebar button.actief { background: var(--jopen-red); color: #fff; font-weight: 600; }
    .ra-inhoud { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 16px; }
    .ra-view { display: flex; flex-direction: column; gap: 16px; }

    .ra-tabs { display: flex; flex-wrap: wrap; gap: 4px; border-bottom: 2px solid var(--jopen-red-dark); }
    .ra-tab { padding: 9px 18px; border: 1px solid var(--ra-line); border-bottom: none; border-radius: 6px 6px 0 0; background: #ece8e4; color: #555; font-size: 14px; font-weight: 600; cursor: pointer; }
    .ra-tab.actief { background: var(--jopen-red-dark); border-color: var(--jopen-red-dark); color: #fff; }
    .ra-tab .ra-count { font-weight: 400; opacity: .85; }
    .ra-toolbar { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; background: #fff; border: 1px solid var(--ra-line); border-radius: 8px; padding: 10px 16px; font-size: 13px; }
    .ra-toolbar label { display: flex; align-items: center; gap: 6px; color: #555; }
    .ra-toolbar select, .ra-toolbar input[type=search] { font: inherit; padding: 5px 8px; border: 1px solid #ccc; border-radius: 4px; background: #fff; max-width: 100%; }
    .ra-chips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
    .ra-chip { padding: 4px 11px; border-radius: 14px; border: 1px solid #ccc; background: #fff; font-size: 12.5px; cursor: pointer; display: inline-flex; gap: 6px; align-items: center; }
    .ra-chip.actief { background: var(--jopen-red); border-color: var(--jopen-red); color: #fff; }
    .ra-dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; flex-shrink: 0; }

    .ra-kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
    .ra-kpi { background: #fff; border: 1px solid var(--ra-line); border-radius: 8px; padding: 12px 16px; }
    .ra-kpi .l { font-size: 12px; color: var(--ra-muted); }
    .ra-kpi .v { font-size: 26px; font-weight: 700; font-variant-numeric: tabular-nums; margin-top: 2px; }
    .ra-kpi .v small { font-size: 13px; font-weight: 400; color: var(--ra-muted); margin-left: 4px; }
    .ra-card { background: #fff; border: 1px solid var(--ra-line); border-radius: 8px; padding: 16px 20px; min-width: 0; }
    .ra-card h2 { font-size: 1.05em; margin: 0 0 4px; }
    .ra-card .ra-note { color: var(--ra-muted); font-size: 12.5px; margin: 0 0 12px; }
    .ra-legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 12px; color: var(--ra-muted); margin: 0 0 6px; }
    .ra-legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
    .ra-chart { position: relative; }
    .ra-chart svg { display: block; width: 100%; height: auto; }
    .ra-chart text { font-size: 11px; fill: var(--ra-muted); }
    .ra-tip { position: absolute; pointer-events: none; background: #fff; border: 1px solid var(--ra-line); border-radius: 6px; box-shadow: 0 4px 14px rgba(0,0,0,.12); padding: 6px 9px; font-size: 12px; white-space: nowrap; z-index: 3; }

    .ra-tw { overflow: auto; max-height: 560px; }
    table.ra-table { border-collapse: collapse; width: 100%; font-size: 13px; font-variant-numeric: tabular-nums; }
    table.ra-table th, table.ra-table td { padding: 7px 9px; border-bottom: 1px solid #eee; text-align: right; white-space: nowrap; }
    table.ra-table th.t, table.ra-table td.t { text-align: left; }
    table.ra-table thead th { position: sticky; top: 0; background: #faf8f3; color: #444; font-weight: 700; z-index: 1; }
    table.ra-table thead th.sort { cursor: pointer; }
    table.ra-table tbody tr:hover td { background: #faf9f6; }
    table.ra-table tr.ra-out td { color: #9a9387; }
    table.ra-table a { color: var(--jopen-red-dark); font-weight: 600; }
    .ra-link { color: var(--jopen-red-dark); cursor: pointer; text-decoration: underline; text-underline-offset: 2px; background: none; border: 0; font: inherit; padding: 0; }
    .ra-pct { display: inline-flex; align-items: center; gap: 8px; justify-content: flex-end; }
    .ra-bar { display: inline-flex; width: 90px; height: 9px; background: #f0ece4; border-radius: 5px; overflow: hidden; }
    .ra-bar.wide { width: 100%; height: 14px; border-radius: 3px; }
    .ra-bar b { display: block; height: 100%; }
    .ra-flag { display: inline-block; font-size: 11px; color: var(--ra-warn); border: 1px solid #e6c3bb; background: #fbf0ed; border-radius: 9px; padding: 0 7px; white-space: nowrap; }
    .ra-ok { font-size: 11px; color: var(--ra-cellar); }
    .ra-muted { color: var(--ra-muted); }
    .ra-empty { color: var(--ra-muted); font-size: 13px; padding: 20px 0; }
    .ra-later { color: var(--ra-muted); }
    .ra-melding { padding: 40px; text-align: center; color: var(--ra-muted); }
    .ra-fout { background: #fdecea; border: 1px solid #e0a39b; color: #a33f2c; padding: 12px 16px; border-radius: 8px; }
    .ra-view { min-width: 0; }
    @media (max-width: 760px) {
      .ra-layout { flex-direction: column; align-items: stretch; }
      .ra-inhoud { width: 100%; }
      .ra-sidebar { width: 100%; position: static; box-sizing: border-box; display: flex; flex-wrap: wrap; gap: 4px; }
      .ra-sidebar h3 { width: 100%; }
      .ra-sidebar button { width: auto; margin: 0; }
    }
  </style>
</head>
<body>

  <div id="jopen-nav"></div>

  <main class="jopen-pagina ra-main">
    <h1>Recipe analytics</h1>
    <p class="jopen-subtitel">Analyses per recipe over all its batches. Pick an analysis on the left.</p>

    <div id="ra-toegang" class="ra-melding">Checking access…</div>

    <div id="ra-content" class="ra-layout" style="display:none;">
      <nav class="ra-sidebar" id="ra-sidebar" aria-label="Analyses"></nav>

      <div class="ra-inhoud">
        <div id="ra-fout" class="ra-fout" style="display:none;"></div>

        <p class="ra-muted" id="ra-intro" style="margin:0;font-size:13px;"></p>
        <div class="ra-tabs" role="tablist" id="ra-tabs"></div>
        <div class="ra-toolbar">
          <label>Year <select id="ra-year"></select></label>
          <label>Batch size <select id="ra-size">
            <option value="">All</option>
            <option value="small">1–3 brews</option>
            <option value="large">4+ brews</option>
            <option value="split">From splits (0 brews)</option>
          </select></label>
          <label><input type="checkbox" id="ra-warnings"> Include data warnings</label>
        </div>
        <div id="ra-view" class="ra-view"></div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2"></script>
  <script src="config.js"></script>
  <script src="jopen-utils.js"></script>
  <script src="nav.js"></script>
  <script src="batch-stages.js"></script>
  <script src="filling-report.js"></script>
  <script src="recipe-losses.js"></script>
  <script src="batch-ingredients.js"></script>
  <script src="brewhouse-efficiency.js"></script>
  <script>
// ============================================================================
// recipe-analytics.html — analyses per recipe. Access: module 'analytics'
// (view only). Every analysis has the same tabs (All recipes, One recipe,
// Compare, Data checks) and filters; RA_ANALYSES says how it loads its items
// and draws its views. An item has .row (recipe_id, recipe_group_id,
// batch_id, batch_number, batch_year, brew_count) and .check.
// - Losses: view batch_volume_balance, recipe-losses.js (tests/recipe-losses.test.js)
// - Brewhouse efficiency: batch_brews + batch_ingredients, brewhouse-efficiency.js
//   (tests/brewhouse-efficiency.test.js)
// ============================================================================

const RA_TABS = [
  { key: 'all', label: 'All recipes' },
  { key: 'one', label: 'One recipe' },
  { key: 'compare', label: 'Compare' },
  { key: 'checks', label: 'Data checks' },
];

const RA_COMPARE_COLORS = ['#E0001D', '#2f5d8a', '#4c6b4f', '#b4772c', '#6d4c8c', '#1c8a8a'];

const ra = {
  analysis: 'losses',
  items: {},         // per analysis key: its items, once loaded
  recipes: [],
  tab: 'all', recipe: null, compare: [], year: null, size: '', warnings: false,
  sort: ['count', -1], search: '', check: '',
  user: null, canEditBatches: false, accepting: null,   // accepting: id of the brew whose "Mark as good" form is open
};

const pct = (x) => (x === null || x === undefined || !Number.isFinite(x) ? '—' : (100 * x).toFixed(1) + '%');
const hl1 = (x) => (x === null || x === undefined || !Number.isFinite(x) ? '—' : x.toFixed(1));
const hl0 = (x) => (x === null || x === undefined || !Number.isFinite(x) ? '—' : Math.round(x).toLocaleString('en'));
const tabLabel = (key) => (BATCH_TABS.find((t) => t.key === key) || {}).label || '';
const batchLink = (item, tab) => `<a href="${batchTabHref(tab, item.row.batch_id)}">${escapeHtml(item.row.batch_number)}</a>`;
const recipeName = (item) => { const r = ra.recipes.find((x) => x.id === item.row.recipe_id); return r ? r.name : ''; };
const versionOf = (item) => { const r = ra.recipes.find((x) => x.id === item.row.recipe_id); return r ? `v${r.version_major}.${r.version_minor}` : ''; };

// --------------------------------------------------------------- filters
const A = () => RA_ANALYSES.find((a) => a.key === ra.analysis);
const allItems = () => ra.items[ra.analysis] || [];
function sizeMatches(item) {
  const n = Number(item.row.brew_count) || 0;
  if (ra.size === 'small') return n >= 1 && n <= 3;
  if (ra.size === 'large') return n >= 4;
  if (ra.size === 'split') return n === 0;
  return true;
}
const inYear = (item) => !ra.year || Number(item.row.batch_year) === ra.year;
const filtered = () => allItems().filter((i) => inYear(i) && sizeMatches(i));
const recipeGroups = () => groupByRecipe(filtered(), ra.recipes).map((g) => ({ ...g, pooled: A().pool(g.items) }));
const groupById = (id) => recipeGroups().find((g) => g.groupId === id);
const checkCell = (item) => {
  const c = A().checks[item.check];
  if (item.check === 'ok') return '<span class="ra-ok">OK</span>';
  if (!c.warning) return `<span class="ra-ok" title="${escapeHtml(item.acceptedReason || c.hint || '')}">${escapeHtml(c.label)}</span>`;
  return `<span class="ra-flag" title="${escapeHtml(c.hint || '')}">${escapeHtml(c.label)}</span>`;
};

function kpiRow(tiles) {
  return `<div class="ra-kpis">${tiles.map(([label, value, unit]) =>
    `<div class="ra-kpi"><div class="l">${escapeHtml(label)}</div><div class="v">${value}${unit ? `<small>${unit}</small>` : ''}</div></div>`).join('')}</div>`;
}

// --------------------------------------------------------------- shared views
function viewAll() {
  const a = A();
  const groups = recipeGroups().filter((g) => g.pooled.count > 0);
  const [key, dir] = ra.sort;
  const val = (g) => (key === 'name' ? g.name : g.pooled[key]);
  groups.sort((x, y) => (key === 'name' ? x.name.localeCompare(y.name) : (val(x) ?? -1) - (val(y) ?? -1)) * dir || x.name.localeCompare(y.name));
  const q = ra.search.trim().toLowerCase();
  const th = (k, label, cls = '') => `<th class="sort ${cls}" data-sort="${k}" aria-sort="${ra.sort[0] === k ? (ra.sort[1] > 0 ? 'ascending' : 'descending') : 'none'}">${label}${ra.sort[0] === k ? (ra.sort[1] > 0 ? ' ▲' : ' ▼') : ''}</th>`;
  return `${a.kpis(a.pool(filtered()), true)}
  <section class="ra-card">
    <h2>${escapeHtml(a.label)} per recipe</h2>
    <p class="ra-note">Click a recipe to open it, or tick two or more to compare them. All versions of a recipe count together; splits are recipes of their own.</p>
    <div class="ra-toolbar" style="border:0;padding:0 0 10px;">
      <input type="search" id="ra-search" placeholder="Search recipe" aria-label="Search recipe" value="${escapeHtml(ra.search)}">
      <span class="ra-chips">${ra.compare.length
        ? ra.compare.map((id) => `<span class="ra-chip actief">${escapeHtml((groupById(id) || {}).name || '?')}</span>`).join('') + (ra.compare.length > 1 ? `<button type="button" class="ra-chip" id="ra-go-compare">Compare ${ra.compare.length} →</button>` : '')
        : '<span class="ra-muted">Tick recipes to compare them</span>'}</span>
    </div>
    <div class="ra-tw"><table class="ra-table">
      <thead><tr><th class="t"></th>${th('name', 'Recipe', 't')}${a.columns.map((c) => th(c.key, c.label)).join('')}</tr></thead>
      <tbody>${groups.filter((g) => !q || g.name.toLowerCase().includes(q)).map((g) => `<tr>
        <td class="t"><input type="checkbox" data-compare="${escapeHtml(g.groupId)}" ${ra.compare.includes(g.groupId) ? 'checked' : ''} aria-label="Compare ${escapeHtml(g.name)}"></td>
        <td class="t"><button type="button" class="ra-link" data-open="${escapeHtml(g.groupId)}">${escapeHtml(g.name)}</button></td>
        ${a.columns.map((c) => `<td>${c.cell(g, groups)}</td>`).join('')}</tr>`).join('')}</tbody>
    </table></div>
    ${a.legend ? a.legend() : ''}
  </section>`;
}

function recipePicker(id, selected, placeholder) {
  const groups = groupByRecipe(allItems().filter(inYear), ra.recipes).sort((x, y) => x.name.localeCompare(y.name));
  return `<select id="${id}" aria-label="${escapeHtml(placeholder)}"><option value="">${escapeHtml(placeholder)}</option>${groups.map((g) =>
    `<option value="${escapeHtml(g.groupId)}" ${g.groupId === selected ? 'selected' : ''}>${escapeHtml(g.name)} (${g.items.length})</option>`).join('')}</select>`;
}

function viewOne() {
  const g = ra.recipe && groupById(ra.recipe);
  const head = `<div class="ra-toolbar"><label>Recipe ${recipePicker('ra-pick-one', ra.recipe, 'Choose a recipe')}</label>
    ${g ? `<span class="ra-chips">Versions: ${g.versions.map((v) => `<span class="ra-chip actief">v${escapeHtml(v)}</span>`).join('')}</span>
    <button type="button" class="ra-chip" id="ra-add-compare">+ Compare with…</button>` : ''}</div>`;
  if (!g) return head + `<div class="ra-card ra-empty">Choose a recipe to see its ${escapeHtml(A().label.toLowerCase())}.</div>`;
  return head + A().one(g);
}

function viewCompare() {
  const groups = ra.compare.map(groupById).filter(Boolean);
  const head = `<div class="ra-toolbar"><span class="ra-chips">${groups.map((g, i) => `<button type="button" class="ra-chip" data-remove="${escapeHtml(g.groupId)}" title="Remove"><span class="ra-dot" style="background:${RA_COMPARE_COLORS[i % RA_COMPARE_COLORS.length]}"></span>${escapeHtml(g.name)} ×</button>`).join('')}</span>
    <label>${recipePicker('ra-pick-compare', '', '+ Add recipe')}</label></div>`;
  if (groups.length < 2) return head + '<div class="ra-card ra-empty">Add at least two recipes to compare. You can also tick them in the All recipes list.</div>';
  return head + A().compare(groups);
}

function viewChecks() {
  const a = A();
  const inScope = allItems().filter(inYear);
  const warnings = inScope.filter((i) => a.checks[i.check].warning);
  const codes = Object.keys(a.checks).filter((k) => a.checks[k].warning);
  if (ra.check && !codes.includes(ra.check)) ra.check = '';
  const shown = warnings.filter((i) => !ra.check || i.check === ra.check)
    .sort((x, y) => codes.indexOf(x.check) - codes.indexOf(y.check) || String(x.row.batch_number).localeCompare(String(y.row.batch_number)) || (x.brewNumber || 0) - (y.brewNumber || 0));
  return `<section class="ra-card"><h2>Data checks</h2>
    <p class="ra-note">${escapeHtml(a.checksIntro)} Fix the data on the batch tab the link opens; it drops off this list by itself. ${a.checksExtra ? a.checksExtra(inScope) : ''}</p>
    <div class="ra-chips" style="margin-bottom:10px">
      <button type="button" class="ra-chip${ra.check ? '' : ' actief'}" data-check="">All warnings (${warnings.length})</button>
      ${codes.map((c) => { const n = warnings.filter((i) => i.check === c).length; return n ? `<button type="button" class="ra-chip${ra.check === c ? ' actief' : ''}" data-check="${c}">${escapeHtml(a.checks[c].label)} (${n})</button>` : ''; }).join('')}
    </div>
    ${ra.check ? `<p class="ra-note"><b>${escapeHtml(a.checks[ra.check].label)}:</b> ${escapeHtml(a.checks[ra.check].hint)}</p>` : '<p class="ra-note">Pick a check above to see what to look at, or hover a check label.</p>'}
    ${shown.length ? `<div class="ra-tw"><table class="ra-table"><thead><tr>${a.checkColumns.map((c) => `<th class="${c.t ? 't' : ''}">${c.label}</th>`).join('')}<th class="t">Fix on</th>${a.rowAction ? '<th class="t"></th>' : ''}</tr></thead><tbody>
      ${shown.map((i) => `<tr>${a.checkColumns.map((c) => `<td class="${c.t ? 't' : ''}">${c.cell(i)}</td>`).join('')}<td class="t">${escapeHtml(tabLabel(a.checks[i.check].tab))}</td>${a.rowAction ? `<td class="t">${a.rowAction(i)}</td>` : ''}</tr>`).join('')}
    </tbody></table></div>` : `<div class="ra-empty">${escapeHtml(a.noWarnings)}</div>`}
  </section>
  ${a.acceptedSection ? a.acceptedSection(inScope) : ''}`;
}

// --------------------------------------------------------------- charts
// Bars per item in order (Losses: per batch). parts(item) = [[share, colour], …], stacked.
function drawBars(boxId, items, parts, opts) {
  const box = document.getElementById(boxId);
  if (!box) return;
  if (!items.length) { box.innerHTML = '<div class="ra-empty">Nothing to show.</div>'; return; }
  const W = Math.max(320, box.clientWidth), H = 240, m = { t: 10, r: 8, b: 48, l: 40 };
  const top = Math.min(0.6, Math.max(0.2, ...items.map((i) => opts.total(i) || 0))) * 1.1;
  const y = (v) => H - m.b - Math.max(0, Math.min(top, v)) / top * (H - m.t - m.b);
  const bw = (W - m.l - m.r) / items.length, w = Math.min(28, bw * 0.7);
  const step = top > 0.3 ? 0.1 : 0.05;
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${escapeHtml(opts.label)}">`;
  for (let t = 0; t <= top + 1e-9; t += step) s += `<line x1="${m.l}" x2="${W - m.r}" y1="${y(t)}" y2="${y(t)}" stroke="#eee"/><text x="${m.l - 6}" y="${y(t) + 4}" text-anchor="end">${Math.round(t * 100)}%</text>`;
  const every = Math.ceil(items.length / Math.max(1, Math.floor((W - m.l - m.r) / 26)));
  items.forEach((item, i) => {
    const x = m.l + i * bw + (bw - w) / 2;
    let base = 0;
    parts(item).forEach(([v, colour]) => { const h = Math.max(0, v || 0); s += `<rect x="${x}" width="${w}" y="${y(base + h)}" height="${y(base) - y(base + h)}" fill="${colour}"/>`; base += h; });
    if (i % every === 0) s += `<text transform="translate(${x + w / 2},${H - m.b + 12}) rotate(-45)" text-anchor="end">${escapeHtml(opts.xLabel(item))}</text>`;
    s += `<rect x="${m.l + i * bw}" width="${bw}" y="${m.t}" height="${H - m.t - m.b}" fill="transparent" data-i="${i}"/>`;
  });
  if (opts.average !== null) s += `<line x1="${m.l}" x2="${W - m.r}" y1="${y(opts.average)}" y2="${y(opts.average)}" stroke="#555" stroke-dasharray="4 3"/>`;
  box.innerHTML = s + '</svg><div class="ra-tip" style="display:none"></div>';
  attachTips(box, 'rect[data-i]', items, opts.tip);
}

// Dots per item in order on a lo–hi scale (Brewhouse efficiency: per brew), with reference lines.
function drawDots(boxId, items, opts) {
  const box = document.getElementById(boxId);
  if (!box) return;
  if (!items.length) { box.innerHTML = '<div class="ra-empty">Nothing to show.</div>'; return; }
  const W = Math.max(320, box.clientWidth), H = 240, m = { t: 10, r: 8, b: 48, l: 40 };
  const vals = items.map(opts.value).filter((v) => v !== null);
  const lo = Math.min(opts.lo, ...vals), hi = Math.max(opts.hi, ...vals);
  const y = (v) => H - m.b - (v - lo) / (hi - lo) * (H - m.t - m.b);
  const bw = (W - m.l - m.r) / items.length;
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${escapeHtml(opts.label)}">`;
  for (let t = Math.ceil(lo * 20) / 20; t <= hi + 1e-9; t += 0.05) s += `<line x1="${m.l}" x2="${W - m.r}" y1="${y(t)}" y2="${y(t)}" stroke="#eee"/><text x="${m.l - 6}" y="${y(t) + 4}" text-anchor="end">${Math.round(t * 100)}%</text>`;
  (opts.lines || []).forEach(([v, colour]) => { if (v !== null) s += `<line x1="${m.l}" x2="${W - m.r}" y1="${y(v)}" y2="${y(v)}" stroke="${colour}" stroke-dasharray="4 3"/>`; });
  let lastBatch = null;
  const labelEvery = Math.ceil(items.length / Math.max(1, Math.floor((W - m.l - m.r) / 26)));
  let shown = 0;
  items.forEach((item, i) => {
    const cx = m.l + i * bw + bw / 2, v = opts.value(item);
    if (item.row.batch_number !== lastBatch) {
      if (i > 0) s += `<line x1="${m.l + i * bw}" x2="${m.l + i * bw}" y1="${m.t}" y2="${H - m.b}" stroke="#f3efe8"/>`;
      if (shown++ % labelEvery === 0) s += `<text transform="translate(${cx},${H - m.b + 12}) rotate(-45)" text-anchor="end">${escapeHtml(item.row.batch_number)}</text>`;
      lastBatch = item.row.batch_number;
    }
    if (v !== null) s += `<circle cx="${cx}" cy="${y(Math.max(lo, Math.min(hi, v)))}" r="${Math.min(5, Math.max(3, bw / 3))}" fill="${opts.colour(item)}"/>`;
    s += `<rect x="${m.l + i * bw}" width="${bw}" y="${m.t}" height="${H - m.t - m.b}" fill="transparent" data-i="${i}"/>`;
  });
  box.innerHTML = s + '</svg><div class="ra-tip" style="display:none"></div>';
  attachTips(box, 'rect[data-i]', items, opts.tip);
}

function attachTips(box, selector, items, tipHtml) {
  const tip = box.querySelector('.ra-tip');
  box.querySelectorAll(selector).forEach((el) => {
    el.addEventListener('mousemove', (ev) => {
      tip.innerHTML = tipHtml(items[Number(el.dataset.i)]);
      tip.style.display = 'block';
      const rc = box.getBoundingClientRect();
      tip.style.left = Math.max(0, Math.min(rc.width - tip.offsetWidth, ev.clientX - rc.left + 12)) + 'px';
      tip.style.top = Math.max(0, ev.clientY - rc.top - 54) + 'px';
    });
    el.addEventListener('mouseleave', () => { tip.style.display = 'none'; });
  });
}

// One row per recipe, one dot per counted item, a tick at the recipe's pooled value.
function drawCompareDots(boxId, groups, opts) {
  const box = document.getElementById(boxId);
  if (!box) return;
  const W = Math.max(320, box.clientWidth), rowH = 34, m = { l: Math.min(200, W * 0.35), r: 16, t: 6, b: 22 };
  const H = groups.length * rowH + m.t + m.b;
  const vals = groups.flatMap((g) => g.items.filter(opts.counted).map(opts.value)).filter((v) => v !== null);
  const lo = Math.min(opts.lo, ...vals), hi = Math.max(opts.hi, ...vals);
  const x = (v) => m.l + (Math.max(lo, Math.min(hi, v)) - lo) / (hi - lo) * (W - m.l - m.r);
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${escapeHtml(opts.label)}">`;
  for (let t = Math.ceil(lo * 20) / 20; t <= hi + 1e-9; t += 0.05) s += `<line x1="${x(t)}" x2="${x(t)}" y1="${m.t}" y2="${H - m.b}" stroke="#eee"/><text x="${x(t)}" y="${H - 6}" text-anchor="middle">${Math.round(t * 100)}%</text>`;
  groups.forEach((g, i) => {
    const cy = m.t + i * rowH + rowH / 2, col = RA_COMPARE_COLORS[i % RA_COMPARE_COLORS.length];
    const name = g.name.length > 28 ? g.name.slice(0, 27) + '…' : g.name;
    s += `<text x="${m.l - 8}" y="${cy + 4}" text-anchor="end" style="fill:#1f1f1f">${escapeHtml(name)}</text>`;
    g.items.filter(opts.counted).forEach((item) => { const v = opts.value(item); if (v !== null) s += `<circle cx="${x(v)}" cy="${cy}" r="5" fill="${col}" fill-opacity=".55" stroke="${col}"><title>${escapeHtml(opts.title(item))}</title></circle>`; });
    const p = opts.pooled(g);
    if (p !== null) s += `<line x1="${x(p)}" x2="${x(p)}" y1="${cy - 11}" y2="${cy + 11}" stroke="#1f1f1f" stroke-width="2"/>`;
  });
  box.innerHTML = s + '</svg>';
}

function stackBar(cel, fil, max, wide) {
  const w = (v) => Math.max(0, (v || 0) / max * 100);
  return `<span class="ra-bar${wide ? ' wide' : ''}"><b style="width:${w(cel)}%;background:var(--ra-cellar)"></b><b style="width:${w(fil)}%;background:var(--ra-filling)"></b></span>`;
}
// Bar from lo to hi (efficiency): the value's position on that range.
function rangeBar(v, lo, hi, wide) {
  const w = v === null ? 0 : Math.max(0, Math.min(1, (v - lo) / (hi - lo))) * 100;
  return `<span class="ra-bar${wide ? ' wide' : ''}"><b style="width:${w}%;background:var(--ra-cellar)"></b></span>`;
}

  },
  acceptedSection(inScope) {
    const list = inScope.filter((e) => e.check === 'accepted');
    return `<section class="ra-card"><h2>Marked as good (${list.length})</h2>
      <p class="ra-note">Brews outside 70–100% that were checked and are right. They count in the efficiency.</p>
      ${list.length ? `<div class="ra-tw"><table class="ra-table"><thead><tr><th class="t">Batch</th><th>Brew</th><th class="t">Recipe</th><th>Efficiency</th><th class="t">Reason</th><th class="t">By</th><th class="t">On</th>${ra.canEditBatches ? '<th class="t"></th>' : ''}</tr></thead><tbody>
        ${list.map((e) => `<tr><td class="t">${batchLink(e, 'brewing')}</td><td>${e.brewNumber}</td><td class="t">${escapeHtml(recipeName(e))}</td><td>${pct(e.efficiency)}</td>
          <td class="t">${escapeHtml(e.acceptedReason || '')}</td><td class="t">${escapeHtml(e.acceptedBy || '')}</td><td class="t">${escapeHtml(formatDate(e.acceptedAt))}</td>
          ${ra.canEditBatches ? `<td class="t"><button type="button" class="ra-chip" data-unaccept="${e.brewId}">Undo</button></td>` : ''}</tr>`).join('')}
      </tbody></table></div>` : '<div class="ra-empty">None yet.</div>'}
    </section>`;
  },
  async setAccepted(e, reason) {
    const patch = reason
      ? { efficiency_accepted_at: new Date().toISOString(), efficiency_accepted_by: ra.user.id, efficiency_accepted_reason: reason, updated_by: ra.user.id }
      : { efficiency_accepted_at: null, efficiency_accepted_by: null, efficiency_accepted_reason: null, updated_by: ra.user.id };
    const { error } = await supabaseClient.from('batch_brews').update(patch).eq('id', e.brewId);
    if (error) { showError('Could not save: ' + (error.message || error)); return; }
    showError('');
    Object.assign(e.brew, patch);
    Object.assign(e, brewEfficiency(e.brew, e.fermentables), { acceptedAt: patch.efficiency_accepted_at, acceptedReason: patch.efficiency_accepted_reason, acceptedBy: reason ? ra.user.name : null });
  },
  checkColumns: [
    { label: 'Batch', t: true, cell: (e) => batchLink(e, EFFICIENCY_CHECKS[e.check].tab) },
    { label: 'Brew', cell: (e) => e.brewNumber },
    { label: 'Recipe', t: true, cell: (e) => escapeHtml(recipeName(e)) },
    { label: 'Check', t: true, cell: (e) => checkCell(e) },
    { label: 'Detail', t: true, cell: (e) => escapeHtml(
      e.check === 'malt_without_extract' ? [...new Set(e.fermentables.maltsWithoutExtract)].join(', ')
        : e.check === 'sugar_without_weight' ? [...new Set(e.fermentables.sugarsNotWeighed)].join(', ')
          : e.check === 'out_of_range' ? `${pct(e.efficiency)} · ${hl0(e.maltKg)} kg malt for ${hl1(Number(e.volumeHl))} hl at ${Number(e.plato).toFixed(1)} °P`
            : e.check === 'no_brew_data' ? `Volume ${e.volumeHl ?? '—'} hl · °P ${e.plato ?? '—'}` : '') },
  ],
};

// Sidebar, grouped. A new analysis: an object like LOSSES above, added here.
const RA_ANALYSES = [LOSSES, EFFICIENCY];

// --------------------------------------------------------------- render
function renderTabs() {
  const a = A();
  const warnings = allItems().filter((i) => inYear(i) && a.checks[i.check].warning).length;
  document.getElementById('ra-tabs').innerHTML = RA_TABS.map((t) =>
    `<button type="button" role="tab" class="ra-tab${ra.tab === t.key ? ' actief' : ''}" aria-selected="${ra.tab === t.key}" data-tab="${t.key}">${escapeHtml(t.label)}${t.key === 'checks' && warnings ? ` <span class="ra-count">(${warnings})</span>` : ''}</button>`).join('');
  document.querySelectorAll('#ra-tabs .ra-tab').forEach((b) => b.addEventListener('click', () => { ra.tab = b.dataset.tab; render(); }));
}

function render() {
  const a = A();
  document.getElementById('ra-intro').textContent = a.intro;
  document.querySelectorAll('#ra-sidebar button').forEach((b) => b.classList.toggle('actief', b.dataset.id === a.key));
  renderTabs();
  const view = document.getElementById('ra-view');
  if (!ra.items[a.key]) { view.innerHTML = '<div class="ra-card ra-empty">Loading…</div>'; return; }
  view.innerHTML = ra.tab === 'all' ? viewAll() : ra.tab === 'one' ? viewOne() : ra.tab === 'compare' ? viewCompare() : viewChecks();
  if (ra.tab === 'one') { const g = ra.recipe && groupById(ra.recipe); if (g) a.drawOne(g); }
  if (ra.tab === 'compare') { const gs = ra.compare.map(groupById).filter(Boolean); if (gs.length > 1) a.drawCompare(gs); }
  const params = new URLSearchParams();
  params.set('analysis', a.key);
  params.set('tab', ra.tab);
  if (ra.tab === 'one' && ra.recipe) params.set('recipe', ra.recipe);
  if (ra.tab === 'compare' && ra.compare.length) params.set('compare', ra.compare.join(','));
  history.replaceState(null, '', '?' + params.toString());

  view.querySelectorAll('th[data-sort]').forEach((th) => th.addEventListener('click', () => {
    const k = th.dataset.sort;
    ra.sort = [k, ra.sort[0] === k ? -ra.sort[1] : (k === 'name' ? 1 : -1)];
    render();
  }));
  view.querySelectorAll('[data-open]').forEach((b) => b.addEventListener('click', () => { ra.recipe = b.dataset.open; ra.tab = 'one'; render(); }));
  view.querySelectorAll('[data-compare]').forEach((c) => c.addEventListener('change', () => {
    const id = c.dataset.compare;
    ra.compare = c.checked ? [...new Set([...ra.compare, id])] : ra.compare.filter((x) => x !== id);
    render();
  }));
  view.querySelectorAll('[data-remove]').forEach((b) => b.addEventListener('click', () => { ra.compare = ra.compare.filter((x) => x !== b.dataset.remove); render(); }));
  view.querySelectorAll('[data-check]').forEach((b) => b.addEventListener('click', () => { ra.check = b.dataset.check; render(); }));
  const itemByBrew = (id) => allItems().find((i) => String(i.brewId) === String(id));
  view.querySelectorAll('[data-accept]').forEach((b) => b.addEventListener('click', () => {
    ra.accepting = Number(b.dataset.accept);
    render();
    const input = document.getElementById('ra-accept-reason');
    if (input) input.focus();
  }));
  view.querySelectorAll('[data-accept-cancel]').forEach((b) => b.addEventListener('click', () => { ra.accepting = null; render(); }));
  view.querySelectorAll('[data-accept-save]').forEach((b) => b.addEventListener('click', async () => {
    const input = document.getElementById('ra-accept-reason');
    const reason = input ? input.value.trim() : '';
    if (!reason) { input.focus(); input.style.borderColor = 'var(--ra-warn)'; return; }
    b.disabled = true;
    await A().setAccepted(itemByBrew(b.dataset.acceptSave), reason);
    ra.accepting = null;
    render();
  }));
  view.querySelectorAll('[data-unaccept]').forEach((b) => b.addEventListener('click', async () => {
    b.disabled = true;
    await A().setAccepted(itemByBrew(b.dataset.unaccept), null);
    render();
  }));
  const reasonInput = view.querySelector('#ra-accept-reason');
  if (reasonInput) reasonInput.addEventListener('keydown', (ev) => {
    if (ev.key === 'Enter') view.querySelector('[data-accept-save]').click();
    if (ev.key === 'Escape') view.querySelector('[data-accept-cancel]').click();
  });
  const search = view.querySelector('#ra-search');
  if (search) search.addEventListener('input', () => {
    ra.search = search.value;
    const pos = search.selectionStart;
    render();
    const again = document.getElementById('ra-search');
    again.focus();
    again.setSelectionRange(pos, pos);
  });
  const go = view.querySelector('#ra-go-compare');
  if (go) go.addEventListener('click', () => { ra.tab = 'compare'; render(); });
  const pickOne = view.querySelector('#ra-pick-one');
  if (pickOne) pickOne.addEventListener('change', () => { ra.recipe = pickOne.value || null; render(); });
  const addCompare = view.querySelector('#ra-add-compare');
  if (addCompare) addCompare.addEventListener('click', () => { ra.compare = [...new Set([ra.recipe, ...ra.compare])]; ra.tab = 'compare'; render(); });
  const pickCompare = view.querySelector('#ra-pick-compare');
  if (pickCompare) pickCompare.addEventListener('change', () => { if (pickCompare.value) { ra.compare = [...new Set([...ra.compare, pickCompare.value])]; render(); } });
}

function showError(text) {
  const err = document.getElementById('ra-fout');
  err.textContent = text;
  err.style.display = text ? 'block' : 'none';
}

// Load an analysis once, then fill the year list from all loaded items.
async function openAnalysis(key) {
  ra.analysis = key;
  if (ra.sort[0] !== 'name' && ra.sort[0] !== 'count') ra.sort = ['count', -1];
  render();
  const a = A();
  if (ra.items[key]) return;
  try {
    ra.items[key] = await a.load();
    showError('');
  } catch (e) {
    ra.items[key] = [];
    showError(`Could not load ${a.label.toLowerCase()}: ${e.message || e}`);
  }
  const years = [...new Set(Object.values(ra.items).flat().map((i) => Number(i.row.batch_year)).filter(Boolean))].sort((x, y) => y - x);
  if (!ra.year || !years.includes(ra.year)) ra.year = years[0] || null;
  document.getElementById('ra-year').innerHTML = years.map((y) => `<option value="${y}" ${y === ra.year ? 'selected' : ''}>${y}</option>`).join('') || '<option value="">—</option>';
  if (!ra.compare.length) ra.compare = recipeGroups().filter((g) => g.pooled.count > 0).sort((x, y) => y.pooled.count - x.pooled.count).slice(0, 3).map((g) => g.groupId);
  if (!ra.recipe) ra.recipe = ra.compare[0] || null;
  if (ra.analysis === key) render();
}

function renderSidebar() {
  const groups = [...new Set(RA_ANALYSES.map((a) => a.group))];
  const sidebar = document.getElementById('ra-sidebar');
  sidebar.innerHTML = groups.map((g) => `<h3>${escapeHtml(g)}</h3>` + RA_ANALYSES.filter((a) => a.group === g).map((a) =>
    `<button type="button" data-id="${a.key}">${escapeHtml(a.label)}</button>`).join('')).join('');
  sidebar.querySelectorAll('button').forEach((btn) => btn.addEventListener('click', () => openAnalysis(btn.dataset.id)));
}

async function initRecipeAnalytics() {
  const user = await getCurrentUser();
  if (!user) return;   // nav.js redirects to login
  const access = document.getElementById('ra-toegang');
  if (!(await magBekijkenModule('analytics'))) {
    access.textContent = 'Access denied — you do not have permission to view Analytics. Redirecting…';
    setTimeout(() => { window.location.href = 'index.html'; }, 1500);
    return;
  }
  access.textContent = 'Loading…';
  ra.user = user;
  ra.canEditBatches = await magBewerkenModule('batches');
  renderSidebar();
  const recipes = await fetchAllRows(supabaseClient.from('recipes').select('id, name, version_major, version_minor, recipe_group_id, brew_volume_hl').order('id'));
  if (recipes.error) showError('Could not load the recipes: ' + (recipes.error.message || recipes.error));
  ra.recipes = recipes.data || [];

  const params = new URLSearchParams(window.location.search);
  const start = RA_ANALYSES.some((a) => a.key === params.get('analysis')) ? params.get('analysis') : 'losses';
  if (RA_TABS.some((t) => t.key === params.get('tab'))) ra.tab = params.get('tab');
  if (params.get('recipe')) ra.recipe = params.get('recipe');
  if (params.get('compare')) ra.compare = params.get('compare').split(',').filter(Boolean);

  document.getElementById('ra-year').addEventListener('change', (e) => { ra.year = Number(e.target.value) || null; render(); });
  document.getElementById('ra-size').addEventListener('change', (e) => { ra.size = e.target.value; render(); });
  document.getElementById('ra-warnings').addEventListener('change', (e) => { ra.warnings = e.target.checked; render(); });
  let resizeTimer;
  window.addEventListener('resize', () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(render, 150); });

  access.style.display = 'none';
  document.getElementById('ra-content').style.display = '';
  await openAnalysis(start);
}

document.addEventListener('DOMContentLoaded', initRecipeAnalytics);
  </script>
