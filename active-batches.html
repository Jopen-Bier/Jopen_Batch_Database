<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jopen Brouwerij — Active batches</title>
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="stylesheet" href="jopen-shared.css" />
  <link rel="stylesheet" href="batch-report.css" />
</head>
<body class="br-page">

  <div id="jopen-nav"></div>

  <main class="br-main">
    <div class="br-head">
      <div style="display:flex; flex-direction:column; gap:6px;">
        <div class="br-crumb"><a href="index.html">Home</a> › Batch reports</div>
        <div class="br-title">
          <h1>Active batches</h1>
          <span id="ac-total"></span>
        </div>
        <div class="br-summary" id="ac-summary"></div>
      </div>
      <div class="br-toolbar" id="ac-toolbar" style="display:none;">
        <input class="br-search" type="search" id="ac-search" placeholder="Search beer, batch or tank" aria-label="Search beer, batch or tank">
        <button class="br-attention-btn" type="button" id="ac-attention"><span style="font-weight:800;">!</span> <span id="ac-attention-text">Needs attention · 0</span></button>
        <div class="br-seg" id="ac-location" role="group" aria-label="Brewhouse">
          <button type="button" class="on" data-location="">All</button>
          <button type="button" data-location="wp">WP</button>
          <button type="button" data-location="jk">JK</button>
        </div>
      </div>
    </div>

    <div id="ac-sections" style="display:flex; flex-direction:column; gap:14px;"></div>
    <div class="br-message" id="ac-message">Loading batches…</div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2"></script>
  <script src="config.js"></script>
  <script src="jopen-utils.js"></script>
  <script src="nav.js"></script>
  <script src="batch-stages.js"></script>
  <script src="batch-report-shell.js"></script>
  <script>
    let allRows = [];
    const view = { q: '', location: '', attentionOnly: false };

    function showMessage(text, isError) {
      const el = document.getElementById('ac-message');
      el.textContent = text;
      el.className = 'br-message' + (isError ? ' error' : '');
      el.style.display = text ? '' : 'none';
    }

    async function loadActiveBatches() {
      const stages = await fetchAllRows(supabaseClient.from('batch_stages')
        .select('batch_id, stage, start_date, end_date, brews_planned, brews_started, brews_ended, last_brew_ended_at, time_zero, cellar_steps_total, cellar_steps_done, next_cellar_step, hbts_total, hbts_released, hbt_codes, hbt_formats, hbts_finished, filled_volume_hl, documents_uploaded, other_documents, emptied_at, filling_report_checked_at, mdrank_processed_at')
        .neq('stage', 'closed')
        .order('batch_id'));
      if (stages.error) throw stages.error;
      if (!stages.data.length) return [];
      const ids = stages.data.map((s) => s.batch_id);
      const batches = await fetchAllRows(supabaseClient.from('batches')
        .select('id, batch_number, name, brew_count, order_picking_date, order_picking_completed_at, glt_tank:tanks!batches_glt_tank_id_fkey(code), lt_tank:tanks!batches_lt_tank_id_fkey(code), recipes(name, version_major, version_minor, location)')
        .in('id', ids)
        .order('id'));
      if (batches.error) throw batches.error;
      const stageById = new Map(stages.data.map((s) => [s.batch_id, s]));
      return batches.data.map((b) => toBatchRow(b, stageById.get(b.id)));
    }

    function tileHtml(row) {
      const lines = tileLines(row);
      const issue = row.attention[0] || '';
      const cls = 'br-tile' + (issue ? ' warn' : lines.isOk ? ' ok' : '');
      const title = `${row.batchNumber} · ${row.name}${issue ? ' · ' + issue : ''}`;
      // Each stage links to its own tab once that tab exists, else to the Overview.
      const href = batchHref(row.stage, row.id);
      return `<a class="${cls}" href="${href}" title="${escapeHtml(title)}">
        ${issue ? '<span class="br-bang" aria-label="Needs attention">!</span>' : ''}
        <div class="br-tile-top">
          ${row.tankCode ? `<span class="br-tank">${escapeHtml(row.tankCode)}</span>` : ''}
          <span class="br-tile-no">${escapeHtml(row.batchNumber)}</span>
          ${row.location === 'jk' ? '<span class="br-jk">JK</span>' : ''}
        </div>
        <div class="br-tile-name">${escapeHtml(row.name)}</div>
        <div class="br-tile-line">${escapeHtml(lines.line1)}</div>
        <div class="br-tile-line${lines.isOk ? ' ok' : ''}">${escapeHtml(lines.line2)}</div>
        ${lines.line3 ? `<div class="br-tile-line${lines.line3Ok ? ' ok' : ''}">${escapeHtml(lines.line3)}</div>` : ''}
        ${lines.progress !== null ? `<div class="br-tile-bar"><div style="width:${Math.round(lines.progress * 100)}%;"></div></div>` : ''}
        ${issue ? `<div class="br-tile-line alert">${escapeHtml(issue)}</div>` : ''}
      </a>`;
    }

    function render() {
      const result = groupActiveBatches(allRows, view);
      document.getElementById('ac-total').textContent = `${result.total} in progress`;
      document.getElementById('ac-summary').innerHTML = result.summary
        .map((s) => `<span>${escapeHtml(s.label)}<b>${s.count}</b></span>`).join('');
      document.getElementById('ac-attention-text').textContent = `Needs attention · ${result.attentionTotal}`;
      document.getElementById('ac-attention').classList.toggle('on', view.attentionOnly);

      document.getElementById('ac-sections').innerHTML = result.sections.map((sec) => {
        const groupsHtml = sec.groups.map((g) => `
          ${g.label ? `<div class="br-group-label">${escapeHtml(g.label)} · ${g.items.length}</div>` : ''}
          ${g.items.length
            ? `<div class="br-tiles">${g.items.map(tileHtml).join('')}</div>`
            : '<div class="br-empty">Nothing here with the current filter.</div>'}`).join('');
        return `<section class="br-section">
          <div class="br-section-head">
            <h2>${escapeHtml(sec.title)}</h2>
            <span class="br-count">${sec.count}</span>
            ${sec.attentionCount ? `<span class="br-alert-count">! ${sec.attentionCount}</span>` : ''}
            <span class="br-rule">${escapeHtml(sec.rule)}</span>
          </div>
          ${groupsHtml}
        </section>`;
      }).join('');
    }

    function bindControls() {
      document.getElementById('ac-search').addEventListener('input', (e) => { view.q = e.target.value; render(); });
      document.getElementById('ac-attention').addEventListener('click', () => { view.attentionOnly = !view.attentionOnly; render(); });
      document.getElementById('ac-location').addEventListener('click', (e) => {
        const btn = e.target.closest('button[data-location]');
        if (!btn) return;
        view.location = btn.dataset.location;
        document.querySelectorAll('#ac-location button').forEach((b) => b.classList.toggle('on', b === btn));
        render();
      });
    }

    async function initActiveBatchesPage() {
      const user = await getCurrentUser();
      if (!user) return; // nav.js redirects to login
      if (!(await magBekijkenModule('batches'))) {
        showMessage('You do not have access to batch reports. Ask an admin for view rights on "Batches & batch reports".');
        return;
      }
      try {
        allRows = await loadActiveBatches();
      } catch (err) {
        showMessage('Could not load batches: ' + (err.message || err), true);
        return;
      }
      showMessage('');
      document.getElementById('ac-toolbar').style.display = '';
      bindControls();
      render();
    }

    document.addEventListener('DOMContentLoaded', initActiveBatchesPage);
  </script>
</body>
</html>
