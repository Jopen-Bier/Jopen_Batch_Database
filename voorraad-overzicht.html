<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jopen — Stock overview</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="jopen-shared.css">
<style>
  /* Zelfde visuele taal als receptoverzicht.html/ingredienten.html, bewust los van
     jopen-shared.css (en van het rode thema dat Book in material/Book out material/Accounting
     sign-off nog gebruiken) -- zie sessie-overleg: dit wordt de stijl waar Inventory
     op termijn naartoe groeit, te beginnen bij deze pagina. */
  :root {
    --ink: #1c2b26;
    --paper: #f6f4ee;
    --line: #d8d2c4;
    --hop: #4c6b4f;
    --hop-dark: #33473a;
    --amber: #b4772c;
    --mono: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, Helvetica, sans-serif;
    --serif: Arial, Helvetica, sans-serif;
  }
  .vo-main { font-family: var(--serif); color: var(--ink); background: var(--paper); padding: 24px 32px 60px; }
  .vo-titel { font-size: 32px; margin: 0 0 4px; }
  .vo-meta { font-family: var(--mono); font-size: 13px; color: #6b6355; margin-bottom: 24px; }
  .vo-huidige-week {
    background: var(--hop-dark); color: #fff; border-radius: 6px; padding: 10px 20px; text-align: center;
    font-family: var(--mono); display: inline-block; margin-bottom: 8px;
  }
  .vo-huidige-week-label { font-size: 10px; text-transform: uppercase; letter-spacing: 0.08em; opacity: 0.75; }
  .vo-huidige-week-waarde { font-size: 22px; font-weight: 700; letter-spacing: 0.02em; }

  .vo-bewerk-btn {
    background: var(--amber); color: #fff; border: none; padding: 10px 20px;
    border-radius: 20px; font-family: var(--mono); font-size: 12px; font-weight: 700; letter-spacing: 0.06em;
    cursor: pointer; text-decoration: none; display: inline-block;
  }
  .vo-bewerk-btn:hover { background: #96601f; }

  .vo-toolbar { display: flex; gap: 12px; align-items: center; margin-bottom: 18px; flex-wrap: wrap; }
  .vo-toolbar input {
    padding: 10px 14px; border: 1px solid var(--line); border-radius: 4px;
    font-family: var(--serif); font-size: 15px; background: #fff;
  }
  #vo-zoek { flex: 1; min-width: 220px; }
  .vo-toggle { font-family: var(--serif); font-size: 14px; display: flex; align-items: center; gap: 6px; cursor: pointer; }
  .vo-count { font-family: var(--mono); font-size: 12px; color: #7a7266; white-space: nowrap; margin-left: auto; }
  .vo-print-btn {
    padding: 9px 14px; border: 1px solid var(--line); border-radius: 4px; background: #fff; color: var(--ink);
    font-family: var(--serif); font-size: 14px; cursor: pointer;
  }
  .vo-print-btn:hover { border-color: var(--hop-dark); }

  .dd-filter { position: relative; display: inline-block; }
  .dd-filter-btn {
    position: relative; display: flex; align-items: center; gap: 6px;
    padding: 9px 14px; border: 1px solid var(--line); border-radius: 4px;
    font-family: var(--serif); font-size: 14px; background: #fff; color: var(--ink); cursor: pointer;
  }
  .dd-filter-btn:hover { border-color: var(--hop-dark); }
  .dd-filter-btn.actief-menu { border-color: var(--hop-dark); }
  .dd-filter-caret { font-size: 10px; opacity: 0.55; }
  .dd-filter-mark {
    position: absolute; top: -4px; right: -4px; width: 9px; height: 9px; border-radius: 50%;
    background: var(--amber); border: 2px solid var(--paper);
  }
  .dd-filter-panel {
    position: absolute; top: calc(100% + 6px); left: 0; z-index: 60; min-width: 200px;
    background: #fff; border: 1px solid var(--line); border-radius: 6px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.14); padding: 6px 0;
  }
  .dd-filter-panel-header {
    display: flex; justify-content: space-between; gap: 10px; padding: 2px 14px 8px;
    margin-bottom: 4px; border-bottom: 1px solid var(--line);
  }
  .dd-filter-panel-header button {
    background: none; border: none; padding: 0; cursor: pointer;
    font-family: var(--mono); font-size: 11px; color: var(--hop-dark); text-decoration: underline;
  }
  .dd-filter-option { display: flex; align-items: center; gap: 9px; padding: 7px 14px; font-size: 14px; cursor: pointer; }
  .dd-filter-option:hover { background: #f4f2ea; }
  .dd-filter-option input { cursor: pointer; }

  table.vo-tabel { width: 100%; border-collapse: collapse; background: #fff; }
  table.vo-tabel thead th {
    text-align: left; font-family: var(--mono); font-size: 11px; text-transform: uppercase;
    letter-spacing: 0.08em; color: #6b6355; padding: 10px 14px; border-bottom: 2px solid var(--hop-dark);
  }
  table.vo-tabel thead th.vo-sorteerbaar { cursor: pointer; user-select: none; white-space: nowrap; }
  table.vo-tabel thead th.vo-sorteerbaar:hover { color: var(--hop-dark); }
  table.vo-tabel tbody td { padding: 12px 14px; border-bottom: 1px solid var(--line); font-size: 15px; }
  table.vo-tabel tbody td.vo-tabel-getal { font-family: var(--mono); text-align: right; }
  table.vo-tabel tbody tr.vo-rij { cursor: pointer; }
  table.vo-tabel tbody tr.vo-rij:hover { background: #eef0e6; }
  table.vo-tabel tbody tr.vo-rij.vo-uitgeklapt { background: #eef0e6; }
  .vo-chevron { color: #9a9484; display: inline-block; width: 12px; }

  .status-pill {
    font-family: var(--mono); font-size: 10px; text-transform: uppercase; letter-spacing: 0.06em;
    padding: 3px 9px; border-radius: 20px; display: inline-block;
  }
  .status-ok { background: #e1ead9; color: var(--hop-dark); }
  .status-onder-min { background: #f4ded3; color: #a3492f; }
  .vo-week-pil-nu { background: #a3492f; color: #fff; }
  .vo-week-pil-volgende { background: #f0d4d4; color: #8a3b3b; }
  .vo-loopt-leeg-urgent { color: #a3492f; font-weight: 600; }
  .vo-forecast-btn {
    display: inline-block; padding: 5px 12px; border: 1px solid var(--line); border-radius: 4px;
    font-family: var(--mono); font-size: 11px; color: var(--hop-dark); text-decoration: none; white-space: nowrap;
  }
  .vo-forecast-btn:hover { border-color: var(--hop-dark); background: #f4f2ea; }

  .vo-subrij td { padding: 0; border-bottom: 1px solid var(--line); background: #faf9f5; }
  .vo-subrij-inhoud { padding: 16px 24px 20px 40px; }
  table.vo-lot-tabel { width: 100%; border-collapse: collapse; font-size: 13px; background: #fff; border: 1px solid var(--line); }
  table.vo-lot-tabel th, table.vo-lot-tabel td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--line); }
  table.vo-lot-tabel th { font-family: var(--mono); font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.06em; color: #6b6355; font-weight: normal; }
  tr.vo-lot-rij { cursor: pointer; }
  tr.vo-lot-rij:hover { background: #f4f2ea; }
  .vo-historie-btn {
    margin-top: 10px; background: none; border: none; color: var(--hop-dark); font-size: 12px; cursor: pointer;
    text-decoration: underline; padding: 0; font-family: var(--mono);
  }

  .vo-empty, .vo-loading, .vo-error {
    text-align: center; padding: 60px 20px; font-family: var(--mono); font-size: 13px; color: #7a7266;
  }
  .vo-error { color: #a3492f; }

  /* Lot-detailpopup, zelfde modal-taal als de rest van deze stijl */
  .vo-modal-overlay {
    display: none; position: fixed; inset: 0; background: rgba(28,43,38,0.45); z-index: 200;
    align-items: flex-start; justify-content: center; overflow-y: auto; padding: 40px 16px;
  }
  .vo-modal {
    background: #fff; border-radius: 6px; max-width: 520px; width: 100%; padding: 24px 28px; margin-bottom: 30px;
    border: 1px solid var(--line);
  }
  .vo-modal-titel { font-family: var(--mono); font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--amber); margin: 0 0 14px; }
  .vo-kv { display: flex; justify-content: space-between; font-size: 14px; padding: 6px 0; border-bottom: 1px solid #ece8dc; }
  .vo-kv:last-child { border-bottom: none; }
  .vo-kv span:first-child { color: #6b6355; }
  .vo-kv span:last-child { font-family: var(--mono); text-align: right; }
  .vo-batch-titel {
    font-family: var(--mono); font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em;
    color: #6b6355; margin: 18px 0 8px;
  }
  .vo-leeg-btn {
    background: none; border: 1px solid #a3492f; color: #a3492f; border-radius: 20px;
    padding: 8px 16px; font-family: var(--mono); font-size: 12px; font-weight: 700; cursor: pointer;
  }
  .vo-leeg-btn:hover { background: #a3492f; color: #fff; }
  .vo-sluit-btn {
    background: transparent; color: #6b6355; border: 1px solid var(--line);
    padding: 8px 16px; border-radius: 4px; font-family: var(--mono); font-size: 12px; cursor: pointer;
  }

  @media print {
    #jopen-nav, .vo-toolbar, .vo-bewerk-btn, .vo-print-btn, .vo-chevron { display: none !important; }
    .vo-subrij { display: table-row !important; }
  }
</style>
</head>
<body>

<div id="jopen-nav"></div>

<main class="vo-main">
  <div>
    <h1 class="vo-titel">Stock overview</h1>
    <p class="vo-meta">Current stock per ingredient, with alerts for low stock and projected shortages.</p>
  </div>
  <div style="text-align:center;">
    <div class="vo-huidige-week" id="vo-huidige-week"></div>
  </div>

  <div class="vo-toolbar">
    <a href="voorraad-inboeken.html" class="vo-bewerk-btn">+ Book in material</a>
    <input id="vo-zoek" placeholder="Search by name…" />
    <div class="dd-filter" id="dd-vo-categorie">
      <button type="button" class="dd-filter-btn" id="dd-vo-categorie-btn">Category <span class="dd-filter-caret">&#9662;</span><span class="dd-filter-mark" id="dd-vo-categorie-mark" style="display:none;"></span></button>
      <div class="dd-filter-panel" id="dd-vo-categorie-panel" style="display:none;">
        <div class="dd-filter-panel-header">
          <button type="button" data-actie="all">Select all</button>
          <button type="button" data-actie="none">Clear</button>
        </div>
        <div id="dd-vo-categorie-options"></div>
      </div>
    </div>
    <label class="vo-toggle"><input type="checkbox" id="vo-alleen-onder-min" /> Below minimum only</label>
    <label class="vo-toggle"><input type="checkbox" id="vo-toon-leeg" /> Show empty stock</label>
    <button type="button" class="vo-print-btn" id="vo-print-btn">Print / export selection</button>
    <div class="vo-count" id="vo-result-count"></div>
  </div>


  <div id="vo-list-container"><div class="vo-loading">Loading stock…</div></div>
</main>

<!-- Lot-detailpopup -->
<div class="vo-modal-overlay" id="vo-lot-detail-overlay">
  <div class="vo-modal">
    <div class="vo-modal-titel">Lot details</div>
    <div id="vo-lot-detail-body"></div>
    <div class="vo-batch-titel">Used in these batches (track &amp; trace)</div>
    <div id="vo-lot-detail-batches"><span class="vo-loading" style="padding:10px 0;">Loading…</span></div>
    <div style="margin-top:18px; display:flex; justify-content:space-between; align-items:center;">
      <div id="vo-lot-detail-leeg-knop"></div>
      <button type="button" id="vo-lot-detail-sluiten" class="vo-sluit-btn">Close</button>
    </div>
  </div>
</div>

<script src="config.js"></script>
<script src="nav.js"></script>
<script src="voorraad-forecast.js"></script>
<script>
  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str ?? '';
    return div.innerHTML;
  }
  function vfmt(n) {
    if (n === null || n === undefined || Number.isNaN(n)) return '—';
    return Number(n).toFixed(3).replace(/\.?0+$/, '');
  }

  let magBewerken = false;
  let vrGroepen = [];          // alle grondstofgroepen (zie laadStockOverview)
  let laatstGefilterd = [];
  let vrUitgeklapt = new Set();     // groep-sleutels die uitgeklapt zijn
  let vrHistorieOpen = new Set();   // groep-sleutels waarvan history getoond wordt
  let vrHistorieCache = {};         // groep-sleutel -> niet-actieve lots, lazy geladen
  let huidigeSortering = { kolom: 'naam', oplopend: true };
  let alleCategorieen = [];
  let geselecteerdeCategorieen = new Set();
  const WEKEN_VOORUITKIJK = 52;

  // ---------------------------------------------------------------------
  // Data laden
  // ---------------------------------------------------------------------
  async function laadStockOverview() {
    vrHistorieCache = {};
    vrHistorieOpen = new Set();
    const container = document.getElementById('vo-list-container');
    container.innerHTML = '<div class="vo-loading">Loading stock…</div>';

    const [ingrRes, lotsRes, mutRes, forecastRes] = await Promise.all([
      supabaseClient.from('ingredients')
        .select('id, naam, eenheid, minimum_voorraad, category_id, ingredient_categories(name)')
        .eq('versie_status', 'huidig'),
      supabaseClient.from('grondstof_lots')
        .select('id, ingredient_id, lotcode, leverancier, ontvangstdatum, hoeveelheid_ontvangen, eenheid, tht_datum, locatie, status')
        .eq('status', 'actief'),
      supabaseClient.from('voorraad_mutaties').select('lot_id, hoeveelheid').eq('type', 'uitboeking'),
      vfBerekenVerbruik(supabaseClient, vfVooruitkijkPeriodes(WEKEN_VOORUITKIJK)),
    ]);

    if (ingrRes.error || lotsRes.error) {
      container.innerHTML = `<div class="vo-error">Could not load stock: ${escapeHtml((ingrRes.error || lotsRes.error).message)}</div>`;
      return;
    }

    const uitgeboektPerLot = {};
    (mutRes.data || []).forEach(m => {
      if (m.lot_id == null) return;
      uitgeboektPerLot[m.lot_id] = (uitgeboektPerLot[m.lot_id] || 0) + Number(m.hoeveelheid || 0);
    });
    const lots = (lotsRes.data || []).map(l => ({
      ...l, resterend: Number(l.hoeveelheid_ontvangen || 0) - (uitgeboektPerLot[l.id] || 0),
    }));

    const ingredientMap = {};
    (ingrRes.data || []).forEach(i => { ingredientMap[i.id] = i; });

    const groepenMap = new Map();
    lots.forEach(l => {
      const ing = ingredientMap[l.ingredient_id];
      const naam = ing?.naam || `#${l.ingredient_id}`;
      const sleutel = `${l.ingredient_id}|${l.eenheid || ''}`;
      if (!groepenMap.has(sleutel)) {
        groepenMap.set(sleutel, {
          ingredientId: l.ingredient_id, naam, eenheid: l.eenheid || '',
          categorie: ing?.ingredient_categories?.name || null,
          categorieId: ing?.category_id != null ? String(ing.category_id) : null,
          minimum: ing?.minimum_voorraad != null ? Number(ing.minimum_voorraad) : null,
          totaal: 0, lots: [],
        });
      }
      const g = groepenMap.get(sleutel);
      g.totaal += l.resterend;
      g.lots.push(l);
    });

    (ingrRes.data || []).forEach(i => {
      if (i.minimum_voorraad == null) return;
      if ([...groepenMap.values()].some(g => g.ingredientId === i.id)) return;
      groepenMap.set(`${i.id}|leeg`, {
        ingredientId: i.id, naam: i.naam, eenheid: (i.eenheid || '').split('/')[0] || '',
        categorie: i.ingredient_categories?.name || null,
        categorieId: i.category_id != null ? String(i.category_id) : null,
        minimum: Number(i.minimum_voorraad), totaal: 0, lots: [],
      });
    });

    vrGroepen = [...groepenMap.values()].map(g => {
      const forecastKey = `${g.ingredientId}|${vfCanoniekeEenheid(g.eenheid)}`;
      const forecastEntry = (forecastRes && forecastRes.perIngredient) ? forecastRes.perIngredient[forecastKey] : null;
      const loopLeegWeek = forecastEntry ? vfLoopVoorraadVooruit(g.totaal, forecastEntry.perWeek) : null;
      return { ...g, loopLeegWeek };
    });

    alleCategorieen = [...new Map(
      vrGroepen.filter(g => g.categorieId).map(g => [g.categorieId, g.categorie])
    ).entries()].map(([id, naam]) => ({ id, naam })).sort((a, b) => a.naam.localeCompare(b.naam));
    if (geselecteerdeCategorieen.size === 0) geselecteerdeCategorieen = new Set(alleCategorieen.map(c => c.id));
    setupCategorieFilter();

    pasFiltersToe();
  }

  // ---------------------------------------------------------------------
  // Filters
  // ---------------------------------------------------------------------
  function setupCategorieFilter() {
    const optionsContainer = document.getElementById('dd-vo-categorie-options');
    optionsContainer.innerHTML = alleCategorieen.map(c => `
      <label class="dd-filter-option">
        <input type="checkbox" value="${escapeHtml(c.id)}" ${geselecteerdeCategorieen.has(c.id) ? 'checked' : ''} />
        ${escapeHtml(c.naam)}
      </label>`).join('');

    const mark = document.getElementById('dd-vo-categorie-mark');
    const werkMarkBij = () => { mark.style.display = geselecteerdeCategorieen.size < alleCategorieen.length ? 'block' : 'none'; };
    werkMarkBij();

    optionsContainer.querySelectorAll('input[type="checkbox"]').forEach(cb => {
      cb.addEventListener('change', () => {
        if (cb.checked) geselecteerdeCategorieen.add(cb.value); else geselecteerdeCategorieen.delete(cb.value);
        werkMarkBij();
        pasFiltersToe();
      });
    });
    const panel = document.getElementById('dd-vo-categorie-panel');
    panel.querySelector('[data-actie="all"]').onclick = () => {
      alleCategorieen.forEach(c => geselecteerdeCategorieen.add(c.id));
      optionsContainer.querySelectorAll('input[type="checkbox"]').forEach(cb => cb.checked = true);
      werkMarkBij(); pasFiltersToe();
    };
    panel.querySelector('[data-actie="none"]').onclick = () => {
      geselecteerdeCategorieen.clear();
      optionsContainer.querySelectorAll('input[type="checkbox"]').forEach(cb => cb.checked = false);
      werkMarkBij(); pasFiltersToe();
    };
  }
  function toggleDropdownPanel(prefix) {
    const panel = document.getElementById(`dd-${prefix}-panel`);
    const wasOpen = panel.style.display !== 'none';
    document.querySelectorAll('.dd-filter-panel').forEach(p => p.style.display = 'none');
    document.querySelectorAll('.dd-filter-btn').forEach(b => b.classList.remove('actief-menu'));
    if (!wasOpen) {
      panel.style.display = 'block';
      document.getElementById(`dd-${prefix}-btn`).classList.add('actief-menu');
    }
  }
  document.getElementById('dd-vo-categorie-btn').addEventListener('click', (e) => { e.stopPropagation(); toggleDropdownPanel('vo-categorie'); });
  document.querySelectorAll('.dd-filter-panel').forEach(p => p.addEventListener('click', e => e.stopPropagation()));
  document.addEventListener('click', () => {
    document.querySelectorAll('.dd-filter-panel').forEach(p => p.style.display = 'none');
    document.querySelectorAll('.dd-filter-btn').forEach(b => b.classList.remove('actief-menu'));
  });

  function isOnderMinimum(g) { return g.minimum != null && g.totaal < g.minimum; }

  function pasFiltersToe() {
    const zoekterm = document.getElementById('vo-zoek').value.trim().toLowerCase();
    const alleenOnderMin = document.getElementById('vo-alleen-onder-min').checked;
    const toonLeeg = document.getElementById('vo-toon-leeg').checked;

    const gefilterd = vrGroepen.filter(g => {
      const matchtZoek = !zoekterm || g.naam.toLowerCase().includes(zoekterm);
      const matchtCategorie = !g.categorieId || geselecteerdeCategorieen.has(g.categorieId);
      const matchtMin = !alleenOnderMin || isOnderMinimum(g);
      const matchtLeeg = toonLeeg || g.totaal > 0;
      return matchtZoek && matchtCategorie && matchtMin && matchtLeeg;
    });
    laatstGefilterd = gefilterd;
    renderStockLijst(pasSorteringToe(gefilterd));
  }
  document.getElementById('vo-zoek').addEventListener('input', pasFiltersToe);
  document.getElementById('vo-alleen-onder-min').addEventListener('change', pasFiltersToe);
  document.getElementById('vo-toon-leeg').addEventListener('change', pasFiltersToe);

  // ---------------------------------------------------------------------
  // Sortering
  // ---------------------------------------------------------------------
  function zetSortering(kolom) {
    if (huidigeSortering.kolom === kolom) huidigeSortering.oplopend = !huidigeSortering.oplopend;
    else huidigeSortering = { kolom, oplopend: true };
    renderStockLijst(pasSorteringToe(laatstGefilterd));
  }
  function sorteerPijl(kolom) {
    if (huidigeSortering.kolom !== kolom) return '';
    return huidigeSortering.oplopend ? ' &#9650;' : ' &#9660;';
  }
  function pasSorteringToe(groepen) {
    const { kolom, oplopend } = huidigeSortering;
    const rijen = [...groepen];
    rijen.sort((a, b) => {
      let av, bv;
      if (kolom === 'naam') { av = a.naam.toLowerCase(); bv = b.naam.toLowerCase(); }
      else if (kolom === 'categorie') { av = a.categorie || ''; bv = b.categorie || ''; }
      else if (kolom === 'voorraad') { av = a.totaal; bv = b.totaal; }
      else if (kolom === 'status') { av = isOnderMinimum(a) ? 0 : 1; bv = isOnderMinimum(b) ? 0 : 1; }
      else { av = a.naam.toLowerCase(); bv = b.naam.toLowerCase(); }
      if (av < bv) return oplopend ? -1 : 1;
      if (av > bv) return oplopend ? 1 : -1;
      return 0;
    });
    return rijen;
  }

  // ---------------------------------------------------------------------
  // Render
  // ---------------------------------------------------------------------
  function renderStockLijst(groepen) {
    const container = document.getElementById('vo-list-container');
    document.getElementById('vo-result-count').textContent = `${groepen.length} ingredient${groepen.length === 1 ? '' : 's'}`;

    if (groepen.length === 0) {
      container.innerHTML = '<div class="vo-empty">No ingredients match these filters.</div>';
      return;
    }

    const huidige = vfIsoWeekVanVandaag();
    const huidigeWeekSleutel = vfWeekSleutel(huidige.jaar, huidige.week);
    let vwJaar = huidige.jaar, vwWeek = huidige.week + 1;
    if (vwWeek > vfIsoWeeksInJaar(huidige.jaar)) { vwJaar++; vwWeek = 1; }
    const volgendeWeekSleutel = vfWeekSleutel(vwJaar, vwWeek);

    const kolommen = [['naam', 'Name'], ['categorie', 'Category'], ['eenheid', 'Unit'], ['voorraad', 'Current stock'], ['minimum', 'Minimum'], ['status', 'Status'], ['loopt_leeg', 'Runs out'], ['forecast', '']];

    const rijenHtml = groepen.map(g => {
      const sleutel = `${g.ingredientId}|${g.eenheid}`;
      const uitgeklapt = vrUitgeklapt.has(sleutel);
      const onderMin = isOnderMinimum(g);
      let weekPil = '';
      if (g.loopLeegWeek === huidigeWeekSleutel) weekPil = ' <span class="status-pill vo-week-pil-nu">This week</span>';
      else if (g.loopLeegWeek === volgendeWeekSleutel) weekPil = ' <span class="status-pill vo-week-pil-volgende">Next week</span>';
      const loopLeegTekst = g.loopLeegWeek
        ? `Runs out ~${escapeHtml(g.loopLeegWeek)}${weekPil}`
        : (g.totaal <= 0 ? 'No stock' : 'No shortage expected');

      // Forecast-knop: huidige week t/m de loopt-leeg-week (of, als er geen tekort
      // voorzien is, een standaard 12 weken vooruit) -- clip naar het einde van het
      // huidige jaar als de loopt-leeg-week toevallig in het volgende jaar valt, want
      // Consumption forecast kent nog geen jaargrens-overschrijdend bereik.
      let totJaar = huidige.jaar, totWeek = Math.min(huidige.week + 12, vfIsoWeeksInJaar(huidige.jaar));
      if (g.loopLeegWeek) {
        const [lj, lw] = g.loopLeegWeek.split('-W');
        totWeek = (Number(lj) === huidige.jaar) ? Number(lw) : vfIsoWeeksInJaar(huidige.jaar);
      }
      const forecastUrl = `verbruiksprognose.html?ingredient=${g.ingredientId}&jaar=${totJaar}&van=${huidige.week}&tot=${totWeek}`;

      let subrijHtml = '';
      if (uitgeklapt) {
        const historieOpen = vrHistorieOpen.has(sleutel);
        const historischeLots = vrHistorieCache[sleutel] || [];
        const alleLots = historieOpen ? g.lots.concat(historischeLots) : g.lots;
        subrijHtml = `
          <tr class="vo-subrij" data-sub-voor="${sleutel}">
            <td colspan="${kolommen.length}">
              <div class="vo-subrij-inhoud">
                ${alleLots.length === 0 ? '<p class="vo-empty" style="padding:12px 0;">No active lots.</p>' : `
                <table class="vo-lot-tabel">
                  <thead><tr><th>Lot code</th><th>Supplier</th><th>Received</th><th>Qty received</th><th>Remaining</th><th>Best-before</th><th>Location</th><th>Status</th></tr></thead>
                  <tbody>
                    ${alleLots.map(l => `
                      <tr class="vo-lot-rij" data-id="${l.id}" data-groep="${sleutel}">
                        <td>${escapeHtml(l.lotcode || '(no code)')}</td>
                        <td>${escapeHtml(l.leverancier || '—')}</td>
                        <td>${l.ontvangstdatum || '—'}</td>
                        <td>${l.hoeveelheid_ontvangen ?? '—'} ${escapeHtml(l.eenheid || '')}</td>
                        <td>${vfmt(l.resterend)} ${escapeHtml(l.eenheid || '')}</td>
                        <td>${l.tht_datum || '—'}</td>
                        <td>${escapeHtml(l.locatie || '—')}</td>
                        <td><span class="status-pill ${l.status === 'actief' ? 'status-ok' : ''}">${escapeHtml(l.status)}</span></td>
                      </tr>`).join('')}
                  </tbody>
                </table>`}
                <button type="button" class="vo-historie-btn" data-key="${sleutel}">
                  ${historieOpen ? 'Hide closed/empty lots' : 'Show closed/empty lots (history)'}
                </button>
              </div>
            </td>
          </tr>`;
      }
      return `
        <tr class="vo-rij ${uitgeklapt ? 'vo-uitgeklapt' : ''}" data-key="${sleutel}">
          <td><span class="vo-chevron">${uitgeklapt ? '▾' : '▸'}</span>${escapeHtml(g.naam)}</td>
          <td>${escapeHtml(g.categorie || '—')}</td>
          <td>${escapeHtml(g.eenheid || '—')}</td>
          <td>${vfmt(g.totaal)}</td>
          <td>${g.minimum != null ? vfmt(g.minimum) : '—'}</td>
          <td>${onderMin ? '<span class="status-pill status-onder-min">Below minimum</span>' : '<span class="status-pill status-ok">OK</span>'}</td>
          <td class="${g.loopLeegWeek ? 'vo-loopt-leeg-urgent' : ''}">${loopLeegTekst}</td>
          <td><a href="${forecastUrl}" class="vo-forecast-btn">Forecast</a></td>
        </tr>${subrijHtml}`;
    }).join('');

    container.innerHTML = `
      <table class="vo-tabel">
        <thead><tr>${kolommen.map(([kolom, label]) =>
          `<th class="vo-sorteerbaar" data-kolom="${kolom}">${label}${sorteerPijl(kolom)}</th>`).join('')}</tr></thead>
        <tbody>${rijenHtml}</tbody>
      </table>`;

    container.querySelectorAll('thead th[data-kolom]').forEach(th => {
      // Alleen naam/categorie/voorraad/status hebben een zinnige sorteerbetekenis
      if (['naam', 'categorie', 'voorraad', 'status'].includes(th.dataset.kolom)) {
        th.addEventListener('click', () => zetSortering(th.dataset.kolom));
      }
    });
    container.querySelectorAll('tr.vo-rij').forEach(tr => {
      tr.addEventListener('click', () => {
        const key = tr.dataset.key;
        if (vrUitgeklapt.has(key)) vrUitgeklapt.delete(key); else vrUitgeklapt.add(key);
        renderStockLijst(pasSorteringToe(laatstGefilterd));
      });
    });
    container.querySelectorAll('.vo-historie-btn').forEach(btn => {
      btn.addEventListener('click', async (e) => {
        e.stopPropagation();
        const key = btn.dataset.key;
        if (vrHistorieOpen.has(key)) { vrHistorieOpen.delete(key); renderStockLijst(pasSorteringToe(laatstGefilterd)); return; }
        btn.textContent = 'Loading…';
        const g = vrGroepen.find(x => `${x.ingredientId}|${x.eenheid}` === key);
        if (!vrHistorieCache[key]) {
          const { data, error } = await supabaseClient.from('grondstof_lots')
            .select('id, ingredient_id, lotcode, leverancier, ontvangstdatum, hoeveelheid_ontvangen, eenheid, tht_datum, locatie, status')
            .eq('ingredient_id', g.ingredientId).eq('eenheid', g.eenheid).neq('status', 'actief')
            .order('ontvangstdatum', { ascending: false });
          if (error) { alert('Could not load lot history: ' + error.message); return; }
          vrHistorieCache[key] = (data || []).map(l => ({ ...l, resterend: 0 }));
        }
        vrHistorieOpen.add(key);
        renderStockLijst(pasSorteringToe(laatstGefilterd));
      });
    });
    container.querySelectorAll('.vo-lot-rij').forEach(tr => {
      tr.addEventListener('click', (e) => {
        e.stopPropagation();
        const key = tr.dataset.groep;
        const g = vrGroepen.find(x => `${x.ingredientId}|${x.eenheid}` === key);
        const alleLots = g.lots.concat(vrHistorieCache[key] || []);
        const lot = alleLots.find(l => String(l.id) === tr.dataset.id);
        if (lot) toonLotDetail(lot, g);
      });
    });
    container.querySelectorAll('.vo-forecast-btn').forEach(a => {
      a.addEventListener('click', (e) => e.stopPropagation());
    });
  }

  // ---------------------------------------------------------------------
  // Lot-detailpopup
  // ---------------------------------------------------------------------
  function toonLotDetail(l, groep) {
    const rijen = [
      ['Ingredient', groep?.naam || '—'],
      ['Supplier', l.leverancier || '—'],
      ['Lot / batch code', l.lotcode || '—'],
      ['Receiving date', l.ontvangstdatum || '—'],
      ['Quantity received', `${l.hoeveelheid_ontvangen ?? '—'} ${l.eenheid || ''}`],
      ['Remaining', `${vfmt(l.resterend)} ${l.eenheid || ''}`],
      ['Location', l.locatie || '—'],
      ['Best-before date', l.tht_datum || '—'],
      ['Status', l.status || '—'],
    ];
    document.getElementById('vo-lot-detail-body').innerHTML = rijen.map(([label, waarde]) =>
      `<div class="vo-kv"><span>${escapeHtml(label)}</span><span>${escapeHtml(String(waarde))}</span></div>`
    ).join('');
    laadLotBatchGebruik(l.id);

    const legeKnopContainer = document.getElementById('vo-lot-detail-leeg-knop');
    if (magBewerken && l.resterend > 0) {
      legeKnopContainer.innerHTML = `<button type="button" id="vo-lot-leeg-btn" class="vo-leeg-btn">Mark lot as empty</button>`;
      document.getElementById('vo-lot-leeg-btn').addEventListener('click', () => zetLotOpLeeg(l, groep));
    } else {
      legeKnopContainer.innerHTML = '';
    }
    document.getElementById('vo-lot-detail-overlay').style.display = 'flex';
  }

  async function laadLotBatchGebruik(lotId) {
    const container = document.getElementById('vo-lot-detail-batches');
    container.innerHTML = '<span class="vo-loading" style="padding:10px 0;">Loading…</span>';
    const { data, error } = await supabaseClient
      .from('voorraad_mutaties')
      .select('hoeveelheid, aangemaakt_op, batches(batchnummer, naam)')
      .eq('lot_id', lotId).eq('type', 'uitboeking').not('batch_id', 'is', null)
      .order('aangemaakt_op', { ascending: true });
    if (error) { container.innerHTML = `<span style="color:#a3492f;">Could not load: ${escapeHtml(error.message)}</span>`; return; }
    if (!data || data.length === 0) { container.innerHTML = '<span class="vo-loading" style="padding:10px 0;">Not used in any batch yet.</span>'; return; }
    container.innerHTML = data.map(m => `
      <div class="vo-kv">
        <span>${m.batches ? escapeHtml(String(m.batches.batchnummer)) + ' — ' + escapeHtml(m.batches.naam) : '(deleted batch)'}</span>
        <span>${vfmt(m.hoeveelheid)} · ${m.aangemaakt_op ? new Date(m.aangemaakt_op).toLocaleDateString() : '—'}</span>
      </div>`).join('');
  }

  document.getElementById('vo-lot-detail-sluiten').addEventListener('click', () => {
    document.getElementById('vo-lot-detail-overlay').style.display = 'none';
  });
  document.getElementById('vo-lot-detail-overlay').addEventListener('click', (e) => {
    if (e.target.id === 'vo-lot-detail-overlay') document.getElementById('vo-lot-detail-overlay').style.display = 'none';
  });

  async function zetLotOpLeeg(l, groep) {
    if (!confirm(`Book out the remaining ${vfmt(l.resterend)} ${l.eenheid || ''} of lot "${l.lotcode || '(no code)'}" and mark it as empty?`)) return;
    const btn = document.getElementById('vo-lot-leeg-btn');
    btn.disabled = true;
    btn.textContent = 'Saving…';
    const { data: { session } } = await supabaseClient.auth.getSession();

    const { error: mutErr } = await supabaseClient.from('voorraad_mutaties').insert({
      lot_id: l.id, type: 'uitboeking', hoeveelheid: l.resterend,
      notitie: 'Lot marked empty from Stock overview', is_correction: true,
      geboekt_in_boekhouding: false, aangemaakt_door: session?.user?.id ?? null,
    });
    if (mutErr) { alert('Could not book out this lot: ' + mutErr.message); btn.disabled = false; btn.textContent = 'Mark lot as empty'; return; }
    const { error: lotErr } = await supabaseClient.from('grondstof_lots').update({ status: 'leeg' }).eq('id', l.id);
    if (lotErr) alert('Booked out, but could not update the lot status: ' + lotErr.message);
    document.getElementById('vo-lot-detail-overlay').style.display = 'none';
    laadStockOverview();
  }

  // ---------------------------------------------------------------------
  // Print / export
  // ---------------------------------------------------------------------
  document.getElementById('vo-print-btn').addEventListener('click', () => window.print());

  // ---------------------------------------------------------------------
  // Init
  // ---------------------------------------------------------------------
  function toonHuidigeWeek() {
    // vfIsoWeekVanVandaag() zit al in voorraad-forecast.js -- zelfde berekening als
    // de 'Runs out ~YYYY-Www'-projectie hieronder, dus deze twee blijven per definitie
    // met elkaar te relateren.
    const { jaar, week } = vfIsoWeekVanVandaag();
    document.getElementById('vo-huidige-week').innerHTML =
      `<div class="vo-huidige-week-label">Current week</div><div class="vo-huidige-week-waarde">${jaar}-W${String(week).padStart(2, '0')}</div>`;
  }

  window.addEventListener('DOMContentLoaded', async () => {
    toonHuidigeWeek();
    const gebruiker = await getHuidigeGebruiker();
    magBewerken = !!gebruiker && await magBewerkenModule('inventory');
    await laadStockOverview();
  });

  // Terugnavigeren (browser "Vorige") kan de pagina uit de bfcache herstellen i.p.v.
  // 'm opnieuw te laden -- als je de pagina verliet vóórdat de data binnen was, bleef
  // hij daardoor voor altijd op de laad-skeleton staan. event.persisted === true
  // betekent "dit is een bfcache-restore, geen verse laadbeurt", dus dan alsnog de
  // data ophalen.
  window.addEventListener('pageshow', (e) => {
    if (e.persisted) {
      toonHuidigeWeek();
      laadStockOverview();
    }
  });
</script>
</body>
</html>
