<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Jopen — Recipe overview</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="jopen-shared.css">
<style>
  :root {
    --ink: #1c2b26;
    --paper: #f6f4ee;
    --line: #d8d2c4;
    --hop: #4c6b4f;
    --hop-dark: #33473a;
    --amber: #b4772c;
    --mono: "IBM Plex Mono", "Courier New", monospace;
    --serif: Arial, Helvetica, sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--serif);
    min-height: 100vh;
  }
  header {
    padding: 28px 32px 20px;
    border-bottom: 3px solid var(--hop-dark);
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    flex-wrap: wrap;
    gap: 12px;
  }
  header h1 {
    margin: 0;
    font-size: 28px;
    letter-spacing: 0.02em;
  }
  header h1 span { color: var(--hop); }
  header .sub {
    font-family: var(--mono);
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: #6b6355;
  }
  #config {
    max-width: 640px;
    margin: 24px auto;
    padding: 20px 24px;
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 6px;
  }
  #config label {
    display: block;
    font-family: var(--mono);
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: #6b6355;
    margin-top: 12px;
  }
  #config input {
    width: 100%;
    padding: 9px 10px;
    margin-top: 4px;
    border: 1px solid var(--line);
    border-radius: 4px;
    font-family: var(--mono);
    font-size: 13px;
  }
  #config button {
    margin-top: 16px;
    background: var(--hop-dark);
    color: #fff;
    border: none;
    padding: 10px 18px;
    border-radius: 4px;
    font-family: var(--mono);
    font-size: 12px;
    letter-spacing: 0.06em;
    cursor: pointer;
  }
  #config button:hover { background: var(--hop); }
  #config .hint { font-size: 12px; color: #7a7266; margin-top: 10px; line-height: 1.5; }

  main { display: none; padding: 24px 32px 60px; max-width: 1100px; margin: 0 auto; }
  main.active { display: block; }

  .toolbar { display: flex; gap: 12px; align-items: center; margin-bottom: 18px; flex-wrap: wrap; }
  #search {
    flex: 1; min-width: 220px;
    padding: 10px 14px;
    border: 1px solid var(--line);
    border-radius: 4px;
    font-family: var(--serif);
    font-size: 15px;
    background: #fff;
  }
  .count { font-family: var(--mono); font-size: 12px; color: #7a7266; white-space: nowrap; }
  .toolbar select {
    padding: 9px 12px; border: 1px solid var(--line); border-radius: 4px;
    font-family: var(--serif); font-size: 14px; background: #fff; cursor: pointer;
  }

  /* -- Dropdown-filters (Excel-stijl: checkboxen in een uitklappaneel, met
     een klein indicator-puntje op de knop zelf zodra er gefilterd wordt) -- */
  .dd-filter { position: relative; display: inline-block; }
  .dd-filter-btn {
    position: relative; display: flex; align-items: center; gap: 6px;
    padding: 9px 14px; border: 1px solid var(--line); border-radius: 4px;
    font-family: var(--serif); font-size: 14px; background: #fff; color: var(--ink); cursor: pointer;
  }
  .dd-filter-btn:hover { border-color: var(--hop-dark); }
  .dd-filter-btn.actief-menu { border-color: var(--hop-dark); }
  .dd-filter-caret { font-size: 10px; opacity: 0.55; }
  .dd-filter-mark {
    position: absolute; top: -4px; right: -4px; width: 9px; height: 9px; border-radius: 50%;
    background: var(--amber); border: 2px solid var(--paper);
  }
  .dd-filter-panel {
    position: absolute; top: calc(100% + 6px); left: 0; z-index: 60; min-width: 200px;
    background: #fff; border: 1px solid var(--line); border-radius: 6px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.14); padding: 6px 0;
  }
  .dd-filter-panel-header {
    display: flex; justify-content: space-between; gap: 10px; padding: 2px 14px 8px;
    margin-bottom: 4px; border-bottom: 1px solid var(--line);
  }
  .dd-filter-panel-header button {
    background: none; border: none; padding: 0; cursor: pointer;
    font-family: var(--mono); font-size: 11px; color: var(--hop-dark); text-decoration: underline;
  }
  .dd-filter-option {
    display: flex; align-items: center; gap: 9px; padding: 7px 14px; font-size: 14px; cursor: pointer;
  }
  .dd-filter-option:hover { background: #f4f2ea; }
  .dd-filter-option input { cursor: pointer; }

  table { width: 100%; border-collapse: collapse; background: #fff; }
  thead th {
    text-align: left;
    font-family: var(--mono);
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: #6b6355;
    padding: 10px 14px;
    border-bottom: 2px solid var(--hop-dark);
  }
  thead th.sorteerbaar { cursor: pointer; user-select: none; white-space: nowrap; }
  thead th.sorteerbaar:hover { color: var(--hop-dark); }
  thead th.sorteer-actief { color: var(--hop-dark); }
  tbody td {
    padding: 12px 14px;
    border-bottom: 1px solid var(--line);
    font-size: 15px;
  }
  tbody tr { cursor: pointer; transition: background 0.12s; }
  tbody tr:hover { background: #eef0e6; }
  .status-pill {
    font-family: var(--mono);
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    padding: 3px 9px;
    border-radius: 20px;
    display: inline-block;
  }
  .status-actief { background: #e1ead9; color: var(--hop-dark); }
  .status-concept { background: #f3e3c9; color: #8a5a1e; }
  .status-gearchiveerd { background: #e6e2d8; color: #7a7266; }

  #detail-view { display: none; }
  #detail-view.active { display: block; }
  .back-link {
    font-family: var(--mono);
    font-size: 12px;
    font-weight: 700;
    color: var(--hop-dark);
    cursor: pointer;
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    margin-bottom: 18px;
    border: 1.5px solid var(--hop-dark);
    border-radius: 20px;
    padding: 7px 16px;
    transition: background 0.15s, color 0.15s;
  }
  .back-link:hover { background: var(--hop-dark); color: #fff; text-decoration: none; }

  .action-pill {
    font-family: var(--mono); font-size: 11px; font-weight: 700; text-decoration: none;
    display: inline-block; border: 1.5px solid var(--hop-dark); color: var(--hop-dark);
    border-radius: 20px; padding: 4px 12px; transition: background 0.15s, color 0.15s;
  }
  .action-pill:hover { background: var(--hop-dark); color: #fff; }

  .edit-pill {
    font-family: var(--mono); font-size: 12px; font-weight: 700; text-decoration: none;
    display: inline-block; background: var(--amber); color: #fff;
    border-radius: 20px; padding: 6px 16px; transition: background 0.15s;
  }
  .edit-pill:hover { background: #96601f; }

  .recipe-title { font-size: 32px; margin: 0 0 4px; }
  .recipe-meta { font-family: var(--mono); font-size: 13px; color: #6b6355; margin-bottom: 24px; }
  .recipe-meta b { color: var(--ink); }

  .grid-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px,1fr)); gap: 14px; margin-bottom: 28px; }
  .card {
    background: #fff; border: 1px solid var(--line); border-radius: 6px; padding: 16px 18px;
  }
  .card h3 {
    margin: 0 0 10px; font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em;
    color: var(--hop-dark); font-family: var(--mono); border-bottom: 1px solid var(--line); padding-bottom: 8px;
  }
  .kv { display: flex; justify-content: space-between; font-size: 14px; padding: 4px 0; }
  .kv span:first-child { color: #6b6355; }
  .kv span:last-child { font-family: var(--mono); }

  .section-title {
    font-size: 13px; text-transform: uppercase; letter-spacing: 0.1em; color: #fff;
    font-family: var(--mono); margin: 30px 0 10px; background: var(--hop-dark);
    padding: 10px 16px; border-radius: 5px 5px 0 0;
  }
  .section-title + .param-columns,
  .section-title + table,
  .section-title + .empty { margin-top: -10px; }
  .ing-table { width: 100%; border-collapse: collapse; background: #fff; margin-bottom: 10px; }
  .ing-table th {
    text-align: left; font-family: var(--mono); font-size: 10px; text-transform: uppercase;
    letter-spacing: 0.06em; color: #6b6355; padding: 8px 12px; border-bottom: 1px solid var(--line);
  }
  .ing-table td { padding: 8px 12px; border-bottom: 1px solid #ece8dc; font-size: 14px; }
  .rol-tag {
    font-family: var(--mono); font-size: 10px; text-transform: uppercase;
    color: var(--amber); letter-spacing: 0.04em;
  }

  .empty, .loading, .error {
    text-align: center; padding: 60px 20px; font-family: var(--mono); font-size: 13px; color: #7a7266;
  }
  .error { color: #a33f2c; }

  .param-columns { column-count: 3; column-gap: 24px; background: #fff; border: 1px solid var(--line); border-radius: 6px; padding: 16px 20px; margin-bottom: 10px; }
  .param-row { display: grid; grid-template-columns: 1fr auto; gap: 8px; padding: 5px 0; border-bottom: 1px solid #ece8dc; font-size: 14px; break-inside: avoid; }
  .param-row span:first-child { color: #6b6355; }
  .param-row span:last-child { font-family: var(--mono); }
  .param-row .tol { color: #a89f8e; font-size: 12px; margin-left: 4px; }
  .param-sub-heading {
    font-family: var(--mono); font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em;
    color: var(--amber); margin: 14px 0 4px; break-after: avoid-column;
  }
  .param-sub-heading:first-child { margin-top: 0; }
  .param-sub-block { break-inside: avoid; }
  .full-span { column-span: all; margin-bottom: 10px; }
  .full-span .param-row { grid-template-columns: 140px 1fr; }
  .full-span .param-row span:last-child { white-space: normal; }
  .param-columns-2 { column-count: 2; }
  .badge-row { display:inline-block; border:2px solid var(--line); border-radius:6px; padding:6px 12px; margin:4px 10px 4px 0; }
  .badge-row span:first-child { display:block; font-weight:700; font-size:11px; text-transform:uppercase; letter-spacing:0.05em; opacity:0.85; }
  .badge-row span:last-child { font-family: var(--mono); font-weight:700; }
</style>
</head>
<body>

<div id="jopen-nav"></div>

<header>
  <h1>Recipes</h1>
  <div class="sub" id="conn-status">not connected</div>
</header>

<main id="main">
  <div id="list-view">
    <div class="toolbar">
      <input id="search" placeholder="Search by name or beer style…">
      <div class="dd-filter" id="dd-status">
        <button type="button" class="dd-filter-btn" id="dd-status-btn">Status <span class="dd-filter-caret">&#9662;</span><span class="dd-filter-mark" id="dd-status-mark" style="display:none;"></span></button>
        <div class="dd-filter-panel" id="dd-status-panel" style="display:none;">
          <div class="dd-filter-panel-header">
            <button type="button" data-actie="all">Select all</button>
            <button type="button" data-actie="none">Clear</button>
          </div>
          <div id="dd-status-options"></div>
        </div>
      </div>
      <div class="dd-filter" id="dd-locatie">
        <button type="button" class="dd-filter-btn" id="dd-locatie-btn">Location <span class="dd-filter-caret">&#9662;</span><span class="dd-filter-mark" id="dd-locatie-mark" style="display:none;"></span></button>
        <div class="dd-filter-panel" id="dd-locatie-panel" style="display:none;">
          <div class="dd-filter-panel-header">
            <button type="button" data-actie="all">Select all</button>
            <button type="button" data-actie="none">Clear</button>
          </div>
          <div id="dd-locatie-options"></div>
        </div>
      </div>
      <div class="count" id="result-count"></div>
      <a href="recept-invoer.html" class="edit-pill" id="new-recipe-link" style="display:none; margin-bottom:0;">+ New recipe</a>
    </div>
    <div id="list-container"><div class="loading">Loading recipes…</div></div>
  </div>

  <div id="detail-view">
    <a class="back-link" id="back-btn">&larr; Back to overview</a>
    <div id="detail-container"></div>
  </div>
</main>

<script src="config.js"></script>
<script src="nav.js"></script>
<script>
// Supabase-client (supabaseClient) en auth komen nu uit config.js, gedeeld
// door alle Jopen-app-pagina's. Zie config.js voor de credentials.
let allRecipes = [];
let laatsteBatchPerRecept = {};
let laatsteWijzigingPerRecept = {};
let laatsteWijzigingDoorPerRecept = {};
let huidigeGebruikerRol = null;

// -- Filter-status persistentie (toggleboxes voor status/locatie) --
// Onthoudt welke toggles aan staan tussen bezoeken via localStorage. Bij het
// eerste bezoek (niets opgeslagen) staat alles aan, wat gelijk is aan "geen
// filter". `null` in de opgeslagen set betekent hier altijd "alle waarden
// geselecteerd" totdat de gebruiker er zelf één uitklikt.
const FILTER_OPSLAG_KEY = 'jopen_receptoverzicht_filters_v1';

function laadOpgeslagenFilters() {
  try {
    const ruw = localStorage.getItem(FILTER_OPSLAG_KEY);
    if (!ruw) return { status: null, locatie: null };
    const parsed = JSON.parse(ruw);
    return {
      status: Array.isArray(parsed.status) ? parsed.status : null,
      locatie: Array.isArray(parsed.locatie) ? parsed.locatie : null,
    };
  } catch (e) {
    return { status: null, locatie: null };
  }
}

function bewaarFilters() {
  try {
    localStorage.setItem(FILTER_OPSLAG_KEY, JSON.stringify({
      status: [...geselecteerdeStatussen],
      locatie: [...geselecteerdeLocaties],
    }));
  } catch (e) { /* localStorage niet beschikbaar: filter werkt nog steeds, alleen niet onthouden */ }
}

let geselecteerdeStatussen = new Set();
let geselecteerdeLocaties = new Set();

const mainEl = document.getElementById('main');
const connStatus = document.getElementById('conn-status');

// Display-only translation of the status values as stored in the database
// (Dutch: actief/concept/gearchiveerd) — the stored value itself is left
// unchanged, only what's shown to the user is translated.
function statusLabel(status) {
  const labels = { actief: 'Active', concept: 'Draft', gearchiveerd: 'Archived' };
  return labels[status] || status || 'Unknown';
}

// Zelfde principe als statusLabel(): in de database staat de volledige naam
// (verplicht door de check-constraint op recipes.locatie), in de app tonen
// we de korte WP/JK-afkorting.
function locatieLabel(locatie) {
  const labels = { 'Waarderpolder': 'WP', 'Jopen Kerk': 'JK' };
  return labels[locatie] || locatie || '—';
}

let magReceptBewerken = false;   // rechten voor module 'recipes', geladen bij page load
let magReceptVerwijderen = false;

window.addEventListener('DOMContentLoaded', async () => {
  const gebruiker = await getHuidigeGebruiker();
  huidigeGebruikerRol = gebruiker ? gebruiker.rol : null;
  magReceptBewerken = !!gebruiker && await magBewerkenModule('recipes');
  magReceptVerwijderen = !!gebruiker && await magVerwijderenModule('recipes');
  if (magReceptBewerken) {
    document.getElementById('new-recipe-link').style.display = 'inline-block';
  }

  try {
    const { error } = await supabaseClient.from('recipes').select('id').limit(1);
    if (error) throw error;
    mainEl.classList.add('active');
    connStatus.textContent = 'connected';

    const directId = new URLSearchParams(window.location.search).get('id');
    if (directId) {
      await openDetail(directId);
    } else {
      loadRecipes();
    }
  } catch (e) {
    connStatus.textContent = 'connection failed';
    document.getElementById('list-container').innerHTML =
      `<div class="error">Could not connect to Supabase: ${e.message || e}</div>`;
  }
});

// Haalt alle rijen op ondanks Supabase's default limiet van 1000 per query
// (belangrijk voor recipe_revisies, dat meerdere rijen per recept kan hebben).
async function haalAlleRijenOp(query) {
  const PAGINA = 1000;
  let vanaf = 0;
  let alles = [];
  while (true) {
    const { data, error } = await query.range(vanaf, vanaf + PAGINA - 1);
    if (error) return { data: null, error };
    alles = alles.concat(data || []);
    if (!data || data.length < PAGINA) break;
    vanaf += PAGINA;
  }
  return { data: alles, error: null };
}

async function loadRecipes() {
  const container = document.getElementById('list-container');
  const [{ data, error }, { data: batchData, error: batchErr }, { data: revisieData, error: revisieErr }] = await Promise.all([
    supabaseClient
      .from('recipes')
      .select('id, naam, bierstijl, locatie, status, versie_major, versie_minor, recipe_group_id')
      .order('naam'),
    supabaseClient.from('batches').select('recipe_id, aangemaakt_op'),
    haalAlleRijenOp(supabaseClient.from('recipe_revisies').select('recipe_id, datum, door')),
  ]);
  if (error) {
    container.innerHTML = `<div class="error">Error loading: ${error.message}</div>`;
    return;
  }
  if (batchErr) console.error('Could not load batch generation dates:', batchErr);
  if (revisieErr) console.error('Could not load revision dates:', revisieErr);

  laatsteBatchPerRecept = {};
  (batchData || []).forEach(b => {
    if (!b.recipe_id || !b.aangemaakt_op) return;
    const huidig = laatsteBatchPerRecept[b.recipe_id];
    if (!huidig || b.aangemaakt_op > huidig) laatsteBatchPerRecept[b.recipe_id] = b.aangemaakt_op;
  });

  // "Laatst gewijzigd" = de datum van de meest recente revisie van déze
  // specifieke receptversie (recipe_id) — zelfde bron als het "Latest
  // revision → Date"-veld dat al in de General-sectie van recept-invoer.html
  // staat. "Modified by" is de 'door'-waarde van diezelfde meest recente
  // revisie-rij (niet los bijgehouden, dus in dezelfde loop bepaald).
  laatsteWijzigingPerRecept = {};
  laatsteWijzigingDoorPerRecept = {};
  (revisieData || []).forEach(rv => {
    if (!rv.recipe_id || !rv.datum) return;
    const huidig = laatsteWijzigingPerRecept[rv.recipe_id];
    if (!huidig || rv.datum > huidig) {
      laatsteWijzigingPerRecept[rv.recipe_id] = rv.datum;
      laatsteWijzigingDoorPerRecept[rv.recipe_id] = rv.door || '';
    }
  });

  allRecipes = data || [];

  // Filters initialiseren: opgeslagen selectie toepassen indien aanwezig,
  // anders alles aan (= geen filter) als startpunt.
  const opgeslagen = laadOpgeslagenFilters();
  const alleStatussen = ['actief', 'concept', 'gearchiveerd'];
  geselecteerdeStatussen = new Set(opgeslagen.status ? opgeslagen.status.filter(s => alleStatussen.includes(s)) : alleStatussen);
  const alleLocaties = [...new Set(allRecipes.map(r => r.locatie).filter(Boolean))].sort();
  geselecteerdeLocaties = new Set(opgeslagen.locatie ? opgeslagen.locatie.filter(l => alleLocaties.includes(l)) : alleLocaties);

  renderFilterToggles();
  pasFiltersToe();
}

function setupDropdownFilter(prefix, opties, geselecteerdSet, onChange) {
  const optionsContainer = document.getElementById(`dd-${prefix}-options`);
  optionsContainer.innerHTML = opties.map(([waarde, label]) => `
    <label class="dd-filter-option">
      <input type="checkbox" value="${escapeHtml(String(waarde))}" ${geselecteerdSet.has(waarde) ? 'checked' : ''} />
      ${escapeHtml(label)}
    </label>
  `).join('');

  const mark = document.getElementById(`dd-${prefix}-mark`);
  const werkMarkBij = () => {
    mark.style.display = geselecteerdSet.size < opties.length ? 'block' : 'none';
  };
  werkMarkBij();

  optionsContainer.querySelectorAll('input[type="checkbox"]').forEach(cb => {
    cb.addEventListener('change', () => {
      if (cb.checked) geselecteerdSet.add(cb.value); else geselecteerdSet.delete(cb.value);
      werkMarkBij();
      onChange();
    });
  });

  const panel = document.getElementById(`dd-${prefix}-panel`);
  panel.querySelector('[data-actie="all"]').onclick = () => {
    opties.forEach(([w]) => geselecteerdSet.add(w));
    optionsContainer.querySelectorAll('input[type="checkbox"]').forEach(cb => cb.checked = true);
    werkMarkBij();
    onChange();
  };
  panel.querySelector('[data-actie="none"]').onclick = () => {
    geselecteerdSet.clear();
    optionsContainer.querySelectorAll('input[type="checkbox"]').forEach(cb => cb.checked = false);
    werkMarkBij();
    onChange();
  };
}

function renderFilterToggles() {
  const statusOpties = [
    ['actief', 'Active'], ['concept', 'Draft'], ['gearchiveerd', 'Archived'],
  ];
  setupDropdownFilter('status', statusOpties, geselecteerdeStatussen, () => {
    bewaarFilters();
    pasFiltersToe();
  });

  const alleLocaties = [...new Set(allRecipes.map(r => r.locatie).filter(Boolean))].sort();
  const locatieOpties = alleLocaties.map(l => [l, locatieLabel(l)]);
  setupDropdownFilter('locatie', locatieOpties, geselecteerdeLocaties, () => {
    bewaarFilters();
    pasFiltersToe();
  });
}

// -- Dropdown open/dicht, buiten-klik sluit alles, één tegelijk open --
function toggleDropdownPanel(prefix) {
  const panel = document.getElementById(`dd-${prefix}-panel`);
  const wasOpen = panel.style.display !== 'none';
  document.querySelectorAll('.dd-filter-panel').forEach(p => p.style.display = 'none');
  document.querySelectorAll('.dd-filter-btn').forEach(b => b.classList.remove('actief-menu'));
  if (!wasOpen) {
    panel.style.display = 'block';
    document.getElementById(`dd-${prefix}-btn`).classList.add('actief-menu');
  }
}
document.getElementById('dd-status-btn').addEventListener('click', (e) => { e.stopPropagation(); toggleDropdownPanel('status'); });
document.getElementById('dd-locatie-btn').addEventListener('click', (e) => { e.stopPropagation(); toggleDropdownPanel('locatie'); });
document.querySelectorAll('.dd-filter-panel').forEach(p => p.addEventListener('click', e => e.stopPropagation()));

function formatDatum(iso) {
  if (!iso) return '—';
  return new Date(iso).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
}

function renderList(recipes) {
  const container = document.getElementById('list-container');
  document.getElementById('result-count').textContent = `${recipes.length} recipe${recipes.length===1?'':'s'}`;
  if (recipes.length === 0) {
    container.innerHTML = `<div class="empty">No recipes found.</div>`;
    return;
  }
  const rows = recipes.map(r => `
    <tr data-id="${r.id}">
      <td>${escapeHtml(r.naam)}</td>
      <td>${escapeHtml(r.bierstijl || '—')}</td>
      <td>${escapeHtml(locatieLabel(r.locatie))}</td>
      <td>v${r.versie_major ?? 1}.${r.versie_minor ?? 0}</td>
      <td><span class="status-pill status-${r.status}">${statusLabel(r.status)}</span></td>
      <td>${formatDatum(laatsteWijzigingPerRecept[r.id])}</td>
      <td>${escapeHtml(laatsteWijzigingDoorPerRecept[r.id] || '—')}</td>
      <td>${formatDatum(laatsteBatchPerRecept[r.id])}</td>
    </tr>`).join('');

  const kolommen = [
    { veld: 'naam', label: 'Name' },
    { veld: 'bierstijl', label: 'Beer style' },
    { veld: 'locatie', label: 'Location' },
    { veld: 'versie', label: 'Version' },
    { veld: null, label: 'Status' },
    { veld: 'laatste_wijziging', label: 'Last modified' },
    { veld: 'laatste_wijziging_door', label: 'Modified by' },
    { veld: 'laatste_batch', label: 'Last batch generated' },
  ];
  const headerHtml = kolommen.map(k => {
    if (!k.veld) return `<th>${k.label}</th>`;
    const actief = huidigSorteerVeld === k.veld;
    const pijl = actief ? (sorteerRichting === 'asc' ? ' &#9650;' : ' &#9660;') : '';
    return `<th class="sorteerbaar${actief ? ' sorteer-actief' : ''}" data-sort="${k.veld}">${k.label}${pijl}</th>`;
  }).join('');

  container.innerHTML = `
    <table>
      <thead><tr>${headerHtml}</tr></thead>
      <tbody>${rows}</tbody>
    </table>`;
  container.querySelectorAll('tbody tr').forEach(tr => {
    tr.addEventListener('click', () => openDetail(tr.dataset.id));
  });
  container.querySelectorAll('th.sorteerbaar').forEach(th => {
    th.addEventListener('click', () => {
      const veld = th.dataset.sort;
      if (huidigSorteerVeld === veld) {
        sorteerRichting = sorteerRichting === 'asc' ? 'desc' : 'asc';
      } else {
        huidigSorteerVeld = veld;
        sorteerRichting = 'asc';
      }
      pasFiltersToe();
    });
  });
}

let sorteerRichting = 'asc';
let huidigSorteerVeld = 'naam';

function pasFiltersToe() {
  const q = document.getElementById('search').value.trim().toLowerCase();

  let resultaat = allRecipes.filter(r => {
    const matchtZoekterm = (r.naam || '').toLowerCase().includes(q) || (r.bierstijl || '').toLowerCase().includes(q);
    const matchtStatus = geselecteerdeStatussen.has(r.status);
    const matchtLocatie = !r.locatie || geselecteerdeLocaties.has(r.locatie);
    return matchtZoekterm && matchtStatus && matchtLocatie;
  });

  const vergelijk = (a, b) => {
    switch (huidigSorteerVeld) {
      case 'bierstijl': return (a.bierstijl || '').localeCompare(b.bierstijl || '');
      case 'locatie': return (a.locatie || '').localeCompare(b.locatie || '');
      case 'versie': {
        const va = (a.versie_major ?? 1) * 1000 + (a.versie_minor ?? 0);
        const vb = (b.versie_major ?? 1) * 1000 + (b.versie_minor ?? 0);
        return va - vb;
      }
      case 'laatste_wijziging': {
        const da = laatsteWijzigingPerRecept[a.id] || '';
        const db = laatsteWijzigingPerRecept[b.id] || '';
        return da.localeCompare(db);
      }
      case 'laatste_wijziging_door': {
        const da = laatsteWijzigingDoorPerRecept[a.id] || '';
        const db = laatsteWijzigingDoorPerRecept[b.id] || '';
        return da.localeCompare(db);
      }
      case 'laatste_batch': {
        const da = laatsteBatchPerRecept[a.id] || '';
        const db = laatsteBatchPerRecept[b.id] || '';
        return da.localeCompare(db);
      }
      default: return (a.naam || '').localeCompare(b.naam || '');
    }
  };
  resultaat.sort((a, b) => sorteerRichting === 'asc' ? vergelijk(a, b) : -vergelijk(a, b));

  renderList(resultaat);
}

document.getElementById('search').addEventListener('input', pasFiltersToe);

    let idx = -1;
    for (let i = 0; i < HOP_SG_BUCKETS.length; i++) {
      if (HOP_SG_BUCKETS[i] <= sgBucket) idx = i;
    }
    return idx;
  }

  function bepaalHopRendement(kooktijdMin, origineelExtractPlato) {
    const sgBucket = bepaalHopSgBucket(origineelExtractPlato);
    if (sgBucket === null) return null;
    const kolomIdx = bepaalHopSgKolomIndex(sgBucket);
    if (kolomIdx === -1) return null;
    const rij = HOP_RENDEMENT_TABEL.find(r => r.kooktijd === kooktijdMin);
    if (!rij) return null;
    return rij.rendement[kolomIdx];
  }

  // EBU voor één hopgift. Excel: (Gram*1000) * (alpha/100) * (rendement/100) / volume_liter
  // "Amount" in dit formulier bevat dezelfde ruwe waarde als Excel's "Gram"-kolom
  // (bv. 5000 voor 5000 gram), dus de *1000 uit het origineel blijft nodig.
  function bepaalHopEbu(gewichtGram, alphaPct, kooktijdMin, origineelExtractPlato, volumeKookHl) {
    const rendementPct = bepaalHopRendement(kooktijdMin, origineelExtractPlato);
    if (rendementPct === null || !volumeKookHl || !gewichtGram || alphaPct === null || alphaPct === undefined) return null;
    const volumeLiter = volumeKookHl * 100;
    return (gewichtGram * 1000) * (alphaPct / 100) * (rendementPct / 100) / volumeLiter;
  }

  // Hop Boil altijd bovenaan (hoogste Timing eerst, aflopend), daarna Dry hop
  // in de volgorde Warm / 16°C / Cold (0°C), op basis van de exacte
  // dropdown-waarde (warm/16c/0c) uit het invoerscherm.
  function sorteerHopHerbsRegels(rijen) {
    const boil = rijen.filter(r => r.rol === 'hopgift_kook')
      .sort((a, b) => (parseFloat(b.tijdstip) || -Infinity) - (parseFloat(a.tijdstip) || -Infinity));
    const dryHopVolgorde = ['warm', '16c', '0c'];
    const dryHop = rijen.filter(r => r.rol === 'dry_hop')
      .sort((a, b) => dryHopVolgorde.indexOf(a.tijdstip) - dryHopVolgorde.indexOf(b.tijdstip));
    return [...boil, ...dryHop];
  }

  const dryHopTimingLabels = { warm: 'Warm', '16c': '16°C', '0c': 'Cold (0°C)' };
  function timingWeergave(i) {
    if (i.rol === 'dry_hop') return dryHopTimingLabels[i.tijdstip] || i.tijdstip || '—';
    return i.tijdstip || '—';
  }

  function ingTabelHtml(rollenFilter, kolomRol, toonHdt = false, toonAlpha = false, toonMout = false, toonHopEbu = false) {
    let subset = ings.filter(i => rollenFilter.includes(i.rol));
    if (subset.length === 0) return '<div class="empty">None added.</div>';
    if (toonHdt) subset = sorteerHopHerbsRegels(subset);

    const totaalKg = toonMout ? subset.reduce((sum, i) => sum + (i.hoeveelheid || 0), 0) : 0;

    let totaalEbu = 0;
    const rows = subset.map(i => {
      let rendementCel = '';
      let ebuCel = '';
      if (toonHopEbu) {
        if (i.rol === 'hopgift_kook') {
          const kooktijd = i.tijdstip !== null && i.tijdstip !== undefined && i.tijdstip !== '' ? Number(i.tijdstip) : null;
          const rendement = (kooktijd !== null && s.origineel_extract) ? bepaalHopRendement(kooktijd, s.origineel_extract) : null;
          const ebu = (kooktijd !== null && s.origineel_extract) ? bepaalHopEbu(i.hoeveelheid, i.alpha_pct, kooktijd, s.origineel_extract, b.volume_kook) : null;
          if (ebu !== null) totaalEbu += ebu;
          rendementCel = `<td>${rendement !== null ? rendement.toFixed(1) + '%' : '—'}</td>`;
          ebuCel = `<td>${ebu !== null ? ebu.toFixed(1) : '—'}</td>`;
        } else {
          rendementCel = '<td>—</td>';
          ebuCel = '<td>—</td>';
        }
      }
      return `
      <tr>
        ${kolomRol ? `<td><span class="rol-tag">${rolLabels[i.rol] || i.rol}</span></td>` : ''}
        <td>${escapeHtml(i.ingredients?.naam || '—')}</td>
        ${toonAlpha ? `<td>${i.alpha_pct ?? '—'}</td>` : ''}
        <td>${i.hoeveelheid ?? '—'} ${i.eenheid || ''}</td>
        ${toonMout ? `<td>${i.kleur_ebc ?? '—'}</td><td>${totaalKg > 0 ? ((i.hoeveelheid || 0) / totaalKg * 100).toFixed(1) + '%' : '—'}</td>` : ''}
        <td>${escapeHtml(timingWeergave(i))}</td>
        ${toonHopEbu ? rendementCel + ebuCel : ''}
        ${toonHdt ? `<td>${(i.rol === 'hopgift_kook' && i.hdt) ? 'HDT ' + i.hdt : '—'}</td>` : ''}
        <td>${escapeHtml(i.notitie || '—')}</td>
      </tr>`;
    }).join('');

    const footerRow = toonMout ? `
      <tfoot><tr style="font-weight:bold; border-top: 2px solid var(--hop-dark);">
        <td>Total</td><td>${totaalKg.toFixed(1)} kg</td><td></td><td>100%</td><td colspan="2"></td>
      </tr></tfoot>` : (toonHopEbu ? `
      <tfoot><tr style="font-weight:bold; border-top: 2px solid var(--hop-dark);">
        <td colspan="${[kolomRol, true, toonAlpha, true, true].filter(Boolean).length}">Calculated total EBU</td>
        <td colspan="2">${totaalEbu.toFixed(1)}</td>
        <td colspan="${[toonHdt, true].filter(Boolean).length}"></td>
      </tr></tfoot>` : '');

    return `
      <table class="ing-table">
        <thead><tr>
          ${kolomRol ? '<th>Role</th>' : ''}<th>Name</th>${toonAlpha ? '<th>Alpha %</th>' : ''}<th>Amount</th>
          ${toonMout ? '<th>EBC</th><th>%</th>' : ''}<th>Timing</th>
          ${toonHopEbu ? '<th>Rendement %</th><th>EBU</th>' : ''}${toonHdt ? '<th>HDT</th>' : ''}<th>Note</th>
        </tr></thead>
        <tbody>${rows}</tbody>
        ${footerRow}
      </table>`;
  }

  // Calculated color: som van (kg * EBC * 0.08) / Brouwsel (hl) per moutregel,
  // + 1.75. Excel: Recept-voorblad!F30:F40.
  function berekenMoutKleur() {
    const moutRijen = ings.filter(i => i.rol === 'hoofdmout');
    if (moutRijen.length === 0 || !r.brouwsel_hl) return null;
    const totaalBijdrage = moutRijen.reduce((som, i) => {
      const kg = i.hoeveelheid || 0;
      const ebc = i.kleur_ebc || 0;
      return som + (kg * ebc * 0.08) / r.brouwsel_hl;
    }, 0);
    return totaalBijdrage + 1.75;
  }

  function hopSomHtml() {
    const hopRijen = ings.filter(i => i.rol === 'hopgift_kook' || i.rol === 'dry_hop');
    if (hopRijen.length === 0) return '<div class="empty">None added.</div>';
    const totalen = {};
    hopRijen.forEach(i => {
      const naam = i.ingredients?.naam || 'unknown';
      const key = naam + '|' + (i.eenheid || '');
      if (!totalen[key]) totalen[key] = { naam, eenheid: i.eenheid || '', totaal: 0 };
      totalen[key].totaal += (i.hoeveelheid || 0);
    });
    const rows = Object.values(totalen).map(t => `
      <div class="param-row">
        <span>${escapeHtml(t.naam)}</span>
        <span>${t.totaal}${t.eenheid ? ' ' + escapeHtml(t.eenheid) : ''}</span>
      </div>`).join('');
    return `<div class="param-columns param-columns-2">${rows}</div>`;
  }

  const vorigeVersiesHtml = (overigeVersies && overigeVersies.length > 0) ? `
    <div class="section-title">Previous versions</div>
    <table class="ing-table">
      <thead><tr><th>Version</th><th>Status</th><th></th></tr></thead>
      <tbody>
        ${overigeVersies.map(v => `
          <tr>
            <td>v${v.versie_major}.${v.versie_minor}</td>
            <td><span class="status-pill status-${v.status}">${statusLabel(v.status)}</span></td>
            <td><a class="action-pill" onclick="openDetail('${v.id}')">View &rarr;</a></td>
          </tr>`).join('')}
      </tbody>
    </table>` : '';

  const laatsteRevisie = revisieData.length > 0 ? revisieData[0] : null;

  const dryHopNotesRows = [
    ['Dry hop comment (warm)', pt.dry_hop_comment_warm, ''],
    ['Dry hop method (warm)', pt.dry_hop_methode_warm, ''],
    ['Dry hop comment (16°C)', pt.dry_hop_comment_16c, ''],
    ['Dry hop method (16°C)', pt.dry_hop_methode_16c, ''],
    ['Dry hop 1 at day', pt.dry_hop_1_dag, ''],
    ['Dry hop 2 at day', pt.dry_hop_2_dag, ''],
  ].filter(([,v]) => v !== null && v !== undefined && v !== '');

  const cellarNotesRows = [
    // 'Cellar addition day' bewust verborgen op verzoek van de gebruiker --
    // kolom blijft bestaan in recipe_processtappen.kelder_toevoeging_dag.
    ['Processing comment', pt.comment_verwerken, ''],
  ].filter(([,v]) => v !== null && v !== undefined && v !== '');

  const generalRows = [
    ['Short name', r.short_name, ''],
    ['Beer style', r.bierstijl, ''],
    ['Brouwsel', r.brouwsel_hl, 'hl'],
    ...(laatsteRevisie ? [
      ['Revisienummer', `v${laatsteRevisie.versie_major}.${laatsteRevisie.versie_minor}`, ''],
      ['Datum', laatsteRevisie.datum, ''],
      ['Door', laatsteRevisie.door, ''],
      ['Wijziging', laatsteRevisie.wijziging, ''],
    ] : []),
  ].filter(([,v]) => v !== null && v !== undefined && v !== '');

  const revisiesHtml = revisieData.length > 0 ? `
    <table class="ing-table">
      <thead><tr><th>Version</th><th>Date</th><th>By</th><th>Comment</th></tr></thead>
      <tbody>
        ${revisieData.map(rv => `
          <tr>
            <td>v${rv.versie_major}.${rv.versie_minor}</td>
            <td>${rv.datum || ''}</td>
            <td>${escapeHtml(rv.door || '')}</td>
            <td>${escapeHtml(rv.wijziging || '')}</td>
          </tr>`).join('')}
      </tbody>
    </table>` : '<div class="empty">No revision history yet.</div>';

  const moutKleur = berekenMoutKleur();

  container.innerHTML = `
    <h2 class="recipe-title">${escapeHtml(r.naam)}</h2>
    <div class="recipe-meta">
      <b>${escapeHtml(r.bierstijl || 'unknown style')}</b> · ${escapeHtml(locatieLabel(r.locatie))} ·
      version ${r.versie_major ?? 1}.${r.versie_minor ?? 0} · <span class="status-pill status-${r.status}">${statusLabel(r.status)}</span>
      ${magReceptBewerken ? ` <a class="edit-pill" href="recept-invoer.html?id=${r.id}">Edit &rarr;</a>` : ''}${magReceptVerwijderen ? ` <button type="button" id="delete-recipe-btn" class="edit-pill" style="background:#a33f2c; border:none; cursor:pointer; font:inherit; font-family:var(--mono);">Delete</button>` : ''}
    </div>

    <div class="section-title">General</div>
    ${paramColumnsHtml(generalRows) || '<div class="empty">None entered.</div>'}
    ${badgeRowsHtml(generalBadgeRows)}
    ${r.kleur ? `
      <div class="param-columns">
        <div class="param-row">
          <span>Recipe Color</span>
          <span style="display:inline-flex; align-items:center; gap:6px;">
            <span style="display:inline-block; width:16px; height:16px; border-radius:50%; background:${escapeHtml(r.kleur)}; box-shadow: inset 0 0 0 1px rgba(0,0,0,0.15);"></span>
            ${escapeHtml(r.kleur)}
          </span>
        </div>
      </div>` : ''}

    <div class="section-title">End product specifications</div>
    ${paramColumnsHtml(specRows) || '<div class="empty">None entered.</div>'}

    <div class="section-title">Process parameters</div>
    ${paramColumnsHtml(fermRows) || '<div class="empty">None entered.</div>'}

    <div class="section-title">Brewing parameters</div>
    ${paramSectiesHtml(brouwSecties) || '<div class="empty">None entered.</div>'}

    <div class="section-title">Malt &amp; Grains</div>
    ${ingTabelHtml(['hoofdmout'], false, false, false, true)}
    <p style="margin-top:-4px; color: var(--tekst-grijs, #555);">Calculated color: <strong>${moutKleur !== null ? moutKleur.toFixed(2) + ' EBC' : '—'}</strong></p>

    <div class="section-title">Hops and Herbs</div>
    ${ingTabelHtml(['hopgift_kook', 'dry_hop'], true, true, true, false, true)}
    ${paramColumnsHtml(dryHopNotesRows)}

    <div class="section-title">Hops total weights</div>
    ${hopSomHtml()}

    <div class="section-title">Additions Brewing</div>
    ${ingTabelHtml(['toegift_brouwerij'], false)}

    <div class="section-title">Yeasts</div>
    ${ingTabelHtml(['gist'], false)}

    <div class="section-title">Additions Cellar</div>
    ${ingTabelHtml(['toegift_kelder'], false)}
    ${paramColumnsHtml(cellarNotesRows)}

    <div class="section-title">Target water profile</div>
    ${paramColumnsHtml(waterRows) || '<div class="empty">None entered.</div>'}

    <div class="section-title">Packaging</div>
    ${paramColumnsHtml(verpakkingRows) || '<div class="empty">None entered.</div>'}
    ${(vp.formaten && vp.formaten.length > 0) ? `<div class="ing-table" style="padding:10px 14px; background:#fff;">${vp.formaten.map(f => `<span class="rol-tag" style="margin-right:10px;">${escapeHtml(f)}</span>`).join('')}</div>` : ''}

    <div class="section-title">Process steps</div>
    ${processtappenActief.length > 0
      ? `<div class="ing-table" style="padding:10px 14px; background:#fff;">${processtappenActief.map(l => `<span class="rol-tag" style="margin-right:10px;">${escapeHtml(l)}</span>`).join('')}</div>`
      : '<div class="empty">None checked.</div>'}

    <div class="section-title">Costs</div>
    ${paramColumnsHtml(kostenRows) || '<div class="empty">None entered.</div>'}

    <div class="section-title">Revision data</div>
    ${revisiesHtml}

    ${vorigeVersiesHtml}
  `;

  const deleteBtn = document.getElementById('delete-recipe-btn');
  if (deleteBtn) {
    deleteBtn.addEventListener('click', async () => {
      if (!confirm(`Are you sure you want to delete ${r.naam}?`)) return;
      deleteBtn.disabled = true;
      deleteBtn.textContent = 'Deleting…';
      const { error } = await supabaseClient.from('recipes').delete().eq('id', r.id);
      if (error) {
        alert('Could not delete: ' + error.message);
        deleteBtn.disabled = false;
        deleteBtn.textContent = 'Delete';
        return;
      }
      document.getElementById('detail-view').classList.remove('active');
      document.getElementById('list-view').style.display = 'block';
      await loadRecipes();
    });
  }
}

document.getElementById('back-btn').addEventListener('click', () => {
  document.getElementById('detail-view').classList.remove('active');
  document.getElementById('list-view').style.display = 'block';
  if (allRecipes.length === 0) loadRecipes();
});

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}
</script>

</body>
</html>
