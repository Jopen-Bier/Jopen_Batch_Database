<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jopen — Book in material</title>
<link rel="stylesheet" href="jopen-shared.css">
<style>
  /* Zelfde visuele taal als ingredienten.html/receptoverzicht.html/voorraad-overzicht.html. */
  :root {
    --ink: #1c2b26;
    --paper: #f6f4ee;
    --line: #d8d2c4;
    --hop: #4c6b4f;
    --hop-dark: #33473a;
    --amber: #b4772c;
    --mono: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, Helvetica, sans-serif;
    --serif: Arial, Helvetica, sans-serif;
  }
  main.vr-main { font-family: var(--serif); color: var(--ink); background: var(--paper); padding: 24px 32px 60px; max-width: 1100px; margin: 0 auto; }
  .vr-titel { font-size: 32px; margin: 0 0 4px; }
  .vr-meta { font-family: var(--mono); font-size: 13px; color: #6b6355; margin-bottom: 0; }
  .vr-back {
    font-family: var(--mono); font-size: 12px; font-weight: 700; color: var(--hop-dark); cursor: pointer;
    display: inline-flex; align-items: center; gap: 6px; text-decoration: none;
    border: 1.5px solid var(--hop-dark); border-radius: 20px; padding: 8px 18px;
    transition: background 0.15s, color 0.15s;
  }
  .vr-back:hover { background: var(--hop-dark); color: #fff; }

  section.vr-block {
    background: white; border: 1px solid var(--line); border-radius: 6px; padding: 22px 26px; margin-top: 24px; margin-bottom: 20px;
  }
  section.vr-block h2 {
    font-family: var(--mono); font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em;
    color: #6b6355; margin: 0 0 18px 0; padding-bottom: 10px; border-bottom: 2px solid var(--hop-dark);
  }
  .vr-field { margin-bottom: 14px; position: relative; }
  .vr-field label {
    display: block; font-size: 12px; text-transform: uppercase; letter-spacing: 0.04em;
    font-family: var(--mono); color: #6b6355; margin-bottom: 5px;
  }
  .vr-field input[type="text"], .vr-field input[type="number"], .vr-field input[type="date"], .vr-field select, .vr-field textarea {
    width: 100%; padding: 9px 11px; border: 1px solid var(--line); border-radius: 4px; font-size: 15px;
    font-family: var(--serif); box-sizing: border-box; background: #fff; color: var(--ink);
  }
  .vr-grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 18px; }
  .vr-grid3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 4px 18px; }
  .vr-checkbox-row { display: flex; align-items: center; gap: 8px; margin-bottom: 14px; font-size: 15px; }
  .vr-checkbox-row input { width: auto; }
  #vr-ontv-resultaten {
    position: absolute; z-index: 5; top: 100%; left: 0; right: 0;
    background: white; border: 1px solid var(--line); border-top: none; border-radius: 0 0 4px 4px;
    max-height: 220px; overflow-y: auto; display: none;
  }
  #vr-ontv-resultaten div { padding: 9px 11px; cursor: pointer; font-size: 15px; border-bottom: 1px solid #ece8dc; }
  #vr-ontv-resultaten div:hover { background: #faf8f2; }
  .vr-btn {
    background: var(--amber); color: white; border: none; padding: 10px 22px;
    border-radius: 6px; font-weight: 700; cursor: pointer; font-size: 14px; font-family: var(--serif);
  }
  .vr-btn:hover { background: #96601f; }
  .vr-btn:disabled { opacity: 0.4; cursor: default; background: var(--amber); }
  .vr-btn-secundair {
    background: none; border: 1.5px solid var(--line); color: var(--ink); border-radius: 4px;
    padding: 6px 14px; cursor: pointer; font-size: 13px; font-family: var(--serif);
  }
  .vr-btn-secundair:hover { border-color: var(--hop-dark); }
  #vr-ontv-melding { margin-left: 12px; font-size: 13px; }
  .vr-melding.fout { color: #a33f2c; }
  .vr-melding.ok { color: var(--hop-dark); }
  .vr-geen-rechten { color: #6b6355; font-size: 14px; }
  .bc-geen { color: #9a927f; cursor: default; }
</style>
</head>
<body>

  <div id="jopen-nav"></div>

  <main class="vr-main">
    <div style="display:flex; justify-content:space-between; align-items:flex-start; flex-wrap:wrap; gap:12px;">
      <div>
        <h1 class="vr-titel">Book in material — Receiving</h1>
        <p class="vr-meta">Register a newly received raw material lot.</p>
      </div>
      <a href="voorraad-overzicht.html" class="vr-back">&larr; Return to Stock overview</a>
    </div>

    <!-- ===================== ONTVANGST ===================== -->
    <div class="vr-tab-panel actief" data-tab="ontvangst">
      <section class="vr-block">
        <h2>Register a new lot</h2>
        <div id="vr-ontv-geen-rechten" class="vr-geen-rechten" style="display:none;">
          You need editor access to register a new lot.
        </div>
        <div id="vr-ontv-formulier">
          <div class="vr-field">
            <label for="vr-ontv-ingredient-zoek">Ingredient</label>
            <input type="text" id="vr-ontv-ingredient-zoek" placeholder="Search by ingredient name…" autocomplete="off" />
            <div id="vr-ontv-resultaten"></div>
          </div>

          <div class="vr-grid2">
            <div class="vr-field">
              <label for="vr-ontv-leverancier">Supplier</label>
              <input type="text" id="vr-ontv-leverancier" list="vr-ontv-leverancier-lijst" placeholder="Select or type a supplier…" />
              <datalist id="vr-ontv-leverancier-lijst"></datalist>
            </div>
            <div class="vr-field"><label for="vr-ontv-lotcode">Lot / batch code</label><input type="text" id="vr-ontv-lotcode" /></div>
          </div>
          <div class="vr-grid3">
            <div class="vr-field"><label for="vr-ontv-datum">Receiving date</label><input type="date" id="vr-ontv-datum" /></div>
            <div class="vr-field"><label for="vr-ontv-hoeveelheid">Quantity received</label><input type="number" step="0.001" id="vr-ontv-hoeveelheid" /></div>
            <div class="vr-field"><label for="vr-ontv-eenheid">Unit</label><select id="vr-ontv-eenheid"><option value="">—</option></select></div>
          </div>
          <div class="vr-grid3">
            <div class="vr-field"><label for="vr-ontv-colli">Number of packages</label><input type="text" id="vr-ontv-colli" placeholder="e.g. 2 boxes" /></div>
            <div class="vr-field"><label for="vr-ontv-locatie">Location</label><input type="text" id="vr-ontv-locatie" /></div>
            <div class="vr-field"><label for="vr-ontv-tht">Best-before date</label><input type="date" id="vr-ontv-tht" /></div>
          </div>
          <div class="vr-grid2">
            <div class="vr-field" id="vr-ontv-alpha-veld" style="display:none;">
              <label for="vr-ontv-alpha">Alpha % (this lot)</label>
              <input type="number" step="0.1" id="vr-ontv-alpha" />
            </div>
            <div class="vr-field">
              <label for="vr-ontv-ontvangen-door">Received by</label>
              <select id="vr-ontv-ontvangen-door"><option value="">Loading…</option></select>
            </div>
          </div>
          <div class="vr-checkbox-row"><input type="checkbox" id="vr-ontv-ontvangstcontrole" /><label for="vr-ontv-ontvangstcontrole" style="margin:0;">Receiving check done</label></div>
          <div class="vr-checkbox-row"><input type="checkbox" id="vr-ontv-ingangscontrole" /><label for="vr-ontv-ingangscontrole" style="margin:0;">Incoming check done</label></div>
          <div class="vr-field"><label for="vr-ontv-notitie">Notes</label><textarea id="vr-ontv-notitie" rows="2"></textarea></div>

          <button type="button" id="vr-ontv-btn" class="vr-btn" disabled>Register lot</button>
          <span id="vr-ontv-melding" class="vr-melding"></span>
        </div>
      </section>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="nav.js"></script>
  <script>
    let alleIngredienten = [];       // {id, naam, eenheid, leveranciers, usesAlphaPct}
    let magBewerken = false;
    let geselecteerdIngredientOntv = null;

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str ?? '';
      return div.innerHTML;
    }
    function vandaag() { return new Date().toISOString().slice(0, 10); }

    const VR_FYSIEKE_EENHEDEN = ['g', 'kg', 'ml', 'l', 'stuks'];
    function vrVulEenhedenSelect(select, eenheden, geselecteerd) {
      select.innerHTML = ['<option value="">—</option>']
        .concat(eenheden.map(e => `<option value="${e}" ${e === geselecteerd ? 'selected' : ''}>${e}</option>`)).join('');
    }

    // ---------------------------------------------------------------------
    // Gedeeld: ingredienten laden
    // ---------------------------------------------------------------------
    async function laadIngredienten() {
      const { data, error } = await supabaseClient
        .from('ingredients')
        .select('id, naam, category_id, eenheid, leverancier, leverancier_2, leverancier_3, ingredient_categories(uses_alpha_pct)')
        .eq('versie_status', 'huidig')
        .order('naam');
      if (error) { console.error('Kon ingrediënten niet laden:', error); return; }
      alleIngredienten = (data || []).map(i => ({
        id: i.id, naam: i.naam, eenheid: i.eenheid,
        leveranciers: [i.leverancier, i.leverancier_2, i.leverancier_3].filter(Boolean),
        usesAlphaPct: !!(i.ingredient_categories && i.ingredient_categories.uses_alpha_pct),
      }));
    }

    async function laadOntvangenDoorOpties() {
      const select = document.getElementById('vr-ontv-ontvangen-door');
      const { data, error } = await supabaseClient
        .from('gebruikers')
        .select('id, naam')
        .order('naam');
      if (error) { console.error('Kon gebruikerslijst niet laden:', error); select.innerHTML = '<option value="">—</option>'; return; }
      select.innerHTML = ['<option value="">—</option>']
        .concat((data || []).map(g => `<option value="${g.id}">${escapeHtml(g.naam)}</option>`)).join('');
    }

    // ---------------------------------------------------------------------
    // ONTVANGST
    // ---------------------------------------------------------------------
    function toonOntvResultaten(term) {
      const container = document.getElementById('vr-ontv-resultaten');
      const t = term.trim().toLowerCase();
      if (t === '') { container.style.display = 'none'; container.innerHTML = ''; return; }
      const matches = alleIngredienten.filter(i => i.naam.toLowerCase().includes(t)).slice(0, 25);
      container.innerHTML = matches.length
        ? matches.map(i => `<div data-id="${i.id}">${escapeHtml(i.naam)}</div>`).join('')
        : '<div class="bc-geen">No matches</div>';
      container.style.display = 'block';
    }
    document.getElementById('vr-ontv-ingredient-zoek').addEventListener('input', (e) => {
      geselecteerdIngredientOntv = null;
      werkOntvKnopBij();
      toonOntvResultaten(e.target.value);
    });
    document.getElementById('vr-ontv-resultaten').addEventListener('click', (e) => {
      const rij = e.target.closest('[data-id]');
      if (!rij) return;
      const ing = alleIngredienten.find(i => String(i.id) === rij.dataset.id);
      if (!ing) return;
      geselecteerdIngredientOntv = ing;
      document.getElementById('vr-ontv-ingredient-zoek').value = ing.naam;
      document.getElementById('vr-ontv-resultaten').style.display = 'none';
      document.getElementById('vr-ontv-alpha-veld').style.display = ing.usesAlphaPct ? 'block' : 'none';
      // Leverancier-datalist vullen met de tot-3 leveranciers van de ingredient-kaart
      // (Supplier #1/#2/#3) -- blijft een vrij invoerveld, dit is alleen een suggestielijst,
      // want een ontvangst kan altijd van een afwijkende leverancier komen.
      document.getElementById('vr-ontv-leverancier-lijst').innerHTML =
        ing.leveranciers.map(l => `<option value="${escapeHtml(l)}"></option>`).join('');
      // Unit vooraf invullen vanuit de ingredient-kaart. Bij additives staat hier een
      // tarief (bv. g/hl, de doseer-eenheid uit het recept) -- de fysieke voorraad-eenheid
      // is dan het deel vóór de "/" (g/hl -> g), dus die pakken we, niet de hele rate.
      const afgeleideEenheid = ing.eenheid ? ing.eenheid.split('/')[0] : '';
      if (afgeleideEenheid && VR_FYSIEKE_EENHEDEN.includes(afgeleideEenheid)) {
        document.getElementById('vr-ontv-eenheid').value = afgeleideEenheid;
      }
      werkOntvKnopBij();
    });
    document.addEventListener('click', (e) => {
      const wrap = document.getElementById('vr-ontv-ingredient-zoek');
      const results = document.getElementById('vr-ontv-resultaten');
      if (e.target !== wrap && !results.contains(e.target)) results.style.display = 'none';
    });

    function werkOntvKnopBij() {
      const hoeveelheid = document.getElementById('vr-ontv-hoeveelheid').value.trim();
      document.getElementById('vr-ontv-btn').disabled = !(magBewerken && geselecteerdIngredientOntv && hoeveelheid !== '');
    }
    ['vr-ontv-hoeveelheid'].forEach(id => document.getElementById(id).addEventListener('input', werkOntvKnopBij));

    document.getElementById('vr-ontv-datum').value = vandaag();

    document.getElementById('vr-ontv-btn').addEventListener('click', async () => {
      const melding = document.getElementById('vr-ontv-melding');
      if (!geselecteerdIngredientOntv) return;
      const { data: { session } } = await supabaseClient.auth.getSession();

      melding.textContent = 'Saving…'; melding.className = 'vr-melding';
      const { error } = await supabaseClient.from('grondstof_lots').insert({
        ingredient_id: geselecteerdIngredientOntv.id,
        leverancier: document.getElementById('vr-ontv-leverancier').value.trim() || null,
        lotcode: document.getElementById('vr-ontv-lotcode').value.trim() || null,
        ontvangstdatum: document.getElementById('vr-ontv-datum').value || vandaag(),
        hoeveelheid_ontvangen: Number(document.getElementById('vr-ontv-hoeveelheid').value),
        eenheid: document.getElementById('vr-ontv-eenheid').value.trim() || null,
        aantal_colli: document.getElementById('vr-ontv-colli').value.trim() || null,
        locatie: document.getElementById('vr-ontv-locatie').value.trim() || null,
        tht_datum: document.getElementById('vr-ontv-tht').value || null,
        alpha_pct: document.getElementById('vr-ontv-alpha-veld').style.display !== 'none'
          ? (document.getElementById('vr-ontv-alpha').value === '' ? null : Number(document.getElementById('vr-ontv-alpha').value))
          : null,
        ontvangstcontrole: document.getElementById('vr-ontv-ontvangstcontrole').checked,
        ingangscontrole: document.getElementById('vr-ontv-ingangscontrole').checked,
        notitie: document.getElementById('vr-ontv-notitie').value.trim() || null,
        ontvangen_door: document.getElementById('vr-ontv-ontvangen-door').value || null,
        aangemaakt_door: session?.user?.id ?? null,
      });

      if (error) {
        melding.textContent = 'Could not save: ' + error.message;
        melding.className = 'vr-melding fout';
        return;
      }
      melding.textContent = 'Lot registered.';
      melding.className = 'vr-melding ok';
      ['vr-ontv-leverancier','vr-ontv-lotcode','vr-ontv-hoeveelheid','vr-ontv-eenheid','vr-ontv-colli','vr-ontv-locatie','vr-ontv-tht','vr-ontv-alpha','vr-ontv-notitie']
        .forEach(id => document.getElementById(id).value = '');
      document.getElementById('vr-ontv-ontvangstcontrole').checked = false;
      document.getElementById('vr-ontv-ingangscontrole').checked = false;
      document.getElementById('vr-ontv-ingredient-zoek').value = '';
      document.getElementById('vr-ontv-alpha-veld').style.display = 'none';
      geselecteerdIngredientOntv = null;
      werkOntvKnopBij();
    });

    // ---------------------------------------------------------------------
    // Init
    // ---------------------------------------------------------------------
    window.addEventListener('DOMContentLoaded', async () => {
      const gebruiker = await getHuidigeGebruiker();
      magBewerken = !!gebruiker && await magBewerkenModule('inventory');

      document.getElementById('vr-ontv-geen-rechten').style.display = magBewerken ? 'none' : 'block';
      document.getElementById('vr-ontv-formulier').style.display = magBewerken ? 'block' : 'none';

      vrVulEenhedenSelect(document.getElementById('vr-ontv-eenheid'), VR_FYSIEKE_EENHEDEN);
      await laadIngredienten();
      await laadOntvangenDoorOpties();
      werkOntvKnopBij();
    });
  </script>
</body>
</html>
