<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jopen Brouwerij — Batch brewing</title>
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="stylesheet" href="jopen-shared.css" />
  <link rel="stylesheet" href="batch-report.css" />
</head>
<body class="br-page">

  <div id="jopen-nav"></div>

  <main class="br-main">
    <div id="bw-header" style="display:flex; flex-direction:column; gap:14px;"></div>
    <div class="br-message" id="bw-message">Loading batch…</div>
    <div id="bw-content" style="display:none; flex-direction:column; gap:16px;">
      <div class="br-row2">
        <div style="flex:1 1 340px; min-width:0; display:flex; flex-direction:column; gap:16px;">
          <div class="br-card br-cardpad" id="bw-brewday"></div>
          <div class="br-card br-cardpad" id="bw-recipe-comments"></div>
        </div>
        <div class="br-card br-cardpad" style="flex:3 1 600px; min-width:0;" id="bw-specs"></div>
      </div>
      <div class="br-grid2">
        <div class="br-card br-cardpad" id="bw-mash"></div>
        <div class="br-card br-cardpad" id="bw-additions"></div>
      </div>
      <div class="br-grid2">
        <div class="br-card br-cardpad" id="bw-yeast"></div>
        <div class="br-card br-cardpad" id="bw-comments"></div>
      </div>
      <div class="br-card br-cardpad" id="bw-log"></div>
      <div class="br-card br-cardpad" id="bw-results" style="max-width:820px;"></div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2"></script>
  <script src="config.js"></script>
  <script src="jopen-utils.js"></script>
  <script src="nav.js"></script>
  <script src="recipe-values.js"></script>
  <script src="batch-stages.js"></script>
  <script src="batch-ingredients.js"></script>
  <script src="batch-brews.js"></script>
  <script src="dosing-checks.js"></script>
  <script src="batch-report-shell.js"></script>
  <script src="batch-report-cards.js"></script>
  <script>
    const BREWERY_NAMES = { wp: 'Waarderpolder', jk: 'Jopenkerk' };
    const TRASH_ICON = '<svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M2.5 4h9M5.5 4V2.5h3V4M3.5 4l.6 8h5.8l.6-8"></path></svg>';

    const page = {
      user: null, canEdit: false, canDelete: false, ctx: null, save: null,
      brews: [], comments: [], users: [], initialsOf: () => '', tanks: [],
      brewing: {}, specs: {}, ferm: {}, recipeComments: [], ingredients: [], names: {}, dosingChecks: [],
      commentDraft: false,
    };
    const location_ = () => page.ctx.recipe.location;
    const fmt = (v, digits) => (v === null || v === undefined || v === '' ? '—'
      : Number(v).toLocaleString('en-GB', { maximumFractionDigits: digits ?? 2 }));
    const dis = () => (page.canEdit ? '' : ' disabled');

    function showMessage(text, isError) {
      const el = document.getElementById('bw-message');
      el.textContent = text;
      el.className = 'br-message' + (isError ? ' error' : '');
      el.style.display = text ? '' : 'none';
    }

    // ------------------------------------------------------------ loading
    async function loadAll(batchId) {
      [page.ctx] = await Promise.all([
        loadBatchContext(batchId),
        supabaseClient.rpc('snapshot_batch_ingredients', { p_batch_id: batchId }),
      ]);
      const recipeId = page.ctx.batch.recipe_id;
      const one = (table) => supabaseClient.from(table).select('*').eq('recipe_id', recipeId).maybeSingle();
      const [brews, comments, users, tanks, brewing, specs, ferm, recipeComments, ingredients, dosingChecks] = await Promise.all([
        supabaseClient.from('batch_brews').select('*').eq('batch_id', batchId).order('brew_number'),
        supabaseClient.from('batch_brew_comments').select('*').eq('batch_id', batchId).order('comment_time', { nullsFirst: false }).order('id'),
        loadUserInitials(),
        supabaseClient.from('tanks').select('id, code, tank_type, number, location, volume_hl, is_active').in('tank_type', ['glt', 'ckt', 'lt']).order('number'),
        one('recipe_brewing_specs'), one('recipe_specs'), one('recipe_fermentation'), one('recipe_comments'),
        supabaseClient.from('batch_ingredients').select('*').eq('batch_id', batchId)
          .in('addition_type', ['boil_hop', 'brewhouse_addition', 'yeast']).eq('is_removed', false).order('sort_order').order('id'),
        supabaseClient.from('batch_dosing_checks').select('*').eq('batch_id', batchId).not('batch_brew_id', 'is', null),
      ]);
      for (const res of [brews, comments, tanks, ingredients, dosingChecks]) if (res.error) throw res.error;
      page.dosingChecks = dosingChecks.data;
      page.brews = brews.data;
      page.comments = comments.data;
      page.users = users.users.filter((u) => u.is_active);
      page.initialsOf = users.initialsOf;
      page.tanks = tanks.data;
      page.brewing = brewing.data || {};
      page.specs = specs.data || {};
      page.ferm = ferm.data || {};
      page.recipeComments = ((recipeComments.data && recipeComments.data.comments) || [])
        .map((c) => String(c || '').trim()).filter((c) => c && c !== '0');
      page.ingredients = ingredients.data;
      const ids = [...new Set(page.ingredients.map((r) => r.ingredient_id).filter(Boolean))];
      if (ids.length) {
        const { data } = await supabaseClient.from('ingredients').select('id, name').in('id', ids);
        (data || []).forEach((i) => { page.names[i.id] = i.name; });
      }
    }

    // ------------------------------------------------------------ saving
    const renderSoon = createRenderer(() => renderAll());
    const dosing = createDosingChecks(() => ({
      batchId: page.ctx.batch.id, checks: page.dosingChecks, userId: page.user.id, canEdit: page.canEdit,
      saveStatus: page.save, initialsOf: page.initialsOf,
    }), renderSoon);
    const saveBatch = (patch) => saveRowPatch({ table: 'batches', row: page.ctx.batch, patch, saveStatus: page.save, renderSoon, stampUpdatedBy: false });
    const saveBrew = (row, patch) => saveRowPatch({ table: 'batch_brews', row, patch, saveStatus: page.save, renderSoon, userId: page.user.id });
    const saveComment = (row, patch) => saveRowPatch({ table: 'batch_brew_comments', row, patch, saveStatus: page.save, renderSoon, userId: page.user.id });

    async function insertRow(table, values, list) {
      page.save.saving();
      const { data, error } = await supabaseClient.from(table).insert({ ...values, updated_by: page.user.id }).select('*').single();
      if (error) { page.save.failed(error.message); return null; }
      list.push(data);
      page.save.saved();
      return data;
    }

    // Delete with confirm, then "deleted · Undo" which inserts the same row again.
    async function deleteRow(table, row, list, label) {
      const ok = await confirmDialog({ title: `Delete ${label}?`, text: 'You can undo this right after deleting. The deletion is recorded in the audit trail.' });
      if (!ok) return;
      page.save.saving();
      const { error } = await supabaseClient.from(table).delete().eq('id', row.id).select('id').single();
      if (error) { page.save.failed(error.message); return; }
      list.splice(list.indexOf(row), 1);
      page.save.saved();
      renderSoon();
      showUndoToast(label.charAt(0).toUpperCase() + label.slice(1), async () => {
        const { id, created_at, updated_at, ...values } = row;
        const restored = await insertRow(table, values, list);
        if (restored) { list.sort((a, b) => (a.brew_number ?? 0) - (b.brew_number ?? 0) || a.id - b.id); renderSoon(); }
      });
    }

    // The calculated total goes on the batch line (also shown on the Overview):
    // ml for the whole batch, all in the first brew; the calculation is its reason.
    const applyZinc = (row, dose) => saveRowPatch({ table: 'batch_ingredients', row, saveStatus: page.save, renderSoon, userId: page.user.id,
      patch: { unit: 'ml', quantity: dose.ml, all_in_first_brew: true, deviation_reason: dose.text } });

    // Brews on the first day (wishlist #22): stored once on the batch; filled in
    // at the yeast block or in the zinc calculator, it recalculates both the dry
    // yeast (ratio × hl × brews, in g) and the zinc sulphate lines.
    async function applyFirstDayBrews(n) {
      const hl = page.ctx.recipe.brew_volume_hl;
      await saveBatch({ first_day_brew_count: n });
      if (!n) return;
      const name = (r) => page.names[r.ingredient_id] || r.note;
      for (const row of page.ingredients.filter((r) => r.addition_type === 'yeast')) {
        const dose = yeastDose(yeastRatio(row), hl, n);
        if (dose) await saveRowPatch({ table: 'batch_ingredients', row, saveStatus: page.save, renderSoon, userId: page.user.id,
          patch: { unit: 'g', quantity: dose.g, deviation_reason: dose.text } });
      }
      const zinc = zincSulphateDose(hl, n);
      if (!zinc) return;
      for (const row of page.ingredients.filter((r) => r.addition_type === 'brewhouse_addition' && isZincSulphate(name(r)))) await applyZinc(row, zinc);
    }

    // ------------------------------------------------------------ extra addition (wishlist #29)
    // An ingredient added during brewing that is not in the recipe: an "Added"
    // batch line (also on the Overview); the tick boxes say which brews got it.
    let ingredientChoices = null;
    async function openAddAdditionDialog() {
      document.getElementById('bw-add-dialog')?.remove();
      if (!ingredientChoices) {
        const { data, error } = await fetchAllRows(supabaseClient.from('ingredients').select('id, name, unit').order('name'));
        if (error) { page.save.failed(error.message); return; }
        ingredientChoices = data;
      }
      const overlay = document.createElement('div');
      overlay.className = 'br-dialog-overlay';
      overlay.id = 'bw-add-dialog';
      overlay.innerHTML = `<div class="br-dialog" role="dialog" aria-modal="true" aria-labelledby="bw-add-title">
        <div class="br-dialog-title" id="bw-add-title">Extra addition</div>
        <div class="br-note">Not in the recipe, e.g. filtrase. It shows on the Overview as an added ingredient; tick the brews it went into.</div>
        <div class="br-field"><label class="br-label" for="bw-add-ingredient">Ingredient</label>
          <input class="br-input" id="bw-add-ingredient" list="bw-add-ingredients" placeholder="Search ingredient…" autocomplete="off">
          <datalist id="bw-add-ingredients">${ingredientChoices.map((i) => `<option value="${escapeHtml(i.name)}"></option>`).join('')}</datalist></div>
        <div style="display:flex; gap:10px;">
          <div class="br-field" style="flex:1;"><label class="br-label" for="bw-add-qty">Amount</label><input class="br-input" id="bw-add-qty" inputmode="decimal"></div>
          <div class="br-field" style="width:110px;"><label class="br-label" for="bw-add-unit">Unit</label>
            <select class="br-input" id="bw-add-unit">${['g', 'kg', 'ml', 'l', 'pcs'].map((u) => `<option>${u}</option>`).join('')}</select></div>
        </div>
        <div class="br-field"><span class="br-label">Amount is</span><div class="br-seg" role="group" id="bw-add-basis">
          <button type="button" data-basis="brew" class="on">Per brew</button><button type="button" data-basis="batch">Per batch</button></div></div>
        <div class="br-field"><label class="br-label" for="bw-add-timing">Moment</label><input class="br-input" id="bw-add-timing" placeholder="e.g. Mash-in, Whirlpool"></div>
        <span class="br-note" id="bw-add-note"></span>
        <div class="br-dialog-buttons">
          <button type="button" class="br-ghost" id="bw-add-close">Cancel</button>
          <button type="button" class="br-primary" id="bw-add-save">Add</button>
        </div></div>`;
      let basis = 'brew';
      const q = (sel) => overlay.querySelector(sel);
      const close = () => { overlay.remove(); document.removeEventListener('keydown', onKey); };
      const onKey = (e) => { if (e.key === 'Escape') close(); };
      overlay.addEventListener('click', (e) => {
        if (e.target === overlay) return close();
        const b = e.target.closest('button[data-basis]');
        if (b) { basis = b.dataset.basis; overlay.querySelectorAll('button[data-basis]').forEach((x) => x.classList.toggle('on', x === b)); }
      });
      q('#bw-add-ingredient').addEventListener('change', () => {
        const ing = ingredientChoices.find((i) => i.name === q('#bw-add-ingredient').value);
        const base = ing && String(ing.unit || '').split('/')[0].trim();
        if (base && [...q('#bw-add-unit').options].some((o) => o.value === base)) q('#bw-add-unit').value = base;
      });
      q('#bw-add-close').addEventListener('click', close);
      q('#bw-add-save').addEventListener('click', async () => {
        const ing = ingredientChoices.find((i) => i.name === q('#bw-add-ingredient').value);
        const quantity = parseNumberInput(q('#bw-add-qty').value);
        if (!ing) { q('#bw-add-note').textContent = 'Choose an ingredient from the list.'; return; }
        if (!(quantity > 0)) { q('#bw-add-note').textContent = 'Enter an amount above 0.'; return; }
        const sortOrder = Math.max(0, ...page.ingredients.filter((r) => r.addition_type === 'brewhouse_addition').map((r) => r.sort_order || 0)) + 1;
        const row = await insertRow('batch_ingredients', {
          batch_id: page.ctx.batch.id, is_added: true, addition_type: 'brewhouse_addition', ingredient_id: ing.id,
          quantity, unit: extraAdditionUnit(q('#bw-add-unit').value, basis), timing: q('#bw-add-timing').value.trim() || null,
          sort_order: sortOrder, updated_by: page.user.id,
        }, page.ingredients);
        if (!row) return;
        page.names[ing.id] = ing.name;
        close();
        renderSoon();
      });
      document.addEventListener('keydown', onKey);
      document.body.appendChild(overlay);
      q('#bw-add-ingredient').focus();
    }

    async function addBrew() {
      const brew = await insertRow('batch_brews', { batch_id: page.ctx.batch.id, brew_number: nextBrewNumber(page.brews), brewer_id: page.user.id }, page.brews);
      if (brew) renderSoon(`[data-brew="${brew.id}"][data-field="software_order_number"]`);
    }

    // ------------------------------------------------------------ rendering
    function renderAll() {
      renderBrewDay();
      renderSpecs();
      renderMashAndAdditions();
      renderYeast();
      renderComments();
      renderLog();
      renderResults();
    }

    const kr = (label, value) => `<div class="br-kr"><span class="k">${label}</span><span class="c">${value}</span></div>`;
    const kv = (label, value, unit) => `<div class="br-kv br-kv3"><span class="k">${escapeHtml(label)}</span>
      <span class="v">${escapeHtml(value === null || value === undefined || value === '' ? '—' : String(value))}</span><span class="u">${escapeHtml(unit || '')}</span></div>`;

    function renderBrewDay() {
      const { batch, recipe } = page.ctx;
      const loc = location_();
      const brews = Number(batch.brew_count) || 0;
      const hl = Number(recipe.brew_volume_hl) || null;
      const softwareName = loc === 'jk' ? page.brewing.brewhouse_recipe_name_jk : page.brewing.brewhouse_recipe_name_wp;
      const tankTypes = loc === 'jk' ? ['ckt'] : ['glt', 'lt'];
      const tanks = page.tanks.filter((t) => (t.location === loc || !loc) && tankTypes.includes(t.tank_type) && (t.is_active || t.id === batch.glt_tank_id));
      const firstStart = page.brews.map((b) => b.mash_in_started_at).filter(Boolean).sort()[0];
      document.getElementById('bw-brewday').innerHTML = `
        <div class="br-label">Brew day</div>
        ${kr('Brewhouse <span class="br-note">· from recipe</span>', escapeHtml(BREWERY_NAMES[loc] || '—'))}
        ${kr('Recipe name software', `<span style="font-size:12px;">${escapeHtml(softwareName || '—')}</span>`)}
        ${loc === 'wp' && (page.brewing.special_bin_load_kg || page.brewing.special_bin_name)
          ? kr('Special bin dump', escapeHtml(`${page.brewing.special_bin_load_kg ? fmt(page.brewing.special_bin_load_kg) + ' kg' : ''}${page.brewing.special_bin_name ? ' · ' + page.brewing.special_bin_name : ''}`)) : ''}
        ${kr('Brews', escapeHtml(`${fmt(brews)}${hl ? ` × ${fmt(hl)} hl = ${fmt(brews * hl, 1)} hl` : ''}`))}
        <div style="display:flex; gap:12px; padding-top:6px; flex-wrap:wrap;">
          <div class="br-field" style="width:150px; padding-top:0;"><label class="br-label" for="bw-glt">${loc === 'jk' ? 'CKT' : 'GLT'}</label>
            <select id="bw-glt" class="br-input"${dis()}>
              <option value="">—</option>
              ${tanks.map((t) => `<option value="${t.id}"${t.id === batch.glt_tank_id ? ' selected' : ''}>${escapeHtml(t.code)} · ${fmt(t.volume_hl)} hl</option>`).join('')}
            </select></div>
          ${loc === 'jk' ? `<div class="br-field" style="width:170px; padding-top:0;"><label class="br-label" for="bw-braukon">Recipe number Braukon</label>
            <input id="bw-braukon" value="${escapeHtml(batch.brewhouse_recipe_number || '')}"${dis()}></div>` : ''}
          <div class="br-field" style="flex:1; min-width:150px; padding-top:0;"><span class="br-label">Date first brew</span>
            <div class="br-calc-box">${escapeHtml(firstStart ? formatDate(firstStart) : 'Not started')}</div></div>
        </div>`;
      document.getElementById('bw-recipe-comments').innerHTML = `
        <div class="br-label">Recipe comments</div>
        ${page.recipeComments.length ? page.recipeComments.map((c) => `<div class="br-recipe-note">${escapeHtml(c)}</div>`).join('') : '<div class="br-note">No comments in the recipe.</div>'}`;
    }

    function renderSpecs() {
      const w = page.brewing, s = page.specs, f = page.ferm, loc = location_();
      const sparges = [w.sparge_1, w.sparge_2, w.sparge_3, w.sparge_4].filter((x) => x !== null && x !== undefined);
      const range = (v) => (v === null || v === undefined || v === '' ? null : String(v).replace(/\s*-\s*/, ' – '));
      document.getElementById('bw-specs').innerHTML = `
        <div class="br-label">Brew specifications · from recipe</div>
        <div class="br-specs">
          <div>
            <div class="br-kv br-kv3 hd"><span class="k">Brewhouse settings</span><span class="v">Spec</span><span class="u">Unit</span></div>
            ${kv('Mash water', w.mash_water, 'hl')}
            ${kv('Mash thickness', w.mash_thickness ? '1 : ' + fmt(w.mash_thickness) : null, '')}
            ${kv('Expected extract start boil', w.expected_extract_boil_start, '°P')}
            ${kv('Volume boil', w.boil_volume, 'hl')}
            ${kv('Wort pre-cooler temp.', w.wort_precooler_temp, '°C')}
            ${kv('Desired evaporation', w.target_evaporation, '%')}
            ${kv('Boil intensity', w.boil_intensity, 'kJ/s')}
            ${kv('Whirlpool rest', w.whirlpool_rest, 'min')}
            ${loc === 'jk'
              ? kv('Lauter factor', w.lauter_factor, '') + kv('First runnings · sparge water · sparge runnings', [w.first_wort, w.sparge_water, w.sparge_runoff].map((x) => fmt(x)).join(' · '), 'hl') + kv('Total filtered volume', w.total_lautered_volume, 'hl')
              : kv('Chambers mash filter', w.mash_filter_chambers, '') + kv('Sparging ' + sparges.map((_, i) => ['1st', '2nd', '3rd', '4th'][i]).join(' · '), sparges.length ? sparges.map((x) => fmt(x)).join(' · ') : null, 'hl/h')}
          </div>
          <div>
            <div class="br-kv br-kv3 hd"><span class="k">Recipe targets</span><span class="v">Spec</span><span class="u">Unit</span></div>
            ${kv('Desired original gravity', s.original_extract, '°P')}
            ${kv('Desired final gravity', s.final_extract, '°P')}
            ${kv('pH mash', range(w.ph_mash), '')}
            ${kv('pH start boil', range(w.ph_boil_start), '')}
            ${kv('pH end boil', range(w.ph_boil_end), '')}
            ${kv('Aeration', w.aeration, 'ppm')}
            ${kv('Wort to GLT temp.', f.pitching_temp, '°C')}
            ${loc === 'jk' ? '' : kv('Cumulative sparging volume', w.cumulative_sparge_volume, 'hl') + kv('Auto dosing acid · boil / inline sparge', w.boil_acid_l != null || w.inline_sparge_acid_l != null ? `${fmt(w.boil_acid_l)} / ${fmt(w.inline_sparge_acid_l)}` : null, 'l')}
          </div>
        </div>`;
    }

    function renderMashAndAdditions() {
      const w = page.brewing;
      const steps = [['Mash-in', w.mash_in_temp, w.mash_in_time], ['Raise to', w.mash_step1_temp, w.mash_step1_time], ['Raise to', w.mash_step2_temp, w.mash_step2_time],
        ['Raise to', w.mash_step3_temp, w.mash_step3_time], ['Raise to', w.mash_step4_temp, w.mash_step4_time], ['Mash-out', w.mash_out_temp, w.mash_out_time]]
        .filter((x) => x[1] !== null && x[1] !== undefined);
      const arrow = '<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="#a89f8e" stroke-width="2" aria-hidden="true"><path d="M5 3l5 5-5 5"></path></svg>';
      const hops = page.ingredients.filter((r) => r.addition_type === 'boil_hop')
        .sort((a, b) => (boilTimeMin(b.timing) ?? -1) - (boilTimeMin(a.timing) ?? -1) || (a.sort_order ?? 0) - (b.sort_order ?? 0));
      const name = (r) => page.names[r.ingredient_id] || r.note || '(no ingredient)';
      document.getElementById('bw-mash').innerHTML = `
        <div class="br-label">Mash schedule</div>
        ${steps.length ? `<div class="br-steps">${steps.map((x, i) => `${i ? arrow : ''}<div class="br-step${x[0] === 'Mash-out' ? ' out' : ''}"><span>${x[0]}</span><b>${fmt(x[1])} °C</b><span>${x[2] !== null && x[2] !== undefined ? fmt(x[2]) + ' min' : '—'}</span></div>`).join('')}</div>`
          : '<div class="br-note">No mash schedule in the recipe.</div>'}
        <div class="br-label" style="margin-top:6px;">Hop dosing · per brew</div>
        <table class="br-ing"><thead><tr><th style="width:52px;">Min</th><th>Hop</th><th class="r" style="width:80px;">Gram</th><th style="width:52px;">HDT</th></tr></thead>
          <tbody>${hops.map((r) => `<tr><td class="n">${escapeHtml(boilTimeMin(r.timing) ?? r.timing ?? '—')}</td><td>${escapeHtml(name(r))}</td>
            <td class="n">${fmt(r.quantity, 0)}</td><td class="small">${r.hop_dosing_tank ? 'HDT ' + r.hop_dosing_tank : 'No'}</td></tr>`).join('')
            || '<tr><td colspan="4" class="small">No boil hops.</td></tr>'}</tbody></table>`;
      const ctx = amountContext(page.ctx.batch, page.ctx.recipe, page.ctx.stageRow);
      // zinc sulphate always last, under a thick line, with its calculator (Jaap, 23-10)
      // extra additions per batch sit under the zinc sulphate (wishlist #29)
      const adds = brewingAdditionOrder(page.ingredients.filter((r) => r.addition_type === 'brewhouse_addition'), name);
      const firstZinc = adds.find((r) => isZincSulphate(name(r)));
      const firstPerBatch = adds.find((r) => isPerBatchAddition(r));
      const ticked = (r) => page.dosingChecks.filter((c) => c.batch_ingredient_id === r.id && c.batch_brew_id).length;
      // a tick box per brew (batch_dosing_checks); a line "brew 1 only" has one in brew 1
      const brews = page.brews.slice().sort((a, b) => a.brew_number - b.brew_number);
      const progress = dosingProgress(adds, 'brew', (r) => brewColumns(r, brews).filter((c) => c.applies).map((c) => c.brew.id), page.dosingChecks);
      document.getElementById('bw-additions').innerHTML = `
        <div class="br-head" style="align-items:baseline;"><div class="br-label">Additions brewers · per brew</div>
          ${progress.total ? `<span class="br-note${progress.done === progress.total ? ' bd-done' : ''}">${progress.done}/${progress.total} added</span>` : ''}</div>
        <div class="br-table-wrap"><table class="br-ing" style="min-width:${480 + brews.length * 70}px;"><thead><tr><th>Addition</th><th class="r" style="width:150px;">Amount</th><th style="width:150px;">Moment</th>
          ${brews.map((b) => `<th class="bd-check">Brew ${b.brew_number}</th>`).join('')}</tr></thead>
          <tbody>${adds.map((r) => {
            const amount = r.all_in_first_brew ? batchAmount(r.addition_type, r.unit, r.quantity, ctx) : brewAmount(r.addition_type, r.unit, r.quantity, ctx);
            const zinc = isZincSulphate(name(r));
            const calc = zinc && page.canEdit ? ` <button type="button" class="br-ghost bw-calc" data-zinc-calc="${r.id}" title="Calculate zinc sulphate">Calculate</button>` : '';
            const perBatch = isPerBatchAddition(r);
            const total = r.is_added ? addedTotal(r, ticked(r)) : null;
            const note = r.all_in_first_brew ? ' <span class="br-note">brew 1 only</span>'
              : perBatch ? ' <span class="br-note">batch total</span>'
                : r.is_added && total ? ` <span class="br-note">· ${ticked(r)} ${ticked(r) === 1 ? 'brew' : 'brews'} = ${escapeHtml(formatAmount(total))}</span>` : '';
            const divider = (r === firstZinc && adds[0] !== r) || (r === firstPerBatch && adds[0] !== r);
            return `<tr${divider ? ' class="bw-zinc"' : ''}><td>${escapeHtml(name(r))}${r.is_added ? '<span class="br-added">Added</span>' : ''}${calc}</td><td class="n">${escapeHtml(formatAmount(perBatch ? { q: toNumber(r.quantity), unit: r.unit } : amount))}${note}</td><td>${escapeHtml(r.timing || '—')}</td>
              ${brewColumns(r, brews).map((c) => (c.applies ? dosing.cellHtml(r, 'brew', c.brew.id) : '<td class="bd-check small">—</td>')).join('')}</tr>`;
          }).join('') || `<tr><td colspan="${3 + brews.length}" class="small">No brewing additions.</td></tr>`}</tbody></table></div>
        ${adds.length && !brews.length ? '<div class="br-note">A tick column appears for every brew you add.</div>' : ''}
        ${page.canEdit ? '<div class="br-buttons"><button class="br-ghost" type="button" id="bw-add-addition">+ Add</button></div>' : ''}`;
    }

    function yesNo(id, value) {
      return `<div class="br-seg" role="group">
        <button type="button" data-yesno="${id}" data-value="true" class="${value === true ? 'on' : ''}"${dis()}>Yes</button>
        <button type="button" data-yesno="${id}" data-value="false" class="${value === false ? 'on' : ''}"${dis()}>No</button></div>`;
    }

    function userOptions(selected) {
      return '<option value="">—</option>' + page.users.map((u) =>
        `<option value="${u.id}"${u.id === selected ? ' selected' : ''}>${escapeHtml(u.initials || '')} · ${escapeHtml(u.name)}</option>`).join('');
    }

    function renderYeast() {
      const b = page.ctx.batch;
      const ctx = amountContext(b, page.ctx.recipe, page.ctx.stageRow);
      const yeasts = page.ingredients.filter((r) => r.addition_type === 'yeast');
      const strain = yeasts.map((r) => page.names[r.ingredient_id] || r.note).filter(Boolean).join(' + ') || '—';
      // until "Brews on the first day" is filled in only the ratio is known (wishlist #22)
      const weight = yeasts.map((r) => {
        if (/\/hl$/.test(r.unit || '')) return `${fmt(r.quantity)} ${escapeHtml(r.unit)} <span class="br-note">· fill in the brews on the first day</span>`;
        const a = batchAmount('yeast', r.unit, r.quantity, ctx);
        return a ? `${formatAmount(a)}${isCalculatedOnBrewDay(r) ? ` <span class="br-note">(${escapeHtml(r.deviation_reason.replace(/^Calculated on brew day: /, '').replace(/, rounded up to .*$/, ', rounded up to 500 g'))})</span>` : ''}` : '—';
      }).join(' + ') || '—';
      document.getElementById('bw-yeast').innerHTML = `
        <div class="br-label">Dry yeast pitching</div>
        ${kr('Yeast strain', escapeHtml(strain))}
        ${kr('Brews on the first day', `<input class="br-in" id="bw-first-day-brews" inputmode="numeric" style="width:80px;" value="${escapeHtml(b.first_day_brew_count ?? '')}" aria-label="Brews on the first day"${dis()}>`)}
        ${kr('Weight', weight)}
        ${kr('Temp. start · temp. max', escapeHtml(`${fmt(page.ferm.pitching_temp)} °C · ${fmt(page.ferm.main_ferm_temp)} °C`))}
        <div style="display:flex; gap:12px 22px; padding-top:6px; flex-wrap:wrap; align-items:flex-end;">
          <div class="br-field" style="padding-top:0;"><span class="br-label">Yeast Beast used?</span>${yesNo('yeast_rehydrated', b.yeast_rehydrated)}</div>
          <div class="br-field" style="padding-top:0;"><span class="br-label">At 1st brew?</span>${yesNo('yeast_with_first_brew', b.yeast_with_first_brew)}</div>
          <div class="br-field" style="padding-top:0;"><span class="br-label">Temperature GLT checked?</span>${yesNo('yeast_program_on', b.yeast_program_on)}</div>
          <div class="br-field" style="width:160px; padding-top:0;"><label class="br-label" for="bw-pitched-on">Pitched on</label>
            <input id="bw-pitched-on" type="date" value="${escapeHtml(b.yeast_pitched_on || '')}"${dis()}></div>
          <div class="br-field" style="width:200px; padding-top:0;"><label class="br-label" for="bw-pitched-by">Pitched by</label>
            <select id="bw-pitched-by" class="br-input"${dis()}>${userOptions(b.yeast_pitched_by)}</select></div>
        </div>`;
    }

    function renderComments() {
      const brewOptions = (selected) => '<option value="">All</option>' + page.brews.map((b) =>
        `<option value="${b.brew_number}"${b.brew_number === selected ? ' selected' : ''}>Brew ${b.brew_number}</option>`).join('');
      const row = (c) => `<tr>
        <td style="width:96px;"><input class="br-in l" type="time" data-comment="${c.id}" data-field="comment_time" value="${escapeHtml((c.comment_time || '').slice(0, 5))}" aria-label="Time"${dis()}></td>
        <td style="width:96px;"><select class="br-in" data-comment="${c.id}" data-field="brew_number" aria-label="Brew"${dis()}>${brewOptions(c.brew_number)}</select></td>
        <td><textarea class="br-in l br-textarea" rows="1" data-comment="${c.id}" data-field="comment" aria-label="Comment" placeholder="What happened, deviations, actions…"${dis()}>${escapeHtml(c.comment)}</textarea></td>
        <td class="small" style="width:46px; text-align:center;">${escapeHtml(page.initialsOf(c.created_by))}</td>
        <td style="width:34px;">${page.canDelete ? `<button class="br-del" type="button" data-delete-comment="${c.id}" aria-label="Delete comment">${TRASH_ICON}</button>` : ''}</td></tr>`;
      const draft = page.commentDraft ? `<tr>
        <td><input class="br-in l" type="time" id="bw-draft-time" aria-label="Time"></td>
        <td><select class="br-in" id="bw-draft-brew" aria-label="Brew">${brewOptions(null)}</select></td>
        <td><textarea class="br-in l br-textarea" rows="1" id="bw-draft-comment" aria-label="Comment" placeholder="What happened, deviations, actions… (saved when you leave the field)"></textarea></td>
        <td class="small" style="text-align:center;">${escapeHtml(page.initialsOf(page.user.id))}</td><td></td></tr>` : '';
      document.getElementById('bw-comments').innerHTML = `
        <div class="br-label">Brewer's comments · brew day</div>
        <table class="br-ing"><thead><tr><th>Time</th><th>Brew</th><th>Comment</th><th>Op.</th><th></th></tr></thead>
          <tbody>${page.comments.map(row).join('')}${draft}${page.comments.length || page.commentDraft ? '' : '<tr><td colspan="5" class="small">No comments yet.</td></tr>'}</tbody></table>
        ${page.canEdit ? '<div><button class="br-ghost" type="button" id="bw-add-comment">+ Comment</button></div>' : ''}`;
    }

    function cellHtml(row, brew, calc) {
      if (row.kind === 'calc') {
        let v = '—';
        if (row.key === 'evaporation_pct' && calc.evaporationPct !== null) v = calc.evaporationPct.toFixed(1);
        if (row.key === 'volume_to_glt_hl' && calc.volumeToGltHl !== null) v = calc.volumeToGltHl.toFixed(1);
        if (row.key === 'extract_to_glt' && calc.extractToGlt !== null) v = calc.extractToGlt.toFixed(2);
        if (row.key === 'total_brewing_h' && calc.totalBrewingH !== null) v = calc.totalBrewingH.toFixed(1);
        if (row.key === 'glt_total' && calc.glt.volumeHl) v = `${calc.glt.volumeHl.toFixed(1)} hl · ${calc.glt.extract.toFixed(2)} °P`;
        return `<td class="cv${row.key === 'glt_total' ? ' small-calc' : ''}">${escapeHtml(v)}</td>`;
      }
      const attrs = `data-brew="${brew.id}" data-field="${row.key}" aria-label="${escapeHtml(row.label)} · brew ${brew.brew_number}"${dis()}`;
      const value = brew[row.key];
      if (row.kind === 'yesno') {
        return `<td><select class="br-in" ${attrs}><option value="">—</option><option value="true"${value === true ? ' selected' : ''}>Yes</option><option value="false"${value === false ? ' selected' : ''}>No</option></select></td>`;
      }
      if (row.kind === 'select') {
        return `<td><select class="br-in" ${attrs}><option value="">—</option>${row.options.map((o) => `<option${o === value ? ' selected' : ''}>${escapeHtml(o)}</option>`).join('')}</select></td>`;
      }
      if (row.kind === 'user') return `<td><select class="br-in" ${attrs}>${userOptions(value)}</select></td>`;
      if (row.kind === 'datetime') return `<td><input class="br-in l" type="datetime-local" ${attrs} value="${escapeHtml(toDateTimeLocal(value))}"></td>`;
      if (row.kind === 'text') return `<td><input class="br-in l" ${attrs} value="${escapeHtml(value || '')}"></td>`;
      const input = `<input class="br-in" inputmode="decimal" ${attrs} value="${escapeHtml(value === null || value === undefined ? '' : String(value))}">`;
      // start/end time popup → minutes (wishlist #24)
      if (row.timeSpan && page.canEdit) {
        return `<td><div class="bw-span">${input}<button type="button" class="br-ghost bw-span-btn" data-span-brew="${brew.id}" data-span-field="${row.key}" title="From start and end time" aria-label="${escapeHtml(row.label)} from start and end time · brew ${brew.brew_number}">⏱</button></div></td>`;
      }
      return `<td>${input}</td>`;
    }

    function recipeValue(key) {
      if (!key) return '';
      const v = key === 'original_extract' ? page.specs.original_extract
        : key === 'brew_volume_hl' ? page.ctx.recipe.brew_volume_hl
        : key === 'pitching_temp' ? page.ferm.pitching_temp
        : page.brewing[key];
      return v === null || v === undefined ? '' : String(v).replace(/\s*-\s*/, ' – ');
    }

    function renderLog() {
      const rows = brewLogRows(location_());
      const calcs = brewCalculations(page.brews);
      const planned = Math.ceil(Number(page.ctx.batch.brew_count) || 0);
      const span = 3 + page.brews.length;
      const head = page.brews.map((b) => `<th class="br-brewcol"><div class="br-brewhead"><span>Brew ${b.brew_number}</span>
        ${page.canDelete ? `<button class="br-del" type="button" data-delete-brew="${b.id}" aria-label="Delete brew ${b.brew_number}">${TRASH_ICON}</button>` : ''}</div></th>`).join('');
      const body = rows.map((r) => {
        if (r.kind === 'section') return `<tr class="sec"><td colspan="${span}">${escapeHtml(r.label)}</td></tr>`;
        return `<tr><td class="p">${escapeHtml(r.label)}</td><td class="u">${escapeHtml(r.unit || '')}</td><td class="r">${escapeHtml(recipeValue(r.recipe))}</td>
          ${page.brews.map((b, i) => cellHtml(r, b, calcs[i])).join('')}</tr>`;
      }).join('');
      document.getElementById('bw-log').innerHTML = `
        <div class="br-head" style="align-items:center;">
          <div class="br-label">Brew log · fill in on the brew day</div>
          <span class="br-note">${page.brews.length} of ${planned} ${planned === 1 ? 'brew' : 'brews'}</span>
          ${page.canEdit ? `<button class="br-primary" type="button" id="bw-add-brew">+ Add brew</button>` : ''}
        </div>
        ${page.brews.length ? `<div class="br-table-wrap"><table class="br-matrix">
          <thead><tr><th class="br-paramcol">Parameter</th><th>Unit</th><th class="r">Recipe</th>${head}</tr></thead>
          <tbody>${body}</tbody></table></div>`
          : `<div class="br-note">No brews yet.${page.canEdit ? ' "Add brew" starts the log of brew 1; its start of mashing moves the batch to Brewing.' : ''}</div>`}
        <div class="br-note">Grey cells are calculated. Volume and extract to GLT include the water addition; the GLT total is volume-weighted over all brews.</div>`;
    }

    function renderResults() {
      const calcs = brewCalculations(page.brews);
      const og = page.specs.original_extract;
      const ogTol = toleranceValue(page.specs.original_extract_tol);
      const hl = page.ctx.recipe.brew_volume_hl;
      const badge = (ok) => (ok === null ? '<span class="br-note">—</span>' : `<span class="br-okbadge ${ok ? 'ok' : 'bad'}">${ok ? 'OK' : 'Out'}</span>`);
      const last = calcs[calcs.length - 1];
      // The GLT total is the result that counts (Jaap, 23-10): in spec on extract and volume.
      const total = gltTotalCheck(last ? last.glt : null, og, page.specs.original_extract_tol, hl);
      const verdict = total.extractOk === null && total.volumeOk === null ? ''
        : total.extractOk !== false && total.volumeOk !== false
          ? '<span class="br-okbadge ok bw-verdict">✓ GLT total in spec</span>'
          : `<span class="br-okbadge bad bw-verdict">GLT total out of spec · ${[total.extractOk === false ? 'extract' : null, total.volumeOk === false ? 'volume' : null].filter(Boolean).join(' + ')}</span>`;
      document.getElementById('bw-results').innerHTML = `
        <div class="br-head" style="align-items:center;"><div class="br-label">Result per brew · at GLT</div>${verdict}</div>
        <table class="br-ing"><thead><tr><th>Brew</th><th class="r">°P at GLT</th><th>vs ${escapeHtml(fmt(og, 1))}${ogTol !== null ? ' ±' + fmt(ogTol) : ''}</th>
          <th class="r">hl at GLT</th><th>vs ${escapeHtml(fmt(hl))} ±${VOLUME_TOL_HL}</th><th class="r">pH</th></tr></thead>
          <tbody>${calcs.map((c, i) => `<tr><td><b>Brew ${c.brewNumber}</b></td>
            <td class="n">${c.extractToGlt !== null ? c.extractToGlt.toFixed(2) : '—'}</td><td>${badge(withinSpec(c.extractToGlt, og, ogTol))}</td>
            <td class="n">${c.volumeToGltHl !== null ? c.volumeToGltHl.toFixed(1) : '—'}</td><td>${badge(withinSpec(c.volumeToGltHl, hl, VOLUME_TOL_HL))}</td>
            <td class="n">${escapeHtml(fmt(page.brews.find((b) => b.brew_number === c.brewNumber).whirlpool_ph))}</td></tr>`).join('')}
            <tr class="tot"><td>GLT total</td><td class="n">${last && last.glt.extract !== null ? last.glt.extract.toFixed(2) : '—'}</td><td>${badge(total.extractOk)}</td>
              <td class="n">${last && last.glt.volumeHl ? last.glt.volumeHl.toFixed(1) : '—'}</td>
              <td>${badge(total.volumeOk)}${total.plannedHl !== null ? ` <span class="br-note">vs ${escapeHtml(fmt(total.plannedHl, 1))} ±${escapeHtml(fmt(total.volumeTolHl, 1))}</span>` : ''}</td>
              <td></td></tr></tbody></table>
        <div class="br-note">The GLT total extract becomes the first measurement of the fermentation log. The total volume is compared with the brews so far × the brew volume (±${VOLUME_TOL_HL} hl per brew). No total pH: a pH cannot be averaged over brews.</div>`;
    }

    // ------------------------------------------------------------ events
    function valueFor(el, kind) {
      if (kind === 'num') {
        const v = parseNumberInput(el.value);
        if (v === undefined) { el.classList.add('bad'); el.title = 'Not a number'; return undefined; }
        el.classList.remove('bad');
        return v;
      }
      if (kind === 'yesno') return el.value === '' ? null : el.value === 'true';
      if (kind === 'datetime') return el.value ? new Date(el.value).toISOString() : null;
      if (kind === 'user' || kind === 'select') return el.value || null;
      return el.value.trim() || null;
    }

    async function saveDraftComment() {
      const text = document.getElementById('bw-draft-comment').value.trim();
      if (!text || page.commentDraft === 'saving') return;
      page.commentDraft = 'saving';
      const brew = document.getElementById('bw-draft-brew').value;
      const saved = await insertRow('batch_brew_comments', {
        batch_id: page.ctx.batch.id, comment: text,
        comment_time: document.getElementById('bw-draft-time').value || null,
        brew_number: brew ? Number(brew) : null,
      }, page.comments);
      page.commentDraft = saved ? false : true;
      renderSoon();
    }

    function bindEvents() {
      const main = document.querySelector('main');
      main.addEventListener('change', (e) => {
        const el = e.target;
        if (dosing.handleChange(el)) return;
        const b = page.ctx.batch;
        if (el.id === 'bw-glt') return saveBatch({ glt_tank_id: el.value ? Number(el.value) : null });
        if (el.id === 'bw-braukon') return saveBatch({ brewhouse_recipe_number: el.value.trim() || null });
        if (el.id === 'bw-pitched-by') return saveBatch({ yeast_pitched_by: el.value || null });
        if (el.id === 'bw-first-day-brews') {
          const n = parseNumberInput(el.value);
          if (n === undefined || (n !== null && !(Number.isInteger(n) && n > 0))) { el.classList.add('bad'); el.title = 'A whole number of brews'; return; }
          el.classList.remove('bad');
          return applyFirstDayBrews(n);
        }
        if (el.id === 'bw-pitched-on') {
          const patch = { yeast_pitched_on: el.value || null };
          if (el.value && !b.yeast_pitched_by) patch.yeast_pitched_by = page.user.id;   // default: who fills it in
          return saveBatch(patch);
        }
        if (el.id === 'bw-draft-comment') return saveDraftComment();
        if (el.dataset.brew) {
          const brew = page.brews.find((x) => x.id === Number(el.dataset.brew));
          const row = BREW_LOG_ROWS.find((r) => r.key === el.dataset.field);
          const value = valueFor(el, row.kind);
          if (value !== undefined) saveBrew(brew, { [row.key]: value });
          return;
        }
        if (el.dataset.comment) {
          const c = page.comments.find((x) => x.id === Number(el.dataset.comment));
          const f = el.dataset.field;
          if (f === 'comment') {
            if (!el.value.trim()) { el.classList.add('bad'); el.title = 'A comment cannot be empty; use the bin to delete it'; return; }
            el.classList.remove('bad');
            return saveComment(c, { comment: el.value.trim() });
          }
          if (f === 'comment_time') return saveComment(c, { comment_time: el.value || null });
          if (f === 'brew_number') return saveComment(c, { brew_number: el.value ? Number(el.value) : null });
        }
      });
      main.addEventListener('click', (e) => {
        const yn = e.target.closest('button[data-yesno]');
        if (yn) return saveBatch({ [yn.dataset.yesno]: page.ctx.batch[yn.dataset.yesno] === (yn.dataset.value === 'true') ? null : yn.dataset.value === 'true' });
        if (e.target.closest('#bw-add-brew')) return addBrew();
        if (e.target.closest('#bw-add-addition')) return openAddAdditionDialog();
        const span = e.target.closest('button[data-span-brew]');
        if (span) {
          const brew = page.brews.find((x) => x.id === Number(span.dataset.spanBrew));
          const row = BREW_LOG_ROWS.find((r) => r.key === span.dataset.spanField);
          return openTimeSpanCalculator({ title: `${row.label} · brew ${brew.brew_number}`, onApply: (min) => saveBrew(brew, { [row.key]: min }) });
        }
        const zincCalc = e.target.closest('button[data-zinc-calc]');
        if (zincCalc) {
          const row = page.ingredients.find((x) => x.id === Number(zincCalc.dataset.zincCalc));
          return openZincCalculator({ brewVolumeHl: page.ctx.recipe.brew_volume_hl, brews: page.ctx.batch.first_day_brew_count,
            onApply: async (dose, brews) => {
              await applyZinc(row, dose);
              if (brews && brews !== page.ctx.batch.first_day_brew_count) await applyFirstDayBrews(brews);
            } });
        }
        if (e.target.closest('#bw-add-comment')) { page.commentDraft = true; return renderSoon('#bw-draft-comment'); }
        const delBrew = e.target.closest('button[data-delete-brew]');
        if (delBrew) {
          const brew = page.brews.find((x) => x.id === Number(delBrew.dataset.deleteBrew));
          return deleteRow('batch_brews', brew, page.brews, `brew ${brew.brew_number}`);
        }
        const delComment = e.target.closest('button[data-delete-comment]');
        if (delComment) return deleteRow('batch_brew_comments', page.comments.find((x) => x.id === Number(delComment.dataset.deleteComment)), page.comments, 'comment');
      });
      main.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && e.target.matches('input.br-in')) e.target.blur();
        if (e.key === 'Escape' && e.target.id === 'bw-draft-comment') { page.commentDraft = false; renderSoon(); }
      });
    }

    async function initBrewingPage() {
      // The batch loads while the user and rights load (RLS guards the data).
      const batchId = batchIdFromUrl();
      const loading = batchId ? loadAll(batchId).then(() => null, (err) => err) : null;
      page.user = await getCurrentUser();
      if (!page.user) return; // nav.js redirects to login
      if (!(await magBekijkenModule('batches'))) {
        showMessage('You do not have access to batch reports. Ask an admin for view rights on "Batches & batch reports".');
        return;
      }
      if (!batchId) { showMessage('No batch chosen. Open a batch from All batches or Active batches.', true); return; }
      page.canEdit = await magBewerkenModule('batches');
      page.canDelete = await magVerwijderenModule('batches');
      const loadError = await loading;
      if (loadError) {
        showMessage('Could not load the batch: ' + (loadError.message || loadError), true);
        return;
      }
      document.title = `Jopen Brouwerij — ${page.ctx.batch.batch_number} Brewing`;
      page.save = renderBatchHeader(document.getElementById('bw-header'), page.ctx, 'brewing');
      showMessage('');
      document.getElementById('bw-content').style.display = 'flex';
      bindEvents();
      renderAll();
    }

    document.addEventListener('DOMContentLoaded', initBrewingPage);
  </script>
</body>
</html>
